.result-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; font-size:13px; }

.btn-toggle{ font-size:11px; font-weight:700; text-transform:uppercase; padding:5px 10px; border-radius:var(--radius); border:1px solid var(--line); background:transparent; color:var(--ink-dim); }

.live-badge.is-live{ background:var(--phosphor-bg); color:var(--phosphor); }

.live-dot{ width:7px; height:7px; border-radius:50%; background:var(--phosphor); display:inline-block; animation:liveblink 1.1s ease-in-out infinite; }

.pitch-wrap{ position:relative; aspect-ratio:109/72; max-width:900px; width:100%; margin:12px auto 4px; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); background:linear-gradient(180deg,#232830,#171b22); box-shadow:inset 0 0 40px rgba(0,0,0,0.45); }

.pitch-turf{ fill:#2f8a4c; }

.pitch-line{ stroke:rgba(255,255,255,0.55); stroke-width:0.35; fill:none; }

.role-btn{ background:var(--surface-2); border:1px solid var(--line); color:var(--ink); font-size:12px; font-weight:600; padding:5px 10px; border-radius:var(--radius); }

/* ---------- utils ---------- */
function rnd(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function choice(arr){ return arr[rnd(0,arr.length-1)]; }
function uid(){ return 'id'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function poisson(lambda){
  var L = Math.exp(-lambda), k=0, p=1;
  do{ k++; p*=Math.random(); } while(p>L);
  return k-1;
}
function fmtMoney(v){
  if(v>=1000000) return '$'+(v/1000000).toFixed(2)+'M';
  if(v>=1000) return '$'+Math.round(v/1000)+'k';
  return '$'+v;
}
function ordinal(n){ return n+'º'; }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

var CREST_STOPWORDS = ['de','del','la','el','los','las','fc','cf','afc','sc','ac','club','deportivo'];
function clubInitials(name){
  var words = String(name).replace(/[^\p{L}\p{N} ]/gu,'').split(' ').filter(Boolean);
  var meaningful = words.filter(function(w){ return CREST_STOPWORDS.indexOf(w.toLowerCase())===-1; });
  var source = meaningful.length? meaningful : words;
  var code;
  if(source.length>=3) code = source[0][0]+source[1][0]+source[2][0];
  else if(source.length===2) code = source[0].slice(0,2)+source[1][0];
  else if(source.length===1) code = source[0].slice(0,3);
  else code = '??';
  return code.toUpperCase();
}
function idealCrestTextColor(hex){
  var c = String(hex).replace('#','');
  if(c.length===3) c = c.split('').map(function(ch){return ch+ch;}).join('');
  if(c.length!==6) return '#111111';
  var r = parseInt(c.substr(0,2),16), g = parseInt(c.substr(2,2),16), b = parseInt(c.substr(4,2),16);
  var lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum>0.6? '#12161f' : '#f6f8fc';
}
function crestSVG(club, size){
  size = size || 22;
  if(!club) return '<span class="crest" style="display:inline-block;width:'+size+'px;height:'+size+'px;"></span>';
  var initials = clubInitials(club.name);
  var primary = club.color;
  var secondary = club.color2 || '#FFFFFF';
  var textColor = idealCrestTextColor(primary);
  var fontSize = initials.length>=3? 8.2 : 10;
  return '<svg class="crest" width="'+size+'" height="'+Math.round(size*1.08)+'" viewBox="0 0 24 26" aria-hidden="true">'+
    '<path d="M12 0.6 L23 4.1 V13 C23 19.4 18.2 24.2 12 25.6 C5.8 24.2 1 19.4 1 13 V4.1 Z" fill="'+secondary+'" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"></path>'+
    '<path d="M12 2.3 L20.6 5.1 V13 C20.6 18.3 16.9 22.3 12 23.7 C7.1 22.3 3.4 18.3 3.4 13 V5.1 Z" fill="'+primary+'" stroke="rgba(0,0,0,0.3)" stroke-width="0.5"></path>'+
    '<text x="12" y="15.6" text-anchor="middle" font-family="Barlow Condensed, Inter, sans-serif" font-weight="700" font-size="'+fontSize+'" fill="'+textColor+'">'+escapeHtml(initials)+'</text>'+
  '</svg>';
}
function teamChipHTML(club, size){

function genName(usedSet, league){
  var name, tries=0;
  do{ name = choice(league.first)+' '+choice(league.last); tries++; } while(usedSet.has(name) && tries<20);
  usedSet.add(name);
  return name;
}

  if(pos==='DEF'){ def=clamp(def+rnd(6,16),35,98); fis=clamp(fis+rnd(2,10),30,96); por=clamp(por-rnd(15,25),5,40); atq=clamp(atq-rnd(5,15),10,75); }
  if(pos==='MED'){ cre=clamp(cre+rnd(6,16),35,98); def=clamp(def+rnd(0,8),20,88); por=clamp(por-rnd(15,25),5,40); }
  if(pos==='DEL'){ atq=clamp(atq+rnd(8,18),35,99); fis=clamp(fis+rnd(0,8),30,94); por=clamp(por-rnd(15,25),5,40); def=clamp(def-rnd(5,15),10,75); }
  return {atq:atq,cre:cre,def:def,fis:fis,por:por};
}
function overall(p){
  switch(p.pos){
    case 'POR': return Math.round(p.por*0.65 + p.fis*0.20 + p.def*0.15);
    case 'DEF': return Math.round(p.def*0.50 + p.fis*0.25 + p.cre*0.15 + p.atq*0.10);
    case 'MED': return Math.round(p.cre*0.40 + p.def*0.20 + p.fis*0.20 + p.atq*0.20);
    case 'DEL': return Math.round(p.atq*0.55 + p.cre*0.20 + p.fis*0.25);
    default: return 50;
  }
}
/* ---------- roles tácticos ---------- */
/* Cada rol redistribuye el peso de los mismos 5 atributos (ATQ/CRE/DEF/FIS/POR) para calcular
   el aporte del jugador en la simulación de partidos. El rol "por defecto" de cada posición
   reproduce EXACTAMENTE la fórmula de overall() de esa posición, así que un jugador sin rol
   asignado (o con el rol por defecto) juega igual que antes de que existiera este sistema. */
var DEFAULT_ROLE = {POR:'arquero_clasico', DEF:'defensor_central', MED:'box_to_box', DEL:'delantero_completo'};
var ROLE_WEIGHTS = {
  POR: {
    arquero_clasico: {por:0.65, fis:0.20, def:0.15, cre:0, atq:0},
    arquero_libero:  {por:0.55, fis:0.15, def:0.10, cre:0.20, atq:0}
  },
  DEF: {
    defensor_central: {def:0.50, fis:0.25, cre:0.15, atq:0.10, por:0},
    lateral_ofensivo: {def:0.30, fis:0.20, cre:0.25, atq:0.25, por:0},
    libero:           {def:0.40, fis:0.20, cre:0.30, atq:0.10, por:0}
  },
  MED: {
    box_to_box:            {cre:0.40, def:0.20, fis:0.20, atq:0.20, por:0},
    mediocentro_defensivo: {cre:0.20, def:0.45, fis:0.25, atq:0.10, por:0},
    enganche:              {cre:0.55, def:0.05, fis:0.15, atq:0.25, por:0}
  },
  DEL: {
    delantero_completo: {atq:0.55, cre:0.20, fis:0.25, def:0, por:0},
    delantero_area:     {atq:0.70, cre:0.10, fis:0.20, def:0, por:0},
    falso_9:             {atq:0.35, cre:0.45, fis:0.20, def:0, por:0}
  }
};
var ROLE_LABEL = {
  arquero_clasico:'Arquero clásico', arquero_libero:'Arquero-líbero',
  defensor_central:'Defensor central', lateral_ofensivo:'Lateral ofensivo', libero:'Líbero',
  box_to_box:'Box-to-box', mediocentro_defensivo:'Mediocentro defensivo', enganche:'Enganche',
  delantero_completo:'Delantero completo', delantero_area:'Killer de área', falso_9:'Falso 9'
};
var ROLE_DESC = {
  arquero_clasico:'Prioriza el achique y la salvada bajo palos.',
  arquero_libero:'Sale del área a barrer y ayuda a iniciar la jugada con los pies.',
  defensor_central:'Se concentra en marcar y despejar; poco riesgo hacia adelante.',
  lateral_ofensivo:'Sube por la banda a sumar en ataque; deja más espacio atrás.',
  libero:'Inicia la jugada desde el fondo con pases progresivos.',
  box_to_box:'Reparte esfuerzo parejo entre ataque y defensa.',
  mediocentro_defensivo:'Protege a la defensa y corta circuitos rivales.',
  enganche:'Crea juego entre líneas; poco aporte defensivo.',
  delantero_completo:'Combina definición, juego asociado y físico.',
  delantero_area:'Vive del olfato goleador dentro del área.',
  falso_9:'Baja a buscar el balón y genera juego para sus compañeros.'
};
var ROLE_CODE = {
  arquero_clasico:'POR', arquero_libero:'POR-L',
  defensor_central:'DFC', lateral_ofensivo:'LAT', libero:'LIB',
  box_to_box:'B2B', mediocentro_defensivo:'MCD', enganche:'ENG',
  delantero_completo:'DEL', delantero_area:'KIL', falso_9:'F9'
};
var ATTR_NAME = {atq:'Ataque', cre:'Creación', def:'Marca', fis:'Físico', por:'Portería'};
// los atributos que de verdad pesan en ese rol, leídos de la tabla de pesos
function roleKeyAttrs(roleKey, pos){
  var w = (ROLE_WEIGHTS[pos]||{})[roleKey];
  if(!w) return [];
  return Object.keys(w).filter(function(k){ return w[k] >= 0.2; })
    .sort(function(a,b){ return w[b]-w[a]; })
    .map(function(k){ return ATTR_NAME[k]||k; });
}
// el rol que mejor le queda a este jugador según sus propios atributos
function recommendedRole(p){
  var catalog = ROLE_WEIGHTS[p.pos] || {};
  var best = null, bestVal = -1;
  Object.keys(catalog).forEach(function(rk){
    var w = catalog[rk];
    var val = (p.atq||0)*(w.atq||0) + (p.cre||0)*(w.cre||0) + (p.def||0)*(w.def||0) + (p.fis||0)*(w.fis||0) + (p.por||0)*(w.por||0);
    if(val>bestVal){ bestVal = val; best = rk; }
  });
  return best;
}
function roleOverall(p){
  var catalog = ROLE_WEIGHTS[p.pos];
  if(!catalog) return overall(p);
  var w = catalog[p.role] || catalog[DEFAULT_ROLE[p.pos]];
  if(!w) return overall(p);
  return Math.round((p.atq*(w.atq||0)) + (p.cre*(w.cre||0)) + (p.def*(w.def||0)) + (p.fis*(w.fis||0)) + (p.por*(w.por||0)));
}
function pickInitialRole(pos, a){
  if(pos==='DEF'){
    if(a.cre-a.def>=8) return 'lateral_ofensivo';
    if(a.cre-a.def>=0 && Math.random()<0.3) return 'libero';
    return 'defensor_central';
  }
  if(pos==='MED'){
    if(a.def-a.cre>=10) return 'mediocentro_defensivo';
    if(a.cre-a.atq>=10) return 'enganche';
    return 'box_to_box';
  }
  if(pos==='DEL'){
    if(a.cre-a.atq>=5) return 'falso_9';
    if(a.atq-a.cre>=15) return 'delantero_area';
    return 'delantero_completo';
  }
  if(pos==='POR') return Math.random()<0.2? 'arquero_libero' : 'arquero_clasico';
  return null;
}
/* ROLE_TILT: además de reponderar los propios atributos del jugador (roleOverall), cada rol
   inclina cuánto de ese rendimiento cuenta como aporte ofensivo vs. defensivo del equipo —
   así un lateral ofensivo suma más en ataque a costa de un poco de solidez atrás, por ejemplo.
   Los roles "por defecto" quedan en 1.0/1.0, o sea sin cambios respecto al comportamiento previo. */
var ROLE_TILT = {
  arquero_clasico: {atk:1.0, def:1.0},
  arquero_libero:  {atk:1.15, def:0.95},
  defensor_central:{atk:1.0, def:1.0},
  lateral_ofensivo:{atk:1.20, def:0.88},
  libero:          {atk:1.10, def:0.95},
  box_to_box:      {atk:1.0, def:1.0},
  mediocentro_defensivo:{atk:0.85, def:1.15},
  enganche:        {atk:1.20, def:0.85},
  delantero_completo:{atk:1.0, def:1.0},
  delantero_area:  {atk:1.10, def:0.95},
  falso_9:         {atk:1.05, def:0.95}
};
function roleTilt(p, kind){
  var t = ROLE_TILT[p.role];
  return t? (t[kind]||1) : 1;
}
function roleGoalBias(p){
  if(p.pos==='DEL' && p.role==='delantero_area') return 1.3;
  if(p.pos==='DEF' && p.role==='lateral_ofensivo') return 1.25;
  return 1;
}
function roleAssistBias(p){
  if(p.role==='enganche' || p.role==='falso_9' || p.role==='libero' || p.role==='arquero_libero') return 1.3;
  return 1;
}
function marketValue(p){
  var ov = overall(p), age = p.age, ageFactor;
  if(age<=20) ageFactor=1.25; else if(age<=29) ageFactor=1.0; else if(age<=32) ageFactor=0.55; else ageFactor=0.25;
  var potBonus = Math.max(0, p.potential-ov)*400;
  var val = Math.pow(ov,2.15)*35*ageFactor + potBonus;
  return Math.max(15000, Math.round(val/500)*500);
}
/* ---------- contratos y finanzas ---------- */
function playerWage(p){
  var ov = overall(p);
  var ageFactor = p.age<=20? 0.70 : p.age<=29? 1.0 : p.age<=32? 0.85 : 0.55;
  var base = Math.pow(ov,2.3)/90;
  return Math.max(80, Math.round(base*ageFactor/10)*10);
}
function totalWageBill(club){
  return club.players.reduce(function(s,p){ return s+(p.wage||0); }, 0);
}
function matchdayIncome(club){
  var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
  var rep = league? league.reputation : 3;
  var base = club.tier*900 + rep*500;
  return Math.max(0, Math.round((base+rnd(-150,150))/10)*10);
}
function applyFinances(){
  var myClub = getMyClub();
  state.teams.forEach(function(club){
    var income = matchdayIncome(club);
    var wages = totalWageBill(club);
    var before = club.budget;
    club.budget += income - wages;
    club.lastFinance = {income:income, wages:wages};
    if(myClub && club.id===myClub.id){
      if(before>=0 && club.budget<0){
        state.ticker = ['Las finanzas del club entraron en números rojos.'].concat(state.ticker||[]).slice(0,40);
      }
      if(club.budget < -250000){
        state.manager.jobSecurity = clamp(state.manager.jobSecurity-2, 0, 100);
      }
      checkRaiseRequests(club);
      maybeIncomingBids(club);
    }
  });
}
// el que juega bien y cobra poco pide aumento (uno por fecha como mucho); mientras no se lo des, la moral le baja de a poco
function squadAvgOverall(club){
  return club.players.length? club.players.reduce(function(s,p){ return s+overall(p); },0)/club.players.length : 60;
}
function raiseWanted(p){ return Math.round(playerWage(p)*1.05/10)*10; }
function checkRaiseRequests(club){
  var avg = squadAvgOverall(club), asked = false;
  club.players.forEach(function(p){
    var market = playerWage(p);
    if(p.raiseAsk){
      if((p.contractYears||0)<=1 || market < (p.wage||0)*1.08){ p.raiseAsk = null; return; }
      var m = p.morale!==undefined? p.morale : 75;
      if(m>45) p.morale = m-1;
      return;
    }
    if(asked || p.loanFrom || (p.contractYears||0)<2 || p.age>32 || overall(p)<avg) return;
    if(market < (p.wage||0)*1.2) return;
    asked = true;
    p.raiseAsk = {season:state.season, want:raiseWanted(p)};
    pushNews({kind:'club', clubId:club.id, playerId:p.id,
      headline: String(p.name).split(' ').pop().toUpperCase()+' PIDE UN AUMENTO',
      body: p.name+' cobra '+fmtMoney(p.wage||0)+' por fecha y su representante dice que hoy vale '+fmtMoney(p.raiseAsk.want)+'. Mientras no le mejoren el contrato, va a andar con la cabeza en otro lado.',
      tags:[club.name, p.name, 'Contratos']});
  });
}
function grantRaise(playerId){
  var club = getMyClub();
  var p = club? club.players.find(function(x){ return x.id===playerId; }) : null;
  if(!p) return {ok:false, msg:'No se encontró al jugador.'};
  var want = p.raiseAsk? p.raiseAsk.want : raiseWanted(p);
  p.wage = Math.max(p.wage||0, want);
  p.raiseAsk = null;
  p.morale = clamp((p.morale!==undefined? p.morale : 75)+8, 0, 100);
  return {ok:true, msg:'Le diste el aumento a '+p.name+': ahora cobra '+fmtMoney(p.wage)+' por fecha.'};
}
// para avisar cuánto sale renovar (mismo cálculo que renewContract, con el bono a mitad de rango)
function renewalEstimate(p, years){
  var w = Math.round(playerWage(p)*(1+clamp((years-1)*0.06,0,0.3))/10)*10;
  return {wage:w, bonus:Math.round(w*12/500)*500};
}
function newsRenewal(club, p, years){
  pushNews({kind:'club', clubId:club.id, playerId:p.id,
    headline: String(p.name).split(' ').pop().toUpperCase()+' RENUEVA CON EL '+club.name.toUpperCase(),
    body: p.name+' estampó la firma por '+years+' temporadas más. El club asegura a uno de los suyos y despeja dudas sobre su futuro.',
    tags:[club.name, p.name]});
}
function renewContract(playerId, years, withClause){
  var club = getMyClub();
  if(!club) return {ok:false, msg:'No dirigís ningún club.'};
  var p = club.players.find(function(x){return x.id===playerId;});
  if(!p) return {ok:false, msg:'No se encontró al jugador.'};
  if(p.loanFrom) return {ok:false, msg:p.name+' está a préstamo: el contrato es con su club.'};
  var newWage = playerWage(p);
  var raiseFactor = 1 + clamp((years-1)*0.06, 0, 0.3) + (withClause? 0.08 : 0);
  var finalWage = Math.round(newWage*raiseFactor/10)*10;
  var signingBonus = Math.round(finalWage*rnd(9,15)/500)*500;
  if(club.budget<signingBonus) return {ok:false, msg:'No tenés presupuesto para renovarle el contrato a '+p.name+' (bono de firma: '+fmtMoney(signingBonus)+').'};
  club.budget -= signingBonus;
  p.wage = finalWage;
  p.contractYears = years;
  p.releaseClause = withClause? Math.round(marketValue(p)*1.4/500)*500 : null;
  p.raiseAsk = null;
  newsRenewal(club, p, years);
  return {ok:true, msg:'Renovaste el contrato de '+p.name+' por '+years+' temporada'+(years===1?'':'s')+' (salario '+fmtMoney(finalWage)+'/fecha'+(withClause?', con cláusula de rescisión':'')+').'};
}
function buyViaReleaseClause(playerId, ownerClubId){
  var myClub = getMyClub();
  if(!myClub) return {ok:false, msg:'No dirigís ningún club.'};
  var ownerClub = state.teams.find(function(t){return t.id===ownerClubId;});
  if(!ownerClub) return {ok:false, msg:'Club no encontrado.'};
  if(ownerClub.id===myClub.id) return {ok:false, msg:'Ese jugador ya es tuyo.'};
  var idx = ownerClub.players.findIndex(function(p){return p.id===playerId;});
  if(idx===-1) return {ok:false, msg:'El jugador ya no está disponible.'};
  var player = ownerClub.players[idx];
  if(player.loanFrom) return {ok:false, msg:player.name+' está a préstamo en el '+ownerClub.name+': no se puede pagar la cláusula.'};
  if(!player.releaseClause) return {ok:false, msg:'Ese jugador no tiene cláusula de rescisión.'};
  if(myClub.players.length>=23) return {ok:false, msg:'Tu plantel ya tiene el máximo de 23 jugadores.'};
  var amount = player.releaseClause;
  if(myClub.budget<amount) return {ok:false, msg:'No tenés presupuesto para pagar la cláusula ('+fmtMoney(amount)+').'};
  ownerClub.players.splice(idx,1);
  ownerClub.lineup = ownerClub.lineup.filter(function(id){return id!==player.id;});
  if(ownerClub.tactics.penaltyTaker===player.id) ownerClub.tactics.penaltyTaker = null;
  if(ownerClub.tactics.freeKickTaker===player.id) ownerClub.tactics.freeKickTaker = null;
  if(ownerClub.lineup.length<11) autoLineup(ownerClub);
  ownerClub.budget += amount;
  myClub.budget -= amount;
  player.releaseClause = null;
  player.wage = playerWage(player);
  player.contractYears = rnd(2,4);
  myClub.players.push(player);
  pushNews({kind:'transfer', clubId:myClub.id, playerId:player.id,
    headline: 'EL '+myClub.name.toUpperCase()+' PAGA LA CLÁUSULA DE '+String(player.name).split(' ').pop().toUpperCase(),
    body: myClub.name+' depositó '+fmtMoney(amount)+' para ejecutar la cláusula de rescisión de '+player.name+', que deja el '+ownerClub.name+' y firma por '+player.contractYears+' temporadas.',
    tags:[myClub.name, ownerClub.name, 'Mercado']});
  return {ok:true, msg:'Pagaste la cláusula de rescisión de '+player.name+' ('+fmtMoney(amount)+'). Se suma a tu plantel con contrato nuevo.'};
}
function genPlayer(pos, tierBase, usedNames, league){
  var age = rnd(17,34);
  var a = genAttrs(pos, tierBase);
  var player = { id:uid(), name:genName(usedNames, league), pos:pos, age:age, nat:(league.country||null),
    atq:a.atq, cre:a.cre, def:a.def, fis:a.fis, por:a.por, morale:rnd(60,90), goals:0, fitness:100, injuryWeeks:0,
    suspensionMatches:0, yellowCardsSeason:0,
    role: pickInitialRole(pos, a) };
  var ov = overall(player);
  var potAdd = age<=21? rnd(4,22) : age<=25? rnd(0,10) : 0;
  player.potential = clamp(ov+potAdd, ov, 99);
  player.value = marketValue(player);
  player.wage = playerWage(player);
  player.contractYears = rnd(2,4);
  player.releaseClause = (ov>=75 && Math.random()<0.15)? Math.round(player.value*1.35/500)*500 : null;
  return player;
}
/* STAR_OFFSET: within a real club's own roster, "star" (1-5) is a relative importance rating among
   teammates (5 = the club's best/most important players, 1 = fringe backups). We turn that into an
   attribute-generation offset layered on top of the club/league baseline, so a club's real stars end
   up meaningfully better than its real fringe players without needing cross-league calibration. */
var STAR_OFFSET = {1:-16, 2:-6, 3:4, 4:16, 5:28};
function genRealPlayer(spec, tierBase){
  var qOffset = STAR_OFFSET[spec.star]!==undefined? STAR_OFFSET[spec.star] : 0;
  var a = genAttrs(spec.pos, tierBase + qOffset);
  var player = { id:uid(), name:spec.name, pos:spec.pos, age:spec.age, nat:spec.nat||null,
    atq:a.atq, cre:a.cre, def:a.def, fis:a.fis, por:a.por, morale:rnd(60,90), goals:0, fitness:100, injuryWeeks:0,
    suspensionMatches:0, yellowCardsSeason:0,
    role: pickInitialRole(spec.pos, a) };
  var ov = overall(player);
  var potAdd = player.age<=21? rnd(4,22) : player.age<=25? rnd(0,10) : 0;
  player.potential = clamp(ov+potAdd, ov, 99);
  player.value = marketValue(player);
  player.wage = playerWage(player);
  player.contractYears = rnd(2,4);
  player.releaseClause = (ov>=75 && Math.random()<0.15)? Math.round(player.value*1.35/500)*500 : null;
  return player;
}
function leagueOffset(league){ return (league.reputation-3)*7; }
function genSquad(meta, league){
  var tierBase = TIER_BASE[meta.tier] + leagueOffset(league);
  if(meta.roster && meta.roster.length){
    return meta.roster.map(function(spec){ return genRealPlayer(spec, tierBase); });
  }
  var usedNames = new Set();
  var comp = [['POR',2],['DEF',6],['MED',6],['DEL',4]];
  var players = [];
  comp.forEach(function(pair){
    for(var i=0;i<pair[1];i++) players.push(genPlayer(pair[0], tierBase, usedNames, league));
  });
  return players;
}

/* ---------- fitness / injuries ---------- */
function isInjured(p){ return !!(p && p.injuryWeeks && p.injuryWeeks>0); }
function isSuspended(p){ return !!(p && p.suspensionMatches && p.suspensionMatches>0); }
function isUnavailable(p){ return isInjured(p) || isSuspended(p); }
function playerFitness(p){ return p && p.fitness!==undefined? p.fitness : 100; }
function effectiveRating(p){
  var fit = playerFitness(p);
  var penalty = Math.max(0, (75-fit))*0.35;
  return overall(p) - penalty;
}
var PERSONALITIES = ['Normal','Decidido','Leal','Profesional','Ambicioso','Generoso','Práctico','Honesto','Ef. incansable'];
// la personalidad es fija para cada jugador: sale de su propio identificador
function playerPersonality(p){
  var h = 0, id = String(p.id);
  for(var i=0;i<id.length;i++) h = (h*31 + id.charCodeAt(i)) % 100000;
  return PERSONALITIES[h % PERSONALITIES.length];
}
// cuánto le afecta al jugador lo que le digas
function personalityWeight(pers){
  if(pers==='Profesional' || pers==='Práctico') return 0.6;
  if(pers==='Decidido' || pers==='Ambicioso') return 1.3;
  if(pers==='Honesto' || pers==='Leal') return 1.0;
  return 1.0;
}
function moodLabel(m){
  if(m>=85) return {text:'Motivado', cls:'is-great'};
  if(m>=70) return {text:'Concentrado', cls:'is-good'};
  if(m>=55) return {text:'Tranquilo', cls:'is-avg'};
  if(m>=40) return {text:'Parece dudoso', cls:'is-avg'};
  return {text:'Parece enfadado', cls:'is-poor'};
}
var TEAM_TALKS = {
  exigir:   {label:'Exigir más',  line:'Les pedís que salgan a comerse la cancha.'},
  elogiar:  {label:'Elogiar',     line:'Les decís que están haciendo un partidazo.'},
  calmar:   {label:'Calmar',      line:'Les bajás la ansiedad y les pedís cabeza fría.'},
  criticar: {label:'Criticar',    line:'Les marcás con dureza todo lo que está saliendo mal.'}
};
// la charla acierta o no según cómo viene el partido y cómo viene jugando cada uno
function applyTeamTalk(lm, club, kind){
  var diff = (lm.mySide==='home'? lm.homeGoals-lm.awayGoals : lm.awayGoals-lm.homeGoals);
  var ids = lm.mySide==='home'? lm.homeOnPitch : lm.awayOnPitch;
  var total = 0, count = 0, best = null;
  ids.forEach(function(id){
    var pl = club.players.find(function(x){ return x.id===id; });
    if(!pl) return;
    var rating = (lm.ratings && lm.ratings[id]!==undefined)? lm.ratings[id] : 6.0;
    var base = 0;
    if(kind==='exigir')   base = diff<0? 6 : (diff===0? 4 : -3);
    if(kind==='elogiar')  base = diff>0? 6 : (diff===0? 1 : -4);
    if(kind==='calmar')   base = diff<0? 3 : (diff===0? 3 : 2);
    if(kind==='criticar') base = rating<6.0? 7 : -9;
    // a quien viene jugando bien no le cae bien que lo aprieten, y al revés
    if(kind==='exigir' && rating>=7.0) base -= 4;
    if(kind==='elogiar' && rating<5.8) base -= 3;
    var delta = Math.round(base*personalityWeight(playerPersonality(pl)));
    pl.morale = clamp((pl.morale!==undefined? pl.morale : 75) + delta, 5, 100);
    total += delta; count++;
    if(!best || delta>best.delta) best = {name:pl.name, delta:delta};
  });
  lm.talkDone = kind;
  var avg = count? total/count : 0;
  lm.talkFeedback = avg>3? 'El vestuario se prendió: la mayoría salió con más ganas.'
    : avg>0.5? 'Te escucharon, aunque sin demasiado fuego.'
    : avg>-1? 'Reacción tibia, ni frío ni calor.'
    : 'No les cayó bien: varios quedaron dolidos.';
  return lm.talkFeedback;
}
function moraleMultiplier(p){
  var m = p.morale!==undefined? p.morale : 75;
  return clamp(1 + (m-75)/100*0.20, 0.90, 1.10);
}
function matchOverall(p){
  return roleOverall(p)*fitnessPerfMult(playerFitness(p))*moraleMultiplier(p);
}
function adjustMorale(club, result){
  var delta = result==='win'? rnd(2,5) : result==='draw'? rnd(-1,1) : -rnd(2,5);
  club.players.forEach(function(p){
    var onPitch = club.lineup.indexOf(p.id)!==-1;
    var m = p.morale!==undefined? p.morale : 75;
    var applied = onPitch? delta : Math.round(delta*0.4);
    p.morale = clamp(m+applied, 0, 100);
  });
}
// cuánto rinde según la condición: fresco 100%, fundido 66%
function fitnessPerfMult(fit){ return clamp(0.66 + (fit/100)*0.34, 0.66, 1.0); }
// lo que vale hoy para el once: la calidad pesada por cómo llega físicamente
function selectionValue(p){ return overall(p)*fitnessPerfMult(playerFitness(p)); }
/* carga de la temporada: cada minuto jugado suma y los días de descanso la van bajando de a poco.
   Jugar cansado carga más. Jugar una vez por semana no la sube del umbral; jugar todo, liga y copa,
   sí: el jugador ya no vuelve fresco (la condición no pasa de un techo) y se lesiona más fácil */
var LOAD_PER_90 = 7, LOAD_DECAY_PER_DAY = 0.025, LOAD_FREE = 50, LOAD_CAP_K = 0.6, LOAD_INJ_K = 40;
function playerLoad(p){ return p && p.load? p.load : 0; }
function loadFitnessCap(p){ return clamp(100 - Math.max(0, playerLoad(p)-LOAD_FREE)*LOAD_CAP_K, 60, 100); }
function loadLabel(p){
  var l = playerLoad(p);
  return l>=LOAD_FREE+15? {text:'Necesita descanso', cls:'is-poor'} : l>=LOAD_FREE? {text:'Cargado', cls:'is-avg'} : null;
}
function fitnessLabel(fit){
  if(fit>=85) return 'Fresco';
  if(fit>=65) return 'Bien';
  if(fit>=45) return 'Cansado';
  return 'Agotado';
}
function medicalRecoveryRate(club){ var lvl = staffLevel(club,'medic'); return 1 + Math.floor((lvl-1)/2); }
/* cuanto desgasta un partido segun edad, puesto y físico: ~24 puntos en 90' a ritmo normal */
var FATIGUE_WEAR_MUL = 1.3;
function fatigueWearFactor(p){
  var age = p && p.age? p.age : 25;
  var f = age<=22? 0.92 : age<=29? 1.0 : age<=32? 1.08 : 1.16;
  if(p && p.pos==='POR') f *= 0.55;
  // el que tiene más físico que el resto de su juego aguanta más (se mide contra su propio nivel, así vale igual en cualquier liga)
  if(p && p.fis!==undefined) f *= clamp(1 - (p.fis - overall(p))/100, 0.85, 1.15);
  return f*FATIGUE_WEAR_MUL;
}
/* fraccion del deficit de condicion que se recupera en tantos días de descanso:
   una semana entera deja al titular casi fresco; tres días entre liga y copa, no */
var RECOVERY_PER_DAY = 0.25;
function recoveryFraction(club, p, days){
  var lvl = staffLevel(club,'medic');
  var k = RECOVERY_PER_DAY + (lvl-1)*0.02;
  var age = p && p.age? p.age : 25;
  k *= age<=22? 1.08 : age<=29? 1.0 : age<=32? 0.93 : 0.86;
  return clamp(1 - Math.pow(1 - clamp(k, 0.05, 0.9), days===undefined? 7 : days), 0, 1);
}
// después de una fecha de liga: si a mitad de semana hay copa, quedan tres días; si no, la semana entera
function recoveryDaysAfterLeague(){
  var c = state && state.cups;
  if(c && c.calendar && c.season===state.season){
    for(var i=0;i<c.calendar.length;i++){ var d = c.calendar[i]; if(!d.played && d.after>0 && d.after===state.matchdayIdx) return 3; }
  }
  return 7;
}
function advanceRecovery(days){
  state.teams.forEach(function(club){
    var rate = medicalRecoveryRate(club);
    club.players.forEach(function(p){
      if(p.injuryWeeks && p.injuryWeeks>0) p.injuryWeeks = Math.max(0, p.injuryWeeks-rate);
      if(p.suspensionMatches && p.suspensionMatches>0) p.suspensionMatches = Math.max(0, p.suspensionMatches-1);
      var fit = playerFitness(p);
      var d = days===undefined? 7 : days;
      // el buen cuerpo médico también ayuda a bajar la carga
      if(p.load) p.load = Math.max(0, p.load*Math.pow(1 - (LOAD_DECAY_PER_DAY + (staffLevel(club,'medic')-1)*0.003), d));
      var cap = loadFitnessCap(p);
      if(fit < cap) p.fitness = clamp(fit + (cap-fit)*recoveryFraction(club, p, days), 0, 100);
    });
  });
}
function ensureFitLineup(club){
  var need = FORMATIONS[club.formation];
  var lineup = club.lineup.slice();
  var changed = false;
  lineup = lineup.filter(function(id){
    var p = club.players.find(function(x){return x.id===id;});
    if(p && isUnavailable(p)){ changed = true; return false; }
    return true;
  });
  POS_ORDER.forEach(function(pos){
    var currentCount = lineup.filter(function(id){ var p=club.players.find(function(x){return x.id===id;}); return p && p.pos===pos; }).length;
    var missing = need[pos]-currentCount;
    if(missing>0){
      var bench = club.players.filter(function(p){ return p.pos===pos && lineup.indexOf(p.id)===-1 && !isUnavailable(p); })
        .sort(function(a,b){ return effectiveRating(b)-effectiveRating(a); });
      for(var i=0;i<missing && i<bench.length;i++){ lineup.push(bench[i].id); changed = true; }
    }
  });
  club.lineup = lineup;
  return changed;
}

/* ---------- staff (cuerpo técnico) ---------- */
var STAFF_ROLES = ['medic','coach','youth'];
var STAFF_LABEL = {medic:'Médico', coach:'Entrenador', youth:'Director de juveniles'};
function staffStars(level){ return '★'.repeat(level)+'☆'.repeat(5-level); }
function genStaffName(league){
  var first = (league && league.first) || FIRST_NAMES_ES;
  var last = (league && league.last) || LAST_NAMES_ES;
  return choice(first)+' '+choice(last);
}
function genStaffMember(role, tierHint, league){
  return { id: uid(), role: role, name: genStaffName(league), age: rnd(32,64), level: clamp(Math.round(tierHint + rnd(-1,1)), 1, 5) };
}
function staffLevel(club, role){
  return (club && club.staff && club.staff[role] && club.staff[role].level) || 1;
}
function staffHireCost(level){ return Math.round(120000*Math.pow(level,1.6)/500)*500; }
function staffPoachCost(level){ return Math.round(staffHireCost(level)*1.6/500)*500; }
function genStaffMarketPool(role){
  var pool = [];
  for(var i=0;i<6;i++) pool.push(genStaffMember(role, rnd(1,5)));
  return pool;
}
function genStaffMarket(){
  var market = {};
  STAFF_ROLES.forEach(function(role){ market[role] = genStaffMarketPool(role); });
  return market;
}
function searchStaffCandidates(myClub, role){
  var results = [];
  state.teams.forEach(function(club){
    if(club.id===myClub.id) return;
    if(!club.staff || !club.staff[role]) return;
    var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
    results.push({staff:club.staff[role], club:club, league:league});
  });
  results.sort(function(a,b){ return b.staff.level-a.staff.level; });
  return results;
}
function hireStaffFromMarket(role, staffId){
  var club = getMyClub();
  if(!club) return {ok:false, msg:'No dirigís ningún club.'};
  if(!state.staffMarket || !state.staffMarket[role]) return {ok:false, msg:'No hay mercado de personal disponible.'};
  var idx = state.staffMarket[role].findIndex(function(s){return s.id===staffId;});
  if(idx===-1) return {ok:false, msg:'Ese candidato ya no está disponible.'};
  var candidate = state.staffMarket[role][idx];
  var cost = staffHireCost(candidate.level);
  if(club.budget<cost) return {ok:false, msg:'No tenés presupuesto suficiente para contratar a '+candidate.name+' ('+fmtMoney(cost)+').'};
  club.budget -= cost;
  club.staff = club.staff || {};
  club.staff[role] = {id:uid(), role:role, name:candidate.name, age:candidate.age, level:candidate.level};
  state.staffMarket[role].splice(idx,1,genStaffMember(role, rnd(1,5)));
  return {ok:true, msg:'Contrataste a '+candidate.name+' como nuevo/a '+STAFF_LABEL[role].toLowerCase()+'.'};
}
function poachStaff(role, clubId, staffId){
  var myClub = getMyClub();
  if(!myClub) return {ok:false, msg:'No dirigís ningún club.'};
  var rival = state.teams.find(function(t){return t.id===clubId;});
  if(!rival || !rival.staff || !rival.staff[role] || rival.staff[role].id!==staffId) return {ok:false, msg:'Ese empleado ya no está disponible.'};
  var target = rival.staff[role];
  var cost = staffPoachCost(target.level);
  if(myClub.budget<cost) return {ok:false, msg:'No tenés presupuesto suficiente para fichar a '+target.name+' ('+fmtMoney(cost)+').'};
  myClub.budget -= cost;
  var rivalLeague = LEAGUES_META.find(function(l){return l.id===rival.leagueId;});
  myClub.staff = myClub.staff || {};
  myClub.staff[role] = target;
  rival.staff[role] = genStaffMember(role, rival.tier||1, rivalLeague);
  return {ok:true, msg:'Convenciste a '+target.name+' de dejar '+rival.name+' para sumarse a tu cuerpo técnico.'};
}
function normalizeStaff(){
  if(!state) return;
  if(!state.staffMarket) state.staffMarket = genStaffMarket();
  state.teams.forEach(function(club){
    var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
    if(!club.staff){
      var medicLevel = club.medicalStaff || 1;
      club.staff = {
        medic: {id:uid(), role:'medic', name:genStaffName(league), age:rnd(35,60), level:medicLevel},
        coach: genStaffMember('coach', club.tier||1, league),
        youth: genStaffMember('youth', club.tier||1, league)
      };
    }
    STAFF_ROLES.forEach(function(role){
      if(!club.staff[role]) club.staff[role] = genStaffMember(role, club.tier||1, league);
    });
    if(!club.youthPlayers) club.youthPlayers = [];
  });
}

/* ---------- juveniles (cantera) ---------- */
function genYouthPlayer(club, league){
  var youthLvl = staffLevel(club,'youth');
  var comp = ['POR','DEF','DEF','MED','MED','DEL'];
  var pos = choice(comp);
  var tierBase = TIER_BASE[club.tier] + leagueOffset(league) - 20 + youthLvl*2;
  var usedNames = new Set(club.players.concat(club.youthPlayers||[]).map(function(p){return p.name;}));
  var player = genPlayer(pos, tierBase, usedNames, league);
  player.age = rnd(15,19);
  var ov = overall(player);
  var potRange = 8 + youthLvl*4;
  player.potential = clamp(ov + rnd(5, potRange), ov, 99);
  player.value = marketValue(player);
  return player;
}
/* camada: cada pretemporada llegan 4 a 6 chicos a las inferiores de tu club; elegís a quiénes sumar.
   A veces viene una joya (más seguido con un buen director de juveniles). Los que no sumás se van. */
var YOUTH_CAP_MINE = 8;
function makeYouthIntake(club, league){
  var lvl = staffLevel(club,'youth');
  var n = 4 + (lvl>=4? 1 : 0) + rnd(0,1), list = [];
  for(var i=0; i<n; i++){
    var yp = genYouthPlayer({tier:club.tier, players:club.players, youthPlayers:(club.youthPlayers||[]).concat(list), staff:club.staff}, league);
    list.push(yp);
  }
  if(Math.random() < 0.15+lvl*0.05){
    var gem = list[rnd(0,list.length-1)];
    gem.potential = clamp(gem.potential+rnd(6,12), overall(gem), 99);
    gem.gem = true;
    gem.value = marketValue(gem);
  }
  return {season:state.season+1, players:list};
}
function youthIntakePending(){
  return !!(state && state.youthIntake && state.youthIntake.players && state.youthIntake.players.length && getMyClub());
}
function newsYouthIntake(club){
  var it = state.youthIntake;
  if(!it || !it.players.length) return;
  var best = it.players.slice().sort(function(a,b){ return b.potential-a.potential; })[0];
  var gem = it.players.find(function(p){ return p.gem; });
  pushNews({kind:'club', clubId:club.id, playerId:best.id,
    headline: 'LLEGÓ LA CAMADA '+it.season+' A LAS INFERIORES DEL '+club.name.toUpperCase(),
    body: it.players.length+' chicos se suman a la prueba. '+(gem? 'En el club hablan maravillas de '+gem.name+' ('+gem.pos+', '+gem.age+' años): dicen que es una joya. ' : 'El de más proyección es '+best.name+' ('+best.pos+', potencial '+best.potential+'). ')+'Tenés que decidir a quiénes sumar a la cantera.',
    tags:[club.name, 'Juveniles']});
}
function intakeSign(playerId){
  var club = getMyClub(), it = state.youthIntake;
  if(!club || !it) return {ok:false, msg:'No hay camada pendiente.'};

function intakePass(playerId){

function intakeSignBest(){
  var club = getMyClub(), it = state.youthIntake;

function releaseYouth(playerId){

/* ---------- lineup ---------- */
function autoLineup(club){
  var need = FORMATIONS[club.formation];
  var lineup = [];
  POS_ORDER.forEach(function(pos){
    // el once sale de quién vale más hoy: un titular fundido deja lugar a un suplente fresco
    var pool = club.players.filter(function(p){ return p.pos===pos && !isUnavailable(p); }).sort(function(a,b){ return selectionValue(b)-selectionValue(a); });
    lineup = lineup.concat(pool.slice(0, need[pos]).map(function(p){ return p.id; }));
  });
  club.lineup = lineup;
}
function toggleStarter(club, playerId){
  var player = club.players.find(function(p){ return p.id===playerId; });
  if(!player) return;
  var need = FORMATIONS[club.formation];
  var isStarter = club.lineup.indexOf(playerId)!==-1;
  if(isStarter){
    club.lineup = club.lineup.filter(function(id){ return id!==playerId; });
    var bench = club.players.filter(function(p){ return p.pos===player.pos && club.lineup.indexOf(p.id)===-1 && !isUnavailable(p); }).sort(function(a,b){ return overall(b)-overall(a); });
    var currentCount = club.lineup.filter(function(id){ var pl=club.players.find(function(x){return x.id===id;}); return pl && pl.pos===player.pos; }).length;
    if(bench.length>0 && currentCount<need[player.pos]) club.lineup.push(bench[0].id);
  } else {
    if(isUnavailable(player)) return;
    var currentInPos = club.lineup.filter(function(id){ var pl=club.players.find(function(x){return x.id===id;}); return pl && pl.pos===player.pos; });
    if(currentInPos.length>=need[player.pos]){
      var sortedAsc = currentInPos.map(function(id){ return club.players.find(function(p){return p.id===id;}); }).sort(function(a,b){ return overall(a)-overall(b); });
      var worst = sortedAsc[0];
      club.lineup = club.lineup.filter(function(id){ return id!==worst.id; });
    }
    club.lineup.push(playerId);
  }
}
function lineupGroupIds(club, pos){
  return club.lineup.filter(function(id){ var p=club.players.find(function(x){return x.id===id;}); return p && p.pos===pos; });
}
function assignToSlot(club, pos, slotIndex, playerId){
  var player = club.players.find(function(p){ return p.id===playerId; });
  if(!player || player.pos!==pos || isUnavailable(player)) return false;
  var need = FORMATIONS[club.formation][pos];
  if(need===undefined || slotIndex<0 || slotIndex>=need) return false;
  var arr = lineupGroupIds(club, pos).slice();
  while(arr.length<need) arr.push(null);
  var existingIdx = arr.indexOf(playerId);
  if(existingIdx!==-1){
    var tmp = arr[slotIndex];
    arr[slotIndex] = playerId;
    arr[existingIdx] = tmp;
  } else {
    arr[slotIndex] = playerId;
  }
  var newGroupIds = arr.filter(function(id){ return id!==null; });
  var restIds = club.lineup.filter(function(id){
    var p = club.players.find(function(x){return x.id===id;});
    return !(p && p.pos===pos);
  });
  var result = [];
  POS_ORDER.forEach(function(po){
    if(po===pos) result = result.concat(newGroupIds);
    else result = result.concat(restIds.filter(function(id){ var p=club.players.find(function(x){return x.id===id;}); return p && p.pos===po; }));
  });
  club.lineup = result;
  return true;
}

/* ---------- fixtures ---------- */
function generateFixtures(teamIds){
  var arr = teamIds.slice();
  var n = arr.length;
  var rounds = [];
  for(var r=0;r<n-1;r++){
    var roundMatches = [];
    for(var i=0;i<n/2;i++) roundMatches.push({home:arr[i], away:arr[n-1-i]});
    rounds.push(roundMatches);
    arr.splice(1,0,arr.pop());
  }
  var secondLeg = rounds.map(function(round){ return round.map(function(m){ return {home:m.away, away:m.home}; }); });
  var all = rounds.concat(secondLeg);
  return all.map(function(matches,idx){ return {round:idx+1, matches:matches, played:false}; });
}

function normalizeManagerExtras(){
  if(!state || !state.manager) return;
  state.teams.forEach(function(club){
    club.players.concat(club.youthPlayers||[]).forEach(function(p){
      if(p.morale===undefined) p.morale = rnd(60,90);
    });
  });
  if(state.manager.promisesUsed===undefined) state.manager.promisesUsed = 0;
  var myClub = getMyClub();
  if(!state.manager.boardObjective || !myClub || state.manager.boardObjective.season!==state.season){
    state.manager.boardObjective = myClub? computeBoardObjective(myClub) : null;
  }
}
// la bandeja de noticias: todo lo importante que pasa queda escrito acá
function pushNews(item){
  if(!state) return;
  if(!Array.isArray(state.news)) state.news = [];
  item.id = uid();
  item.season = state.season;
  item.round = Math.min(state.matchdayIdx+1, totalMatchdays());
  item.read = false;
  state.news.unshift(item);
  state.news = state.news.slice(0, 60);
}
function unreadNews(){
  if(!state || !Array.isArray(state.news)) return 0;
  return state.news.filter(function(x){ return !x.read; }).length;
}
function normalizeNews(){
  if(!state) return;
  if(!Array.isArray(state.news)) state.news = [];
}
function normalizePinned(){
  if(!state) return;
  if(!Array.isArray(state.pinnedViews)) state.pinnedViews = DEFAULT_PINNED_VIEWS.slice();
  else state.pinnedViews = state.pinnedViews.filter(function(id){ return NAV_ITEMS.some(function(p){return p[0]===id;}); }).slice(0,6);
}
function styleFactor(starters, style){
  var pool = starters.filter(function(p){ return p.pos==='MED'||p.pos==='DEL'; });
  if(!pool.length) return 1;
  var avgCre = pool.reduce(function(s,p){return s+p.cre;},0)/pool.length;
  var avgFis = pool.reduce(function(s,p){return s+p.fis;},0)/pool.length;
  if(style==='corto') return clamp(0.9+(avgCre-60)/200, 0.85, 1.15);
  if(style==='directo') return clamp(0.9+(avgFis-60)/200, 0.85, 1.15);
  return 1;
}
function pickTaker(tacticsObj, starters, key, attr){
  var pool = starters.filter(function(p){ return p.pos!=='POR'; });
  if(!pool.length) pool = starters;
  if(!pool.length) return null;
  var chosenId = tacticsObj && tacticsObj[key];
  if(chosenId){
    var chosen = pool.find(function(p){ return p.id===chosenId; });
    if(chosen) return chosen;
  }
  return pool.slice().sort(function(a,b){ return b[attr]-a[attr]; })[0];
}

/* ---------- tactical assistant ---------- */
function fmt1(n){ return (Math.round(n*10)/10).toFixed(1); }
function computeBestXI(club){
  var bestKey = club.formation, bestScore = -1, scores = {};
  Object.keys(FORMATIONS).forEach(function(f){
    var need = FORMATIONS[f];
    var total = 0, count = 0;
    POS_ORDER.forEach(function(pos){
      var pool = club.players.filter(function(p){ return p.pos===pos && !isUnavailable(p); }).sort(function(a,b){ return overall(b)-overall(a); });
      var picks = pool.slice(0, need[pos]);
      picks.forEach(function(p){ total += overall(p); count++; });
      if(picks.length<need[pos]){ total += (need[pos]-picks.length)*20; count += (need[pos]-picks.length); }
    });
    var avg = count? total/count : 0;
    scores[f] = avg;
    if(avg>bestScore){ bestScore = avg; bestKey = f; }
  });
  var need = FORMATIONS[bestKey];
  var xi = [];
  POS_ORDER.forEach(function(pos){
    var pool = club.players.filter(function(p){ return p.pos===pos && !isUnavailable(p); }).sort(function(a,b){ return overall(b)-overall(a); });
    xi = xi.concat(pool.slice(0, need[pos]));
  });
  return {formation:bestKey, formationScore:bestScore, currentFormationScore:scores[club.formation]||0, scores:scores, xi:xi};
}
function tacticalAdviceForXI(xi){
  var power = powerFromPlayers(xi);
  var diff = power.attack - power.defense;
  var mentality = diff>6? 'ofe' : diff<-6? 'def' : 'equ';
  var midFwd = xi.filter(function(p){ return p.pos==='MED'||p.pos==='DEL'; });
  var avgCre = midFwd.length? midFwd.reduce(function(s,p){return s+p.cre;},0)/midFwd.length : 50;
  var avgFis = midFwd.length? midFwd.reduce(function(s,p){return s+p.fis;},0)/midFwd.length : 50;
  var passStyle = (avgCre-avgFis>6)? 'corto' : (avgFis-avgCre>6)? 'directo' : 'mixto';
  var defMed = xi.filter(function(p){ return p.pos==='DEF'||p.pos==='MED'; });
  var avgFisDefMed = defMed.length? defMed.reduce(function(s,p){return s+p.fis;},0)/defMed.length : 50;
  var pressing = avgFisDefMed>=68? 'alta' : avgFisDefMed<=55? 'baja' : 'media';
  var gk = xi.find(function(p){ return p.pos==='POR'; });
  var defs = xi.filter(function(p){ return p.pos==='DEF'; });
  var avgDefOv = defs.length? defs.reduce(function(s,p){return s+overall(p);},0)/defs.length : 50;
  var gkOv = gk? overall(gk) : 50;
  var lineScore = avgDefOv*0.75 + gkOv*0.25;
  var line = lineScore>=68? 'adelantada' : lineScore<=56? 'retrasada' : 'media';
  var width = avgFis>=68? 'amplio' : avgFis<=55? 'estrecho' : 'normal';
  var avgFisAll = xi.length? xi.reduce(function(s,p){return s+p.fis;},0)/xi.length : 50;
  var tempo = avgFisAll>=68? 'rapido' : avgFisAll<=55? 'pausado' : 'normal';
  var marking = avgDefOv>=68? 'al_hombre' : avgDefOv<=56? 'zonal' : 'mixto';
  var penaltyTaker = pickTaker({penaltyTaker:null}, xi, 'penaltyTaker', 'atq');
  var freeKickTaker = pickTaker({freeKickTaker:null}, xi, 'freeKickTaker', 'cre');
  return {
    power:power, mentality:mentality, passStyle:passStyle, avgCre:avgCre, avgFis:avgFis,
    pressing:pressing, avgFisDefMed:avgFisDefMed, line:line, lineScore:lineScore,
    width:width, avgFisAll:avgFisAll, tempo:tempo, marking:marking, avgDefOv:avgDefOv,
    penaltyTaker:penaltyTaker, freeKickTaker:freeKickTaker
  };
}

  }).join('');

function suggestSubstitutions(lm, onPitch, bench){
  if(!canMakeSub(lm)) return [];
  var remaining = Math.max(0, 5-(lm.mySubsUsed||0));
  if(remaining<=0) return [];
  var raw = [];
  onPitch.forEach(function(p){
    var rating = (lm.ratings && lm.ratings[p.id]!==undefined) ? lm.ratings[p.id] : 6.0;
    var fitness = playerFitness(p);
    var injured = isInjured(p);
    var tired = fitness<70;
    var poorForm = lm.clock>=25 && rating<=5.4;
    if(!injured && !tired && !poorForm) return;
    var urgency = (injured?1000:0) + (tired? (72-fitness)*2 : 0) + (poorForm? (5.6-rating)*25 : 0);
    raw.push({p:p, injured:injured, tired:tired, poorForm:poorForm, fitness:fitness, rating:rating, urgency:urgency});
  });
  raw.sort(function(a,b){ return b.urgency-a.urgency; });
  var usedBenchIds = {};
  var suggestions = [];
  raw.forEach(function(item){
    if(suggestions.length>=remaining) return;
    var candidates = bench.filter(function(b){ return b.pos===livePos(item.p) && !isUnavailable(b) && !usedBenchIds[b.id] && (lm.subbedOff||[]).indexOf(b.id)===-1; })
      .sort(function(a,b){ return effectiveRating(b)-effectiveRating(a); });
    if(!candidates.length) return;
    var subIn = candidates[0];
    usedBenchIds[subIn.id] = true;
    var reasonParts = [];
    if(item.injured) reasonParts.push('está lesionado');
    else {
      if(item.tired) reasonParts.push('está agotado ('+Math.round(item.fitness)+'% de condición física)');
      if(item.poorForm) reasonParts.push('viene rindiendo bajo en el partido (calificación '+item.rating.toFixed(1)+')');
    }
    suggestions.push({outP:item.p, inP:subIn, reason:reasonParts.join(' y '), injured:item.injured});
  });
  return suggestions;
}

/* ---------- match engine ---------- */
function manCountFactor(n){ return clamp(1 - Math.max(0,11-n)*0.08, 0.55, 1.0); }
function powerFromPlayers(starters, club){
  var gk = starters.find(function(p){ return p.pos==='POR'; });
  var defs = starters.filter(function(p){ return p.pos==='DEF'; });
  var meds = starters.filter(function(p){ return p.pos==='MED'; });
  var dels = starters.filter(function(p){ return p.pos==='DEL'; });
  function avgAtk(arr){ return arr.length? arr.reduce(function(s,p){return s+matchOverall(p)*roleTilt(p,'atk');},0)/arr.length : 45; }
  function avgDef(arr){ return arr.length? arr.reduce(function(s,p){return s+matchOverall(p)*roleTilt(p,'def');},0)/arr.length : 45; }
  var gkAtk = gk? matchOverall(gk)*roleTilt(gk,'atk') : 45;
  var gkDef = gk? matchOverall(gk)*roleTilt(gk,'def') : 45;
  var attack = avgAtk(dels)*0.53 + avgAtk(meds)*0.35 + avgAtk(defs)*0.10 + gkAtk*0.02;
  var defense = gkDef*0.40 + avgDef(defs)*0.45 + avgDef(meds)*0.15;
  var chemMult = club? chemistryMultiplier(club) : 1;
  return {attack:attack*chemMult, defense:defense*chemMult};
}
function segLambda(attack, defense, mentAtk, mentDef, homeAdv, minutes){
  var base = 1.3;
  var full = clamp(base*(attack*mentAtk)/(defense*mentDef)*homeAdv, 0.2, 4.2);
  return full*(minutes/90);
}
function simulateSegment(homeClub, awayClub, homeIds, awayIds, homeMent, awayMent, homeTactics, awayTactics, minStart, minEnd){
  var homeStarters = homeIds.map(function(id){ return homeClub.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  var awayStarters = awayIds.map(function(id){ return awayClub.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  homeTactics = homeTactics || defaultTactics(); awayTactics = awayTactics || defaultTactics();
  var hp = powerFromPlayers(homeStarters, homeClub), ap = powerFromPlayers(awayStarters, awayClub);
  var hManFactor = manCountFactor(homeStarters.length), aManFactor = manCountFactor(awayStarters.length);
  hp.attack *= hManFactor; hp.defense *= hManFactor;
  ap.attack *= aManFactor; ap.defense *= aManFactor;
  var hMod = MENTALITY[homeMent], aMod = MENTALITY[awayMent];
  var hPress = PRESSING[homeTactics.pressing]||PRESSING.media, aPress = PRESSING[awayTactics.pressing]||PRESSING.media;
  var hLine = LINE_HEIGHT[homeTactics.line]||LINE_HEIGHT.media, aLine = LINE_HEIGHT[awayTactics.line]||LINE_HEIGHT.media;
  var hWidth = WIDTH[homeTactics.width]||WIDTH.normal, aWidth = WIDTH[awayTactics.width]||WIDTH.normal;
  var hTempo = TEMPO[homeTactics.tempo]||TEMPO.normal, aTempo = TEMPO[awayTactics.tempo]||TEMPO.normal;
  var hMarking = MARKING[homeTactics.marking]||MARKING.mixto, aMarking = MARKING[awayTactics.marking]||MARKING.mixto;
  hp.defense *= hMarking.selfDef;
  ap.defense *= aMarking.selfDef;
  var hCardMod = hPress.cardMod * hMarking.cardMod, aCardMod = aPress.cardMod * aMarking.cardMod;
  var homeAtkMult = styleFactor(homeStarters, homeTactics.passStyle) * hPress.selfAtk * hLine.selfAtk * hWidth.selfAtk * hTempo.selfAtk * aPress.rivalAtk * aLine.rivalAtk;
  var awayAtkMult = styleFactor(awayStarters, awayTactics.passStyle) * aPress.selfAtk * aLine.selfAtk * aWidth.selfAtk * aTempo.selfAtk * hPress.rivalAtk * hLine.rivalAtk;
  var duration = minEnd-minStart;
  var lambdaHome = segLambda(hp.attack*homeAtkMult, ap.defense, hMod.atk, aMod.def, 1.12, duration);
  var lambdaAway = segLambda(ap.attack*awayAtkMult, hp.defense, aMod.atk, hMod.def, 0.95, duration);
  var homeGoals = poisson(lambdaHome), awayGoals = poisson(lambdaAway);
  var events = [];
  function addGoals(count, starters, teamKey){
    var scorers = starters.filter(function(p){ return p.pos==='DEL'||p.pos==='MED'; });
    for(var i=0;i<count;i++){
      var minute = rnd(minStart+1, minEnd), scorer;
      if(scorers.length>0){
        var weights = scorers.map(function(p){ return Math.pow(p.atq,1.6)*roleGoalBias(p); });
        var total = weights.reduce(function(a,b){return a+b;},0);
        var r = Math.random()*total;
        scorer = scorers[scorers.length-1];
        for(var j=0;j<scorers.length;j++){ r-=weights[j]; if(r<=0){ scorer=scorers[j]; break; } }
      } else {
        scorer = starters[rnd(0,starters.length-1)];
      }
      var assist = null;
      var assistPool = starters.filter(function(p){ return p.id!==scorer.id; });
      if(assistPool.length && Math.random()<0.62){
        var aw = assistPool.map(function(p){ return Math.pow(p.cre,1.4)*roleAssistBias(p); });
        var atot = aw.reduce(function(a,b){return a+b;},0);
        var ar = Math.random()*atot;
        assist = assistPool[assistPool.length-1];
        for(var k=0;k<assistPool.length;k++){ ar-=aw[k]; if(ar<=0){ assist=assistPool[k]; break; } }
      }
      events.push({minute:minute, type:'goal', team:teamKey, playerId:scorer.id, playerName:scorer.name, assistId:assist?assist.id:null, assistName:assist?assist.name:null});
    }
  }
  addGoals(homeGoals, homeStarters, 'home');
  addGoals(awayGoals, awayStarters, 'away');
  var YELLOW_LIMIT = 5;
  function addCards(starters, teamKey, cardMod){
    var frac = duration/90;
    var pool = starters.filter(function(p){ return p.pos!=='POR'; });
    if(!pool.length) pool = starters;
    for(var i=0;i<2;i++){
      if(Math.random()<0.16*frac*cardMod && pool.length){
        var pl = pool[rnd(0,pool.length-1)];
        pl.yellowCardsSeason = (pl.yellowCardsSeason||0)+1;
        var accum = pl.yellowCardsSeason>=YELLOW_LIMIT;
        if(accum){ pl.suspensionMatches = (pl.suspensionMatches||0)+1; pl.yellowCardsSeason = 0; }
        events.push({minute:rnd(minStart+1,minEnd), type:'yellow', team:teamKey, playerId:pl.id, playerName:pl.name, accumSuspension:accum});
      }
    }
    if(Math.random()<0.035*frac*cardMod && pool.length){
      var pl2 = pool[rnd(0,pool.length-1)];
      var sevRoll = Math.random(), banMatches, reason;
      if(sevRoll<0.55){ banMatches=1; reason='roja directa'; }
      else if(sevRoll<0.88){ banMatches=2; reason='falta grave'; }
      else { banMatches=3; reason='conducta violenta'; }
      pl2.suspensionMatches = (pl2.suspensionMatches||0)+banMatches;
      events.push({minute:rnd(minStart+1,minEnd), type:'red', team:teamKey, playerId:pl2.id, playerName:pl2.name, banMatches:banMatches, reason:reason});
    }
  }
  addCards(homeStarters,'home',hCardMod); addCards(awayStarters,'away',aCardMod);
  function addSetPieces(starters, teamKey, tacticsObj){
    var frac = duration/90, extra = 0;
    if(!starters.length) return extra;
    if(Math.random()<0.045*frac){
      var pk = pickTaker(tacticsObj, starters, 'penaltyTaker', 'atq');
      var minute = rnd(minStart+1, minEnd);
      var chance = clamp(0.72 + (overall(pk)-60)/300, 0.55, 0.9);
      if(Math.random()<chance){
        events.push({minute:minute, type:'goal', subtype:'penal', team:teamKey, playerId:pk.id, playerName:pk.name});
        extra++;
      } else {
        events.push({minute:minute, type:'miss', subtype:'penal', team:teamKey, playerId:pk.id, playerName:pk.name});
      }
    }
    if(Math.random()<0.03*frac){
      var fk = pickTaker(tacticsObj, starters, 'freeKickTaker', 'cre');
      var chance2 = clamp(0.10 + (fk.cre-60)/400, 0.05, 0.2);
      if(Math.random()<chance2){
        events.push({minute:rnd(minStart+1,minEnd), type:'goal', subtype:'libre', team:teamKey, playerId:fk.id, playerName:fk.name});
        extra++;
      }
    }
    return extra;
  }
  homeGoals += addSetPieces(homeStarters,'home',homeTactics);
  awayGoals += addSetPieces(awayStarters,'away',awayTactics);
  var savedHome = 0, savedAway = 0;
  function addShotAttempts(count, starters, teamKey){
    var shooters = starters.filter(function(p){ return p.pos==='DEL'||p.pos==='MED'; });
    var pool = shooters.length? shooters : starters;
    for(var i=0;i<count;i++){
      if(!pool.length) break;
      var taker, weights = pool.map(function(p){ return Math.pow(p.atq,1.3)*roleGoalBias(p); });
      var total = weights.reduce(function(a,b){return a+b;},0);
      var r = Math.random()*total;
      taker = pool[pool.length-1];
      for(var j=0;j<pool.length;j++){ r-=weights[j]; if(r<=0){ taker=pool[j]; break; } }
      var roll = Math.random(), subtype;
      if(roll<0.34){ subtype='atajada'; if(teamKey==='home') savedHome++; else savedAway++; }
      else if(roll<0.44) subtype='palo';
      else if(roll<0.74) subtype='desviado';
      else subtype='bloqueado';
      events.push({minute:rnd(minStart+1,minEnd), type:'shot', subtype:subtype, team:teamKey, playerId:taker.id, playerName:taker.name});
    }
  }
  var extraShotsHome = poisson(lambdaHome*1.6);
  var extraShotsAway = poisson(lambdaAway*1.6);
  addShotAttempts(extraShotsHome, homeStarters, 'home');
  addShotAttempts(extraShotsAway, awayStarters, 'away');
  var shotsHome = homeGoals + extraShotsHome;
  var shotsAway = awayGoals + extraShotsAway;
  var shotsOnTargetHome = homeGoals + savedHome;
  var shotsOnTargetAway = awayGoals + savedAway;
  var cornersHome = poisson(lambdaHome*0.6*hWidth.cornerMod);
  var cornersAway = poisson(lambdaAway*0.6*aWidth.cornerMod);
  var foulsHome = poisson(9*(duration/90)*hCardMod);
  var foulsAway = poisson(9*(duration/90)*aCardMod);
  function wearDown(starters, teamKey, tempoMod){
    starters.forEach(function(p){
      var fatigueLoss = duration*(0.17+Math.random()*0.07)*(tempoMod||1)*fatigueWearFactor(p);
      p.fitness = clamp(playerFitness(p)-fatigueLoss, 0, 100);
      var riskBase = 0.010*(duration/90);
      var tiredFactor = 1 + Math.max(0,(55-p.fitness))/55;
      var risk = riskBase*tiredFactor;
      if(!isInjured(p) && Math.random()<risk){
        var weeksOut = rnd(1,6);
        p.injuryWeeks = weeksOut;
        events.push({minute:rnd(minStart+1, Math.max(minStart+1,minEnd)), type:'injury', team:teamKey, playerId:p.id, playerName:p.name, weeksOut:weeksOut});
      }
    });
  }
  wearDown(homeStarters,'home',hTempo.fatigueMod);
  wearDown(awayStarters,'away',aTempo.fatigueMod);
  return {homeGoals:homeGoals, awayGoals:awayGoals, events:events, shotsHome:shotsHome, shotsAway:shotsAway,

// cambiar el dibujo en pleno partido: cada uno va al puesto que mejor le queda dentro de la formación nueva
function liveAssignFormation(lm, side, formation){
  if(!FORMATIONS[formation]) return;
  var club = state.teams.find(function(t){ return t.id===(side==='home'? lm.homeId : lm.awayId); });
  var players = (lm[side+'OnPitch']||[]).map(function(id){ return club.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  lm.posOverride = lm.posOverride || {};
  var need = {DEF:FORMATIONS[formation].DEF, MED:FORMATIONS[formation].MED, DEL:FORMATIONS[formation].DEL};
  var gk = players.filter(function(p){ return livePos(p)==='POR'; })[0] || players.filter(function(p){ return p.pos==='POR'; })[0] || null;
  var rest = players.filter(function(p){ return p!==gk; });
  var slots = need.DEF+need.MED+need.DEL;
  // con uno menos, se resigna primero un delantero y después un volante
  while(slots > rest.length){ if(need.DEL>1) need.DEL--; else if(need.MED>2) need.MED--; else if(need.DEF>2) need.DEF--; else need.DEL = Math.max(0, need.DEL-1); slots--; }
  var assign = {};
  ['DEF','MED','DEL'].forEach(function(pos){
    rest.filter(function(p){ return p.pos===pos; }).sort(function(a,b){ return overall(b)-overall(a); })
      .slice(0, need[pos]).forEach(function(p){ assign[p.id] = pos; });
  });
  var left = rest.filter(function(p){ return !assign[p.id]; });
  ['DEF','MED','DEL'].forEach(function(pos){
    var used = rest.filter(function(p){ return assign[p.id]===pos; }).length;
    for(var i=used; i<need[pos]; i++){
      var best = null, bv = -1;
      left.forEach(function(p){ var v = overall({pos:pos, atq:p.atq, cre:p.cre, def:p.def, fis:p.fis, por:p.por}); if(v>bv){ bv = v; best = p; } });
      if(best){ assign[best.id] = pos; left.splice(left.indexOf(best), 1); }
    }
  });
  left.forEach(function(p){ assign[p.id] = 'MED'; });
  if(gk) assign[gk.id] = 'POR';
  players.forEach(function(p){
    var pos = assign[p.id] || p.pos;
    if(pos===p.pos) delete lm.posOverride[p.id]; else lm.posOverride[p.id] = pos;
  });
  lm[side+'Formation'] = formation;
}

function possessionShare(homeOnPitchPlayers, awayOnPitchPlayers, homeTactics, awayTactics){
  function midCre(pool){
    var mids = pool.filter(function(p){ return p.pos==='MED'||p.pos==='DEF'; });
    if(!mids.length) return 50;
    return mids.reduce(function(s,p){return s+p.cre;},0)/mids.length;
  }
  var h = midCre(homeOnPitchPlayers) * (homeTactics.passStyle==='corto'?1.08:homeTactics.passStyle==='directo'?0.92:1);
  var a = midCre(awayOnPitchPlayers) * (awayTactics.passStyle==='corto'?1.08:awayTactics.passStyle==='directo'?0.92:1);
  return clamp(50+(h-a)*0.9, 30, 70);
}
function momentumBaseline(homeMent, awayMent, homeTactics, awayTactics){
  function score(ment, tac){
    var w = WIDTH[tac.width||'normal']||WIDTH.normal, tp = TEMPO[tac.tempo||'normal']||TEMPO.normal;
    return (MENTALITY[ment].atk-1)*40 + (PRESSING[tac.pressing].selfAtk-1)*100 + (LINE_HEIGHT[tac.line].selfAtk-1)*100 + (w.selfAtk-1)*100 + (tp.selfAtk-1)*100;
  }
  var h = score(homeMent, homeTactics), a = score(awayMent, awayTactics);
  return clamp((h-a)*3, -60, 60);
}
function ensureRating(lm, id){ if(lm.ratings[id]===undefined) lm.ratings[id] = 6.0; }
function bumpRating(lm, id, delta){ ensureRating(lm, id); lm.ratings[id] = clamp(lm.ratings[id]+delta, 3.0, 10.0); }
function onPitchGK(players){ return players.filter(function(p){ return p.pos==='POR'; })[0] || null; }
function updateRatings(lm, seg, homeOnPitchPlayers, awayOnPitchPlayers, duration){
  duration = duration || 1;
  seg.events.forEach(function(ev){
    if(ev.type==='goal'){
      bumpRating(lm, ev.playerId, ev.subtype? 1.1 : 1.4);
      if(ev.assistId) bumpRating(lm, ev.assistId, 0.6);
      var concedingGk = onPitchGK(ev.team==='home'? awayOnPitchPlayers : homeOnPitchPlayers);
      if(concedingGk) bumpRating(lm, concedingGk.id, ev.subtype==='penal'? -0.12 : -0.32);
    } else if(ev.type==='shot'){
      if(ev.subtype==='atajada'){
        bumpRating(lm, ev.playerId, 0.06);
        var savingGk = onPitchGK(ev.team==='home'? awayOnPitchPlayers : homeOnPitchPlayers);
        if(savingGk) bumpRating(lm, savingGk.id, 0.14);
      } else if(ev.subtype==='palo'){
        bumpRating(lm, ev.playerId, 0.12);
      } else if(ev.subtype==='desviado' || ev.subtype==='bloqueado'){
        bumpRating(lm, ev.playerId, -0.02);
      }
    } else if(ev.type==='yellow'){
      bumpRating(lm, ev.playerId, -0.4);
    } else if(ev.type==='red'){
      bumpRating(lm, ev.playerId, -1.2);
    } else if(ev.type==='miss' && ev.subtype==='penal'){
      bumpRating(lm, ev.playerId, -0.5);
    }
  });
  // la nota sale sobre todo de lo que cada uno hace en la cancha (lo suma el motor); acá solo
  // se agrega un poco de cómo viene el partido para su equipo, el cansancio y algo de azar
  var momentum = lm.attackMomentum || 0; // -100..100 (positive = home team on top)
  var shotSwing = clamp(seg.shotsHome-seg.shotsAway, -3, 3) * 6;
  var goalDiff = clamp((lm.homeGoals||0)-(lm.awayGoals||0), -3, 3);
  function tickDrift(players, isHome){
    var sideForce = ((isHome? momentum : -momentum) + (isHome? shotSwing : -shotSwing)) / 100;
    var scoreForce = (isHome? goalDiff : -goalDiff) * 0.004;
    players.forEach(function(p){
      var posMult = p.pos==='DEL' ? 1.15 : (p.pos==='DEF'||p.pos==='POR') ? 0.85 : 1.0;
      var momentumDrift = sideForce * 0.006 * posMult * duration;
      var fit = playerFitness(p);
      var fatigueDrift = fit<60 ? -((60-fit)/4000) * duration : 0;
      var noise = (Math.random()*2-1) * 0.02 * Math.sqrt(duration);
      bumpRating(lm, p.id, 0.004*duration + momentumDrift + scoreForce*duration + fatigueDrift + noise);
    });
  }
  tickDrift(homeOnPitchPlayers, true);
  tickDrift(awayOnPitchPlayers, false);
}
function sendOffPlayer(lm, onPitchKey, playerId){
  var onPitch = lm[onPitchKey];
  var idx = onPitch.indexOf(playerId);
  if(idx!==-1) onPitch.splice(idx,1);
}
function tryInjurySub(lm, club, onPitchKey, injuredId){
  var onPitch = lm[onPitchKey];
  var idx = onPitch.indexOf(injuredId);
  if(idx===-1) return;
  var injuredPlayer = club.players.find(function(p){ return p.id===injuredId; });
  if(!injuredPlayer) return;
  var gone = lm.subbedOff || [];
  var bench = club.players.filter(function(p){
    return p.pos===injuredPlayer.pos && onPitch.indexOf(p.id)===-1 && !isUnavailable(p) && gone.indexOf(p.id)===-1;
  }).sort(function(a,b){ return effectiveRating(b)-effectiveRating(a); });
  if(bench.length){
    onPitch[idx] = bench[0].id;
    lm.posOverride = lm.posOverride || {};
    if(lm.posOverride[injuredId]){ lm.posOverride[bench[0].id] = lm.posOverride[injuredId]; delete lm.posOverride[injuredId]; }
    lm.subbedOff = gone.concat([injuredId]);
    lm.events.push({minute:Math.min(lm.clock+1, matchEnd(lm)), type:'sub-injury', team:(onPitchKey==='homeOnPitch'?'home':'away'),
      outId:injuredId, outName:injuredPlayer.name, inId:bench[0].id, inName:bench[0].name});
  }
}
var FLAVOR_LINES = {
  dominant: [

  ],
  neutral: [
    'El partido se pareja en la mitad de la cancha, sin dueño claro de la pelota.',

    'Ida y vuelta sin claras situaciones de gol por ahora.',
    'Partido friccionado, con muchos cortes en la salida.',
    'Ambos equipos se estudian sin sacar diferencias.'
  ]
};
function pickFlavorLine(lm, homeClub, awayClub){
  var m = lm.attackMomentum||0;
  var bucket, atkName, defName;
  if(m>25){ bucket='dominant'; atkName=homeClub.name; defName=awayClub.name; }
  else if(m<-25){ bucket='dominant'; atkName=awayClub.name; defName=homeClub.name; }
  else { bucket='neutral'; atkName=homeClub.name; defName=awayClub.name; }
  var lines = FLAVOR_LINES[bucket];
  var tmpl = lines[rnd(0,lines.length-1)];
  return tmpl.split('{atk}').join(escapeHtml(atkName)).split('{def}').join(escapeHtml(defName));
}
// el cansancio y las lesiones van minuto a minuto, según el ritmo y la presión de cada equipo
function liveWear(lm, club, onPitchKey, side){
  var tac = side==='home'? lm.homeTactics : lm.awayTactics;
  var tempoMod = (TEMPO[tac.tempo]||TEMPO.normal).fatigueMod;
  var pressMod = tac.pressing==='alta'? 1.12 : tac.pressing==='baja'? 0.92 : 1;
  var ment = side==='home'? lm.homeMentality : lm.awayMentality;
  pressMod *= ment==='ofe'? 1.08 : ment==='def'? 0.95 : 1;
  lm[onPitchKey].slice().forEach(function(id){
    var p = club.players.find(function(x){ return x.id===id; });
    if(!p) return;
    p.fitness = clamp(playerFitness(p) - (0.17+Math.random()*0.07)*tempoMod*pressMod*fatigueWearFactor(p), 0, 100);
    p.load = Math.min(100, playerLoad(p) + LOAD_PER_90/90*(1 + (100-p.fitness)/50)*fatigueWearFactor(p)/FATIGUE_WEAR_MUL);
    var risk = (0.010/90) * (1 + Math.max(0,(55-p.fitness))/55) * (1 + Math.max(0, playerLoad(p)-LOAD_FREE)/LOAD_INJ_K);
    if(!isInjured(p) && Math.random()<risk){
      p.injuryWeeks = rnd(1,6);
      engEvent({type:'injury', team:side, playerId:p.id, playerName:p.name, weeksOut:p.injuryWeeks});
      if(anim){
        var pl = animSide(side).filter(function(q){ return q.id===p.id; })[0];
        if(pl) animSay(animName(pl)+' se queda tirado, parece lesionado', side);
      }
      tryInjurySub(lm, club, onPitchKey, p.id);
    }
  });
}
// la IA hace cambios en el segundo tiempo (60', 70' y 80'): saca a los más cansados si tiene en el banco
// a alguien que hoy rinda parecido, hasta dos por ventana y cinco en total (los de lesión cuentan)
var AI_SUB_WINDOWS = {60:72, 70:78, 80:81};
function aiFatigueSubs(lm, homeClub, awayClub, limitOverride, maxSubs){
  var limit = limitOverride || AI_SUB_WINDOWS[lm.clock];
  if(!limit) return;
  var aiSides = lm.mySide? [lm.mySide==='home'? 'away' : 'home'] : ['home','away'];
  aiSides.forEach(function(side){
    var club = side==='home'? homeClub : awayClub;
    var key = side+'OnPitch';
    var gone = lm.subbedOff || [];
    var used = gone.filter(function(id){ return club.players.some(function(p){ return p.id===id; }); }).length;
    var tired = lm[key].map(function(id){ return club.players.find(function(p){ return p.id===id; }); })
      .filter(function(p){ return p && p.pos!=='POR' && playerFitness(p)<limit; })
      .sort(function(a,b){ return playerFitness(a)-playerFitness(b); });
    var made = 0;
    tired.forEach(function(p){
      if(made>=2 || used>=(maxSubs||5)) return;
      var slotPos = (lm.posOverride && lm.posOverride[p.id]) || p.pos;
      var bench = club.players.filter(function(b){
        return b.pos===slotPos && lm[key].indexOf(b.id)===-1 && !isUnavailable(b) && gone.indexOf(b.id)===-1;
      }).sort(function(a,b){ return matchOverall(b)-matchOverall(a); });
      if(!bench.length || matchOverall(bench[0]) < matchOverall(p)*0.97) return;
      var inP = bench[0];
      lm[key] = lm[key].map(function(id){ return id===p.id? inP.id : id; });
      if(lm.posOverride) delete lm.posOverride[p.id];
      gone = gone.concat([p.id]);
      lm.subbedOff = gone;
      used++; made++;
      lm.events.push({minute:Math.min(lm.clock, matchEnd(lm)), type:'sub', team:side, outId:p.id, outName:p.name, inId:inP.id, inName:inP.name});
      if(anim){ var pl = animSide(side).filter(function(q){ return q.id===p.id; })[0]; if(pl) animSay('Cambio: sale '+animName(pl)+', entra '+inP.name, side); }
    });
  });
}
// el rival también lee el partido: si va perdiendo se tira arriba, si gana cerca del final se cierra
function aiLiveAdjust(lm){
  if(lm.clock!==60 && lm.clock!==75) return;
  var aiSides = lm.mySide? [lm.mySide==='home'? 'away' : 'home'] : ['home','away'];
  aiSides.forEach(function(aiSide){
    var diff = aiSide==='home'? lm.homeGoals-lm.awayGoals : lm.awayGoals-lm.homeGoals;
    var key = aiSide+'Mentality';
    if(diff<0) lm[key] = 'ofe';
    else if(diff>0 && lm.clock===75) lm[key] = 'def';
  });
}
// se cierra un minuto de partido: el motor ya jugó, acá se anota lo que dejó
function liveMinuteTick(){
  var lm = state.liveMatch;
  if(!lm) return;
  var homeClub = state.teams.find(function(t){return t.id===lm.homeId;});
  var awayClub = state.teams.find(function(t){return t.id===lm.awayId;});
  if(!homeClub || !awayClub) return;
  var evs = anim? anim.minuteEvents : [];
  if(anim) anim.minuteEvents = [];
  liveWear(lm, homeClub, 'homeOnPitch', 'home');
  liveWear(lm, awayClub, 'awayOnPitch', 'away');
  var homeOn = lm.homeOnPitch.map(function(id){ return homeClub.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  var awayOn = lm.awayOnPitch.map(function(id){ return awayClub.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  if(anim){
    animReconcile(lm, homeClub, awayClub);
    animRefreshPerf();
    var pt = anim.possTime.home + anim.possTime.away;
    if(pt>0) lm.possession = clamp(Math.round(anim.possTime.home/pt*100), 20, 80);
    var terr = (anim.terrMin.home - anim.terrMin.away)/ENGINE_SEC_PER_MIN;
    anim.terrMin = {home:0, away:0};
    if(!lm.flashTeam) lm.attackMomentum = clamp(Math.round((lm.attackMomentum||0)*0.65 + terr*70), -100, 100);
  }
  var shotsH = evs.filter(function(e){ return (e.type==='shot'||e.type==='goal') && e.team==='home'; }).length;
  var shotsA = evs.filter(function(e){ return (e.type==='shot'||e.type==='goal') && e.team==='away'; }).length;
  updateRatings(lm, {events:[], shotsHome:shotsH, shotsAway:shotsA}, homeOn, awayOn, 1);
  if(lm.flashTicks>0){ lm.flashTicks--; if(lm.flashTicks<=0) lm.flashTeam = null; }
  if(!ENGINE_HEADLESS && !evs.length && (lm.clock+1-lm.lastFlavorMinute)>=4 && Math.random()<0.30){
    lm.events.push({minute:lm.clock+1, type:'flavor', text:pickFlavorLine(lm, homeClub, awayClub)});
    lm.lastFlavorMinute = lm.clock+1;
  }
  lm.clock++;
  aiLiveAdjust(lm);
  aiFatigueSubs(lm, homeClub, awayClub);
  if(anim) anim.needRender = true;
  // cada cinco minutos el asistente te sopla lo que está viendo
  if(!ENGINE_HEADLESS && lm.mySide && lm.clock>=10 && lm.clock%5===0){
    var ins = liveInsights(lm);
    lm.tip = ins.length? {text: ins[0].text, minute: lm.clock} : lm.tip;
  }
  if(lm.clock>=matchEnd(lm)){
    if(lm.ko && !lm.extraTime && lm.homeGoals===lm.awayGoals){
      startExtraTime(lm, homeClub, awayClub);
      if(ENGINE_HEADLESS) return;
      sndWhistle('half');
      lm.status = 'paused';
      saveGame();
      return;
    }
    if(ENGINE_HEADLESS){ lm.finished = true; return; }
    sndWhistle('end');
    finalizeLiveMatch();
    saveGame();
    return;
  }
  if(lm.clock===halfEnd(lm)){
    if(!lm.aiTweakDone){
      if(lm.mySide){
        var aiKey = lm.mySide==='home'? 'away':'home';
        aiHalftimeTweak(lm, lm.mySide==='home'? awayClub: homeClub, aiKey);
      } else {
        aiHalftimeTweak(lm, homeClub, 'home');
        aiHalftimeTweak(lm, awayClub, 'away');
      }
      lm.aiTweakDone = true;
    }
    if(ENGINE_HEADLESS){
      if(anim){ animReconcile(lm, homeClub, awayClub); anim.secondHalf = true; animKickoff('away'); }
      return;
    }
    sndWhistle('half');
    lm.status = 'paused';
    if(anim){
      animReconcile(lm, homeClub, awayClub);
      anim.secondHalf = true;
      animKickoff('away');
    }
    saveGame();
    return;
  }
  if(lm.clock % 5 === 0 && !ENGINE_HEADLESS) saveGame();
}
function finalizeLiveMatch(){

  });

    ratings:lm.ratings, homeOnPitch:lm.homeOnPitch.slice(), awayOnPitch:lm.awayOnPitch.slice(), mySide:lm.mySide};

  (function(){
    var mine = lm.mySide==='home'? homeClub : awayClub;
    var rival = lm.mySide==='home'? awayClub : homeClub;
    var myGoals = lm.mySide==='home'? lm.homeGoals : lm.awayGoals;
    var hisGoals = lm.mySide==='home'? lm.awayGoals : lm.homeGoals;
    var motm = lm.ratings? motmFromRatings(lm.ratings, homeClub, awayClub) : null;

      : diff===0? 'REPARTO DE PUNTOS ENTRE EL '+mine.name.toUpperCase()+' Y EL '+rival.name.toUpperCase()
      : 'DERROTA DEL '+mine.name.toUpperCase()+' ANTE EL '+rival.name.toUpperCase();
    var body = 'Terminó '+homeClub.name+' '+lm.homeGoals+' - '+lm.awayGoals+' '+awayClub.name+'. '+
      (diff>0? 'El equipo hizo los deberes y se lleva los puntos.' : diff===0? 'Un empate que deja gusto a poco de los dos lados.' : 'Toca levantar cabeza durante la semana.')+
      (motm? ' La figura de la cancha fue '+motm.p.name+', con '+motm.rating.toFixed(1)+'.' : '');
    pushNews({kind:'match', clubId:mine.id, playerId: motm? motm.p.id : null, headline:head, body:body, tags:[mine.name, rival.name, 'Liga']});
  })();
  // los partidos de la fecha que todavía no se jugaron se cierran antes de la semana de descanso
  flushSims();
  state.matchdayIdx++;
  advanceRecovery(recoveryDaysAfterLeague());
  applyFinances();
  state.lastMatch = record;
  state.liveMatch = null;
  var myClub = getMyClub();
  var myGoals = lm.mySide==='home'? lm.homeGoals: lm.awayGoals;
  var oppGoals = lm.mySide==='home'? lm.awayGoals: lm.homeGoals;
  var oppClub = lm.mySide==='home'? awayClub: homeClub;
  var result = myGoals>oppGoals?'win': myGoals===oppGoals?'draw':'loss';
  adjustJobSecurity(myClub, result, oppClub.tier);
  boardReview(myClub);
  state.manager.tenureMatchdays++;
  checkFired();
  if(state.manager.clubId) maybeUnsolicitedOffer();

/* ---------- dinámica de plantel (jerarquía, cohesión, vestuario) ---------- */
function squadAvgOverall(club){
  var vals = club.players.map(overall);
  return vals.length? vals.reduce(function(s,v){return s+v;},0)/vals.length : 0;
}
function leadershipScore(p){
  var ageFactor = p.age>=35? 6 : p.age>=30? 10 : p.age>=27? 8 : p.age>=24? 4 : 0;
  var m = p.morale!==undefined? p.morale : 75;
  return overall(p)*0.6 + ageFactor + m*0.15;
}
function computeHierarchy(club){
  var players = club.players.slice();
  var byLeadership = players.slice().sort(function(a,b){ return leadershipScore(b)-leadershipScore(a); });
  var captain = byLeadership[0];
  var leaders = byLeadership.slice(1,3);
  var leaderIds = leaders.map(function(p){return p.id;});
  var avgOv = squadAvgOverall(club);
  var result = players.map(function(p){
    var tier;
    if(captain && p.id===captain.id) tier='captain';
    else if(leaderIds.indexOf(p.id)!==-1) tier='leader';
    else {
      var isStarter = club.lineup.indexOf(p.id)!==-1;
      var m = p.morale!==undefined? p.morale : 75;
      if(p.age<=20 && overall(p)<avgOv-6) tier='prospect';
      else if(!isStarter && m<35 && overall(p)>=avgOv-4) tier='discontent';
      else if(isStarter) tier='important';
      else tier='rotation';
    }
    return {player:p, tier:tier};
  });
  var order = {captain:0, leader:1, important:2, rotation:3, prospect:4, discontent:5};
  result.sort(function(a,b){ return order[a.tier]-order[b.tier] || overall(b.player)-overall(a.player); });
  return result;
}
function computeSquadChemistry(club){
  var morales = club.players.map(function(p){return p.morale!==undefined?p.morale:75;});
  var avg = morales.length? morales.reduce(function(s,v){return s+v;},0)/morales.length : 75;
  var variance = morales.length? morales.reduce(function(s,v){return s+Math.pow(v-avg,2);},0)/morales.length : 0;
  var spread = Math.sqrt(variance);
  var discontentCount = club.players.filter(function(p){
    var m = p.morale!==undefined?p.morale:75;
    return m<35 && club.lineup.indexOf(p.id)===-1;
  }).length;
  var score = clamp(Math.round(avg - spread*0.5 - discontentCount*5), 0, 100);
  var label = score>=75? 'Unida' : score>=55? 'Estable' : score>=35? 'Tensa' : 'Fracturada';
  return {score:score, label:label, avgMorale:Math.round(avg), spread:Math.round(spread), discontentCount:discontentCount};
}
function chemistryMultiplier(club){
  if(!club) return 1;
  var chem = computeSquadChemistry(club);
  return clamp(1 + (chem.score-70)/100*0.12, 0.92, 1.06);
}
function promiseMinutes(playerId){
  if(!state.manager) return {ok:false,msg:'No dirigís ningún club.'};
