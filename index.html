}
/* ---------- mercado vivo: otros clubes ofertan por tus jugadores, y hay préstamos ----------
   Las ofertas llegan entre fechas (más seguido si tenés jugadores en la lista de transferibles)
   y vencen a las tres fechas. Los préstamos duran hasta fin de temporada: en la pretemporada
   cada uno vuelve a su club. El sueldo lo paga el club donde está jugando. */
function bidsList(){ if(!Array.isArray(state.incomingBids)) state.incomingBids = []; return state.incomingBids; }
function detachPlayer(club, playerId){
  var idx = club.players.findIndex(function(p){ return p.id===playerId; });
  if(idx===-1) return null;
  var p = club.players.splice(idx,1)[0];
  club.lineup = club.lineup.filter(function(id){ return id!==playerId; });
  if(club.tactics.penaltyTaker===playerId) club.tactics.penaltyTaker = null;
  if(club.tactics.freeKickTaker===playerId) club.tactics.freeKickTaker = null;
  var need = FORMATIONS[club.formation];
  var inPos = club.lineup.filter(function(id){ var pl = club.players.find(function(x){ return x.id===id; }); return pl && pl.pos===p.pos; }).length;
  if(inPos<need[p.pos]){
    var bench = club.players.filter(function(pl){ return pl.pos===p.pos && club.lineup.indexOf(pl.id)===-1 && !isUnavailable(pl); }).sort(function(a,b){ return overall(b)-overall(a); });
    if(bench.length) club.lineup.push(bench[0].id); else autoLineup(club);
  }
  return p;
}
function loanFee(p){ return Math.max(500, Math.round(p.value*0.08/500)*500); }
function maybeIncomingBids(myClub){
  var bids = bidsList();
  state.incomingBids = bids.filter(function(b){ return b.expires>state.matchdayIdx && myClub.players.some(function(p){ return p.id===b.playerId; }); });
  if(state.incomingBids.length>=3) return;
  var listed = myClub.players.some(function(p){ return p.transferListed && !p.loanFrom; });
  if(Math.random() > 0.10+(listed? 0.25 : 0)) return;
  var pool = myClub.players.filter(function(p){ return !p.loanFrom && !state.incomingBids.some(function(b){ return b.playerId===p.id; }); });
  if(!pool.length) return;
  var weights = pool.map(function(p){ return (p.transferListed? 4 : 1)*Math.pow(overall(p)/60, 3)*(p.age<=24? 1.4 : 1); });
  var tot = weights.reduce(function(a,b){ return a+b; },0), r = Math.random()*tot, p = pool[0];
  for(var i=0; i<pool.length; i++){ r -= weights[i]; if(r<=0){ p = pool[i]; break; } }
  var isLoan = p.age<=21 && myClub.lineup.indexOf(p.id)===-1 && Math.random()<0.6;
  var amount = isLoan? loanFee(p) : Math.round(p.value*(p.transferListed? rnd(70,100) : rnd(90,135))/100/500)*500;
  var bidders = state.teams.filter(function(t){
    if(t.id===myClub.id || t.players.length>=25 || t.budget<amount) return false;
    return isLoan? t.tier<=myClub.tier : t.tier>=myClub.tier-1;
  });
  if(!bidders.length) return;
  var bidder = bidders[rnd(0,bidders.length-1)];
  var bid = {id:uid(), playerId:p.id, clubId:bidder.id, amount:amount, kind:isLoan? 'loan' : 'transfer', expires:state.matchdayIdx+3, countered:false};
  state.incomingBids.push(bid);
  pushNews({kind:'transfer', clubId:myClub.id, playerId:p.id,
    headline: isLoan? 'EL '+bidder.name.toUpperCase()+' PIDE A '+String(p.name).split(' ').pop().toUpperCase()+' A PRÉSTAMO' : 'EL '+bidder.name.toUpperCase()+' OFERTA '+fmtMoney(amount)+' POR '+String(p.name).split(' ').pop().toUpperCase(),
    body: isLoan? bidder.name+' quiere a '+p.name+' hasta fin de temporada para darle minutos. Pagaría '+fmtMoney(amount)+' y se haría cargo del sueldo. La oferta vence en tres fechas (Mercado).'
      : bidder.name+' ofreció '+fmtMoney(amount)+' por '+p.name+' (valor de mercado '+fmtMoney(p.value)+'). Tenés tres fechas para contestar desde Mercado.',
    tags:[myClub.name, bidder.name, 'Mercado']});
}
function resolveBid(bidId){
  var b = bidsList().find(function(x){ return x.id===bidId; });
  var club = getMyClub();
  if(!b || !club) return null;
  var bidder = state.teams.find(function(t){ return t.id===b.clubId; });
  var p = club.players.find(function(x){ return x.id===b.playerId; });
  if(!bidder || !p){ state.incomingBids = bidsList().filter(function(x){ return x.id!==bidId; }); return null; }
  return {b:b, club:club, bidder:bidder, p:p};
}
function acceptBid(bidId){
  var r = resolveBid(bidId);
  if(!r) return {ok:false, msg:'Esa oferta ya no está.'};
  if(r.club.players.length<=14) return {ok:false, msg:'No podés: te quedarías con menos de 14 jugadores.'};
  if(r.bidder.budget<r.b.amount) return {ok:false, msg:r.bidder.name+' ya no tiene la plata para cerrar.'};
  var p = detachPlayer(r.club, r.p.id);
  r.club.budget += r.b.amount; r.bidder.budget -= r.b.amount;
  p.transferListed = false;
  if(r.b.kind==='loan'){ p.loanFrom = r.club.id; p.loanSeason = state.season; }
  else { p.wage = playerWage(p); p.contractYears = rnd(2,4); p.releaseClause = null; p.raiseAsk = null; }
  r.bidder.players.push(p);
  state.incomingBids = bidsList().filter(function(x){ return x.playerId!==p.id; });
  pushNews({kind:'transfer', clubId:r.club.id, playerId:p.id,
    headline: r.b.kind==='loan'? String(p.name).split(' ').pop().toUpperCase()+' SE VA A PRÉSTAMO AL '+r.bidder.name.toUpperCase() : String(p.name).split(' ').pop().toUpperCase()+' ES NUEVO JUGADOR DEL '+r.bidder.name.toUpperCase(),
    body: r.b.kind==='loan'? p.name+' juega en el '+r.bidder.name+' hasta fin de temporada y vuelve en la pretemporada. El club cobra '+fmtMoney(r.b.amount)+'.' : r.club.name+' aceptó '+fmtMoney(r.b.amount)+' y '+p.name+' se muda al '+r.bidder.name+'.',
    tags:[r.club.name, r.bidder.name, 'Mercado']});
  return {ok:true, msg: r.b.kind==='loan'? p.name+' se va a préstamo al '+r.bidder.name+' (cobrás '+fmtMoney(r.b.amount)+').' : 'Vendiste a '+p.name+' al '+r.bidder.name+' por '+fmtMoney(r.b.amount)+'.'};
}
function rejectBid(bidId){
  var r = resolveBid(bidId);
  if(!r) return {ok:false, msg:'Esa oferta ya no está.'};
  state.incomingBids = bidsList().filter(function(x){ return x.id!==bidId; });
  // si lo quería un club más grande y no estaba en venta, al jugador no le cae bien
  var upset = r.b.kind==='transfer' && r.bidder.tier>r.club.tier && !r.p.transferListed;
  if(upset) r.p.morale = clamp((r.p.morale!==undefined? r.p.morale : 75)-6, 0, 100);
  return {ok:true, msg:'Rechazaste la oferta del '+r.bidder.name+' por '+r.p.name+'.'+(upset? ' A él le hubiera gustado ir: anda un poco bajoneado.' : '')};
}
function counterBid(bidId){
  var r = resolveBid(bidId);
  if(!r) return {ok:false, msg:'Esa oferta ya no está.'};
  if(r.b.kind!=='transfer' || r.b.countered) return {ok:false, msg:'No se puede pedir más.'};
  var ask = Math.round(r.b.amount*1.2/500)*500;
  if(Math.random()<0.55 && r.bidder.budget>=ask){
    r.b.amount = ask; r.b.countered = true;
    return {ok:true, msg:r.bidder.name+' acepta subir a '+fmtMoney(ask)+'. Ahora decidís vos.'};
  }
  state.incomingBids = bidsList().filter(function(x){ return x.id!==bidId; });
  return {ok:true, msg:r.bidder.name+' no quiso subir la oferta y se bajó.'};
}
function loanOut(playerId){
  var club = getMyClub();
  if(!club) return {ok:false, msg:'No dirigís ningún club.'};
  var p = club.players.find(function(x){ return x.id===playerId; });
  if(!p) return {ok:false, msg:'No se encontró al jugador.'};
  if(p.loanFrom) return {ok:false, msg:p.name+' ya está a préstamo en tu club.'};
  if(club.players.length<=14) return {ok:false, msg:'No podés: te quedarías con menos de 14 jugadores.'};
  // un club de igual o menor nivel, donde le den minutos
  var dest = state.teams.filter(function(t){ return t.id!==club.id && t.tier<=club.tier && t.players.length<25; })
    .map(function(t){ var same = t.players.filter(function(x){ return x.pos===p.pos; }); var best = same.length? Math.max.apply(null, same.map(overall)) : 0; return {t:t, d:Math.abs(best-overall(p)), lower:best<=overall(p), same:t.leagueId===club.leagueId}; })
    .sort(function(a,b){ return (b.same-a.same) || (b.lower-a.lower) || (a.d-b.d); });
  if(!dest.length) return {ok:false, msg:'No apareció ningún club para llevarlo a préstamo.'};
  var to = dest[rnd(0, Math.min(2, dest.length-1))].t;
  detachPlayer(club, p.id);
  p.loanFrom = club.id; p.loanSeason = state.season; p.transferListed = false;
  to.players.push(p);
  state.incomingBids = bidsList().filter(function(x){ return x.playerId!==p.id; });
  pushNews({kind:'transfer', clubId:club.id, playerId:p.id,
    headline: String(p.name).split(' ').pop().toUpperCase()+' SE VA A PRÉSTAMO AL '+to.name.toUpperCase(),
    body: p.name+' va a sumar minutos en el '+to.name+' hasta fin de temporada. Vuelve en la pretemporada.',
    tags:[club.name, to.name, 'Mercado']});
  return {ok:true, msg:p.name+' se va a préstamo al '+to.name+' hasta fin de temporada.'};
}
function requestLoan(){
  var neg = state.negotiation, myClub = getMyClub();
  if(!neg || !myClub) return;
  var owner = state.teams.find(function(t){ return t.id===neg.ownerClubId; });
  var p = owner? owner.players.find(function(x){ return x.id===neg.playerId; }) : null;
  if(!p){ neg.status='rejected'; neg.message='El jugador ya no está disponible.'; return; }
  if(p.loanFrom){ neg.message='Ya está a préstamo: no lo pueden volver a ceder.'; return; }
  if(myClub.players.length>=23){ neg.message='Tu plantel ya tiene el máximo de 23 jugadores.'; return; }
  if(owner.lineup.indexOf(p.id)!==-1 && neg.willingness<60){ neg.message='No lo prestan: es titular en el '+owner.name+'.'; return; }
  var fee = loanFee(p);
  if(myClub.budget<fee){ neg.message='No tenés presupuesto para el préstamo ('+fmtMoney(fee)+').'; return; }
  detachPlayer(owner, p.id);
  if(owner.lineup.length<11) autoLineup(owner);
  owner.budget += fee; myClub.budget -= fee;
  p.loanFrom = owner.id; p.loanSeason = state.season;
  myClub.players.push(p);
  neg.status = 'done';
  neg.message = p.name+' llega a préstamo hasta fin de temporada (pagaste '+fmtMoney(fee)+'). Su sueldo lo pagás vos y en la pretemporada vuelve al '+owner.name+'.';
  pushNews({kind:'transfer', clubId:myClub.id, playerId:p.id,
    headline: String(p.name).split(' ').pop().toUpperCase()+' LLEGA A PRÉSTAMO AL '+myClub.name.toUpperCase(),
    body: p.name+' se suma cedido por el '+owner.name+' hasta fin de temporada.',
    tags:[myClub.name, owner.name, 'Mercado']});
}
// pretemporada: cada cedido vuelve a su club; los chicos que jugaron afuera vuelven un poco mejores
function returnLoans(){
  var back = [];
  state.teams.forEach(function(t){
    t.players.filter(function(p){ return p.loanFrom; }).forEach(function(p){
      var origin = state.teams.find(function(o){ return o.id===p.loanFrom; });
      delete p.loanFrom; delete p.loanSeason;
      if(!origin) return;
      detachPlayer(t, p.id);
      if(p.age<=23 && overall(p)<p.potential){ p.atq=clamp(p.atq+1,10,99); p.cre=clamp(p.cre+1,10,99); p.def=clamp(p.def+1,10,99); p.fis=clamp(p.fis+1,10,99); p.por=clamp(p.por+1,10,99); }
      origin.players.push(p);
      back.push({p:p, origin:origin, from:t});
    });
  });
  var myClub = getMyClub();
  back.forEach(function(x){
    if(myClub && (x.origin.id===myClub.id || x.from.id===myClub.id)){
      state.ticker = [x.p.name+(x.origin.id===myClub.id? ' vuelve de su préstamo en el '+x.from.name : ' termina su préstamo y vuelve al '+x.origin.name)+'.'].concat(state.ticker||[]).slice(0,40);
    }
  });
  state.incomingBids = [];
}
function myLoans(myClub){
  var out = [], inn = myClub.players.filter(function(p){ return p.loanFrom; });
  state.teams.forEach(function(t){ t.players.forEach(function(p){ if(p.loanFrom===myClub.id) out.push({p:p, club:t}); }); });
  return {out:out, inn:inn};
}
function listForTransfer(playerId){
  var club = getMyClub();
  if(!club) return {ok:false,msg:'No dirigís ningún club.'};
  var p = club.players.find(function(x){return x.id===playerId;});
  if(!p) return {ok:false,msg:'No se encontró al jugador.'};
  if(p.loanFrom) return {ok:false,msg:p.name+' está a préstamo: no lo podés poner en venta.'};
  p.transferListed = true;
  p.morale = clamp((p.morale!==undefined?p.morale:75)+5, 0, 100);

}
function sellPlayer(playerId){
  var myClub = getMyClub();
  if(!myClub) return {ok:false,msg:'No dirigís ningún club.'};
  var idx = myClub.players.findIndex(function(p){return p.id===playerId;});
  if(idx===-1) return {ok:false,msg:'No se encontró al jugador.'};
  if(myClub.players.length<=14) return {ok:false,msg:'No podés vender: te quedarías con menos de 14 jugadores.'};
  var p = myClub.players[idx];
  if(p.loanFrom) return {ok:false,msg:p.name+' está a préstamo: vuelve a su club a fin de temporada.'};
  var hierarchyBefore = computeHierarchy(myClub);
  var wasLeader = hierarchyBefore.some(function(h){ return h.player.id===p.id && (h.tier==='captain'||h.tier==='leader'); });
  var income = Math.round(p.value*0.7);
  myClub.budget += income;
  pushNews({kind:'transfer', clubId:myClub.id, playerId:p.id,
    headline: 'EL '+myClub.name.toUpperCase()+' SE DESPRENDE DE '+String(p.name).split(' ').pop().toUpperCase(),
    body: p.name+' deja el '+myClub.name+'. La operación le deja al club '+fmtMoney(income)+'.'+(wasLeader? ' Era una voz de peso en el vestuario, así que el grupo va a sentir la salida.' : ''),
    tags:[myClub.name, 'Mercado']});
  myClub.players.splice(idx,1);
  myClub.lineup = myClub.lineup.filter(function(id){ return id!==playerId; });
  if(myClub.tactics.penaltyTaker===playerId) myClub.tactics.penaltyTaker = null;
  if(myClub.tactics.freeKickTaker===playerId) myClub.tactics.freeKickTaker = null;
  var need = FORMATIONS[myClub.formation];
  var inPos = myClub.lineup.filter(function(id){ var pl=myClub.players.find(function(x){return x.id===id;}); return pl && pl.pos===p.pos; }).length;
  if(inPos<need[p.pos]){
    var bench = myClub.players.filter(function(pl){ return pl.pos===p.pos && myClub.lineup.indexOf(pl.id)===-1; }).sort(function(a,b){ return overall(b)-overall(a); });
    if(bench.length) myClub.lineup.push(bench[0].id);
  }
  if(wasLeader){
    myClub.players.forEach(function(pl){ pl.morale = clamp((pl.morale!==undefined?pl.morale:75) - rnd(4,9), 0, 100); });
  }
  return {ok:true,msg:p.name+' fue vendido por '+fmtMoney(income)+'.'+(wasLeader? ' La salida de un referente golpeó la moral del vestuario.':'')};
}

/* ---------- transfer negotiation ---------- */
function scoutPlayer(playerId, ownerClubId){
  var ownerClub = state.teams.find(function(t){return t.id===ownerClubId;});
  if(!ownerClub) return;
  var player = ownerClub.players.find(function(p){return p.id===playerId;});
  if(!player) return;
  if(player.loanFrom){ toast(player.name+' está a préstamo en el '+ownerClub.name+': no se puede negociar hasta que vuelva a su club.'); return; }
  var isStarter = ownerClub.lineup.indexOf(playerId)!==-1;
  var ov = overall(player);
  var moraleAdj = player.morale!==undefined? (75-player.morale)*0.3 : 0;
  var willingness = clamp(70 - (isStarter?35:0) - Math.max(0, ov-65)*0.8 + (player.age>=31?20:0) - (ownerClub.tier>=4?10:0) + moraleAdj + (player.transferListed?15:0) + rnd(-8,8), 3, 95);
  var askingPrice = Math.round(player.value * (1 + (100-willingness)/100*0.9) / 500) * 500;
  state.negotiation = { playerId:playerId, ownerClubId:ownerClubId, playerName:player.name, playerValue:player.value,
    askingPrice:askingPrice, willingness:willingness, status:'open', lastOffer:0, counterOffer:null, message:null };
  pendingOfferAmount = 0;
}

/* ---------- global player search ---------- */
function estimateWillingness(player, ownerClub){
  var isStarter = ownerClub.lineup.indexOf(player.id)!==-1;
  var ov = overall(player);
  var moraleAdj = player.morale!==undefined? (75-player.morale)*0.3 : 0;
  return clamp(70 - (isStarter?35:0) - Math.max(0, ov-65)*0.8 + (player.age>=31?20:0) - (ownerClub.tier>=4?10:0) + moraleAdj + (player.transferListed?15:0), 3, 95);
}
function willingnessLabel(w){
  if(w>=65) return {text:'Muy interesado', cls:'is-great'};
  if(w>=45) return {text:'Interesado', cls:'is-good'};
  if(w>=25) return {text:'Dudoso', cls:'is-avg'};
  return {text:'Difícil', cls:'is-poor'};
}
function interestedRecommendations(myClub){
  var candidates = [];
  state.teams.forEach(function(t){
    if(t.id===myClub.id) return;
    var league = LEAGUES_META.find(function(l){return l.id===t.leagueId;});
    t.players.forEach(function(p){
      var w = estimateWillingness(p, t);
      if(w>=55 && overall(p)>=60) candidates.push({p:p, club:t, league:league, willingness:w});
    });
  });
  candidates.sort(function(a,b){ return b.willingness-a.willingness || overall(b.p)-overall(a.p); });
  return candidates.slice(0,8);
}
function searchPlayers(myClub, opts){
  var results = [];
  state.teams.forEach(function(club){
    if(club.id===myClub.id) return;
    var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
    club.players.forEach(function(p){ results.push({p:p, club:club, league:league, willingness:estimateWillingness(p, club)}); });
  });
  if(opts.query){
    var q = opts.query.toLowerCase();
    results = results.filter(function(r){ return r.p.name.toLowerCase().indexOf(q)!==-1; });
  }
  if(opts.pos) results = results.filter(function(r){ return r.p.pos===opts.pos; });
  if(opts.leagueId) results = results.filter(function(r){ return r.club.leagueId===opts.leagueId; });
  if(opts.maxAge) results = results.filter(function(r){ return r.p.age<=opts.maxAge; });
  if(opts.minAge) results = results.filter(function(r){ return r.p.age>=opts.minAge; });
  if(opts.minOverall) results = results.filter(function(r){ return overall(r.p)>=opts.minOverall; });
  if(opts.maxOverall) results = results.filter(function(r){ return overall(r.p)<=opts.maxOverall; });
  if(opts.minPotential) results = results.filter(function(r){ return r.p.potential>=opts.minPotential; });
  if(opts.onlyClause) results = results.filter(function(r){ return !!r.p.releaseClause; });
  if(opts.maxClause) results = results.filter(function(r){ return !!r.p.releaseClause && r.p.releaseClause<=opts.maxClause; });
  if(opts.minWillingness) results = results.filter(function(r){ return r.willingness>=opts.minWillingness; });
  var sortFns = {
    ovr_desc: function(a,b){ return overall(b.p)-overall(a.p); },
    ovr_asc: function(a,b){ return overall(a.p)-overall(b.p); },
    age_asc: function(a,b){ return a.p.age-b.p.age; },
    age_desc: function(a,b){ return b.p.age-a.p.age; },
    value_asc: function(a,b){ return a.p.value-b.p.value; },
    value_desc: function(a,b){ return b.p.value-a.p.value; },
    pot_desc: function(a,b){ return b.p.potential-a.p.potential; },
    will_desc: function(a,b){ return b.willingness-a.willingness; },
    clause_asc: function(a,b){
      var av = a.p.releaseClause==null? Infinity : a.p.releaseClause;
      var bv = b.p.releaseClause==null? Infinity : b.p.releaseClause;
      return av-bv;
    },
    clause_desc: function(a,b){
      var av = a.p.releaseClause==null? -Infinity : a.p.releaseClause;
      var bv = b.p.releaseClause==null? -Infinity : b.p.releaseClause;
      return bv-av;
    }
  };
  results.sort(sortFns[opts.sort]||sortFns.ovr_desc);
  return results;
}

/* ---------- scouts: squad-need recommendations ---------- */
function scoutSquadNeeds(club){
  var need = FORMATIONS[club.formation];
  var report = {};
  POS_ORDER.forEach(function(pos){
    var players = club.players.filter(function(p){ return p.pos===pos; }).sort(function(a,b){ return overall(b)-overall(a); });
    var neededCount = need[pos];
    var starters = players.slice(0, neededCount);
    var missingStarters = Math.max(0, neededCount-players.length);
    var weakestStarterOv = starters.length? overall(starters[starters.length-1]) : 0;
    var idealDepth = neededCount+2;
    var depthShortfall = Math.max(0, idealDepth-players.length);
    var urgency = (75-weakestStarterOv) + depthShortfall*7 + missingStarters*20;
    report[pos] = {weakestStarterOv:weakestStarterOv, count:players.length, depthShortfall:depthShortfall, missingStarters:missingStarters, urgency:urgency};
  });
  return report;
}
function scoutRecommendations(club){
  var report = scoutSquadNeeds(club);
  var order = POS_ORDER.slice().sort(function(a,b){ return report[b].urgency-report[a].urgency; });
  var picks = [];
  var seen = {};
  order.slice(0,3).forEach(function(pos){
    var info = report[pos];
    if(info.urgency<=5) return;
    var candidates = [];
    state.teams.forEach(function(t){
      if(t.id===club.id) return;
      var league = LEAGUES_META.find(function(l){return l.id===t.leagueId;});
      t.players.forEach(function(p){
        if(p.pos!==pos) return;
        if(overall(p)<=info.weakestStarterOv+1) return;
        candidates.push({p:p, club:t, league:league});
      });
    });
    candidates.sort(function(a,b){ return overall(b.p)-overall(a.p); });
    candidates.slice(0,3).forEach(function(c){
      if(seen[c.p.id]) return;
      seen[c.p.id] = true;
      var reason;
      var need = FORMATIONS[club.formation];
      if(info.missingStarters>0) reason = 'Te faltan jugadores en '+POS_LABEL[pos]+'s para completar el once.';
      else if(info.depthShortfall>0 && info.weakestStarterOv>=65) reason = 'Tu línea de '+POS_LABEL[pos].toLowerCase()+'s anda bien, pero te falta recambio (tenés '+info.count+', lo ideal son al menos '+(need[pos]+2)+').';
      else reason = 'Tu titular actual en '+POS_LABEL[pos]+' promedia '+info.weakestStarterOv+' de nivel — '+c.p.name+' ('+overall(c.p)+') sería una mejora clara.';
      picks.push({player:c.p, club:c.club, league:c.league, pos:pos, reason:reason});
    });
  });
  return picks.slice(0,8);
}
function completeTransfer(amount){
  var neg = state.negotiation;
  var ownerClub = state.teams.find(function(t){return t.id===neg.ownerClubId;});
  var myClub = getMyClub();
  var idx = ownerClub.players.findIndex(function(p){return p.id===neg.playerId;});
  if(idx===-1){ neg.status='rejected'; neg.message='El jugador ya no está disponible.'; return; }
  if(myClub.players.length>=23){ neg.message='Tu plantel ya tiene el máximo de 23 jugadores.'; return; }
  var player = ownerClub.players[idx];
  ownerClub.players.splice(idx,1);
  ownerClub.lineup = ownerClub.lineup.filter(function(id){return id!==player.id;});
  if(ownerClub.tactics.penaltyTaker===player.id) ownerClub.tactics.penaltyTaker = null;
  if(ownerClub.tactics.freeKickTaker===player.id) ownerClub.tactics.freeKickTaker = null;
  if(ownerClub.lineup.length<11) autoLineup(ownerClub);
  ownerClub.budget += amount;
  myClub.budget -= amount;
  player.releaseClause = null;
  player.wage = playerWage(player);
  player.contractYears = rnd(2,4);
  myClub.players.push(player);
  neg.status = 'done';
  neg.message = player.name+' se sumó a tu plantel por '+fmtMoney(amount)+' con contrato nuevo.';
}
function sendOffer(amount){
  var neg = state.negotiation;
  if(!neg || neg.status==='done') return;
  amount = Math.max(0, Math.round(amount));
  var myClub = getMyClub();
  if(!myClub) return;
  if(amount<=0){ neg.message='Ingresá un monto para ofertar.'; return; }
  if(myClub.budget<amount){ neg.message='No tenés presupuesto para esa oferta.'; return; }
  neg.lastOffer = amount;
  if(amount>=neg.askingPrice){ completeTransfer(amount); return; }
  if(neg.willingness<12){ neg.status='rejected'; neg.message='No está en venta, ni lo consideran.'; return; }
  var floor = neg.askingPrice*(0.5+(100-neg.willingness)/250);
  if(amount<floor){ neg.status='rejected'; neg.message='Rechazaron la oferta: quedó muy lejos de lo que piden.'; return; }
  neg.counterOffer = Math.round(amount + (neg.askingPrice-amount)*0.5/500)*500;
  neg.status = 'counter';
  neg.message = null;
}
function acceptCounter(){
  var neg = state.negotiation;
  if(!neg || neg.status!=='counter' || neg.counterOffer==null) return;
  var myClub = getMyClub();
  if(myClub.budget<neg.counterOffer){ neg.message='No tenés presupuesto para aceptar esa contraoferta.'; return; }
  completeTransfer(neg.counterOffer);
}
function withdrawNegotiation(){ state.negotiation = null; }

/* ---------- manager career ---------- */
function adjustJobSecurity(myClub, result, oppTier){
  if(!myClub) return;
  var diff = myClub.tier - oppTier;
  var delta = 0;
  if(result==='win') delta = diff>=0? 3 : 8;
  else if(result==='draw') delta = diff>=1? -3 : 2;
  else delta = diff>=0? -10 : -3;
  state.manager.jobSecurity = clamp(state.manager.jobSecurity + delta, 0, 100);
  var u = state.manager.ultimatum;
  if(u){ u.points += result==='win'? 3 : result==='draw'? 1 : 0; u.left--; }
}
/* la directiva mira la tabla durante la temporada: si estás lejos del objetivo te aprieta,
   avisa cuando se preocupa y, si la confianza se cae, te da un ultimátum de pocos partidos */
var ULTIMATUM_MATCHES = 5, ULTIMATUM_POINTS = 7;
function boardStanding(myClub){
  var obj = state.manager.boardObjective;
  if(!obj || !myClub) return null;
  var pos = standings(myClub.leagueId).findIndex(function(t){ return t.id===myClub.id; })+1;
  var progress = clamp(state.matchdayIdx/Math.max(1,totalMatchdays()), 0, 1);
  // a principio de temporada la tabla dice poco: el margen se achica a medida que avanza
  var slack = Math.round(obj.leagueSize*0.25*(1-progress));
  var gap = pos - obj.target;
  var status = gap<=0? 'ok' : gap<=slack? 'tight' : 'bad';
  return {pos:pos, gap:gap, slack:slack, progress:progress, status:status};
}
function boardRisk(){
  var js = state.manager.jobSecurity;
  if(state.manager.ultimatum) return {key:'ultimatum', label:'Ultimátum'};
  if(js<35) return {key:'high', label:'Alto'};
  if(js<55) return {key:'mid', label:'Medio'};
  return {key:'low', label:'Bajo'};
}
function boardReview(myClub){
  if(!myClub || !state.manager.clubId) return;
  var st = boardStanding(myClub);
  if(st && st.progress>=0.25){
    if(st.status==='bad') state.manager.jobSecurity = clamp(state.manager.jobSecurity-2, 0, 100);
    else if(st.status==='ok') state.manager.jobSecurity = clamp(state.manager.jobSecurity+1, 0, 100);
  }
  var js = state.manager.jobSecurity, obj = state.manager.boardObjective;
  if(js<40 && state.manager.boardWarnSeason!==state.season && !state.manager.ultimatum){

      body:'En el club esperaban "'+(obj? obj.label : 'otra cosa')+'"'+(st? ' y el equipo está '+ordinal(st.pos)+(obj? ' (el objetivo es terminar '+ordinal(obj.target)+' o mejor)' : '') : '')+'. Por ahora te bancan, pero si los resultados no aparecen pueden darte un ultimátum.',
      tags:[myClub.name, 'Directiva']});

function startUltimatum(myClub){

function generateJobOffers(){
  var myClub = getMyClub();
  var candidates = state.teams.filter(function(t){ return !myClub || t.id!==myClub.id; });
  candidates.sort(function(a,b){
    var da = Math.abs((a.tier*20) - state.manager.reputation);
    var db = Math.abs((b.tier*20) - state.manager.reputation);
    return da-db;
  });
  var pool = candidates.slice(0, 18);
  var picks = [];
  while(picks.length<3 && pool.length){
    var i = rnd(0, pool.length-1);
    picks.push(pool[i]); pool.splice(i,1);
  }
  return picks.map(function(c){
    var league = LEAGUES_META.find(function(l){return l.id===c.leagueId;});
    return { clubId:c.id, clubName:c.name, leagueName:league.name, reputation:c.tier, unsolicited:false };
  });
}
function checkFired(){

      headline: 'EL '+club.name.toUpperCase()+' TE DESTITUYE',

      tags:[club.name, 'Carrera']});

}

/* ---------- junta directiva (objetivos) ---------- */
function clubStrength(club){
  var vals = club.players.slice().sort(function(a,b){ return overall(b)-overall(a); }).slice(0,18).map(overall);
  if(!vals.length) return 0;
  return vals.reduce(function(s,v){return s+v;},0)/vals.length;
}
function computeBoardObjective(club){
  var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
  var leagueClubs = state.teams.filter(function(t){return t.leagueId===club.leagueId;});
  var n = leagueClubs.length;
  var ranked = leagueClubs.slice().sort(function(a,b){ return clubStrength(b)-clubStrength(a); });
  var rank = ranked.findIndex(function(t){return t.id===club.id;})+1;
  var frac = n? rank/n : 1;
  var relegationCount = Math.max(2, Math.round(n*0.15));
  var key, label, target;
  if(frac<=0.15){ key='title'; label='Pelear el título'; target=1; }
  else if(frac<=0.4){ key='top'; label='Terminar entre los primeros puestos'; target=Math.max(4,Math.round(n*0.25)); }
  else if(frac<=0.75){ key='mid'; label='Terminar en la mitad de la tabla'; target=Math.round(n*0.6); }
  else { key='survive'; label='Evitar el descenso'; target=Math.max(1,n-relegationCount); }
  return {key:key, label:label, target:target, leagueName:league.name, leagueSize:n, season:state.season};
}
function upcomingOpponent(myClub){
  var round = state.leagueFixtures[myClub.leagueId][state.matchdayIdx];
  if(!round) return null;
  var myFix = round.matches.find(function(m){ return m.home===myClub.id || m.away===myClub.id; });
  if(!myFix) return null;
  var oppId = myFix.home===myClub.id? myFix.away : myFix.home;
  return state.teams.find(function(t){ return t.id===oppId; });
}
/* ---------- matchday / season orchestration ---------- */
function maybeAdjustCareerAfterMatchday(){
  if(state.manager.clubId) return;
  state.manager.reputation = clamp(state.manager.reputation - 0.4, 0, 100);
  if(state.jobOffers.length===0 && Math.random()<0.35) state.jobOffers = generateJobOffers();
}
/* ---------- los otros partidos de la fecha, con el mismo motor ----------
   Se juegan sin pantalla y en segundo plano (en las pausas, el entretiempo o cuando estás en
   otra sección), así no se traba nada. Antes de que pase la semana se terminan todos.        */
var simPumpHandle = null;
function engineSimMatch(home, away, leagueId, round, ko){
  var savedLm = state.liveMatch, savedAnim = anim, savedStep = ENGINE_STEP;
  var lm = beginLiveMatch(home, away, null, round, leagueId);
  lm.ko = !!ko;
  lm.speed = 'headless';
  state.liveMatch = lm;
  ENGINE_HEADLESS = true;
  ENGINE_STEP = ENGINE_HEADLESS_STEP;
  try{
    anim = null;
    animInit(lm, home, away);
    var guard = 0;
    while(!lm.finished && guard < 20000){
      guard++;
      if(lm.status==='paused') lm.status = 'playing';
      anim.replay = null; anim.panelUntil = 0; anim.hlPending = null;
      engineAdvance(3.0);
    }
  } finally {
    ENGINE_HEADLESS = false;
    ENGINE_STEP = savedStep;
    state.liveMatch = savedLm;
    anim = savedAnim;
  }
  return lm;
}
// la IA arma su equipo mirando al rival: presiona si le gana en físico, adelanta la línea si sus
// defensores son más rápidos que los delanteros de enfrente, y sale a buscarlo solo si es favorita
function aiBestShape(club){
  var best = null;
  Object.keys(FORMATIONS).forEach(function(f){
    var need = FORMATIONS[f], total = 0, count = 0;
    POS_ORDER.forEach(function(pos){
      var pool = club.players.filter(function(p){ return p.pos===pos && !isUnavailable(p); }).sort(function(a,b){ return selectionValue(b)-selectionValue(a); });
      var picks = pool.slice(0, need[pos]);
      picks.forEach(function(p){ total += selectionValue(p); count++; });
      if(picks.length<need[pos]){ total += (need[pos]-picks.length)*20; count += need[pos]-picks.length; }
    });
    // un técnico de la IA no se arriesga con línea de tres sin una razón clara
    var score = (count? total/count : 0) + (need.DEF>=4? 1.5 : 0);
    if(!best || score>best.score) best = {f:f, score:score};
  });
  var need = FORMATIONS[best.f], xi = [];
  POS_ORDER.forEach(function(pos){
    xi = xi.concat(club.players.filter(function(p){ return p.pos===pos && !isUnavailable(p); }).sort(function(a,b){ return selectionValue(b)-selectionValue(a); }).slice(0, need[pos]));
  });
  return {formation:best.f, xi:xi};
}
function aiPlanFor(club, opp){
  var me = aiBestShape(club), them = aiBestShape(opp);
  var adv = tacticalAdviceForXI(me.xi);
  var diff = clubStrength(club) - clubStrength(opp);
  function avg(list, pos, k){ var l = list.filter(function(p){ return pos.indexOf(p.pos)!==-1; }); return l.length? l.reduce(function(s,p){ return s+(p[k]||0); },0)/l.length : 0; }
  var pressEdge = avg(me.xi, ['DEF','MED'], 'fis') - avg(them.xi, ['DEF','MED'], 'fis');
  var lineEdge = avg(me.xi, ['DEF'], 'fis') - avg(them.xi, ['DEL'], 'fis');
  var styleEdge = avg(me.xi, ['MED','DEL'], 'cre') - avg(me.xi, ['MED','DEL'], 'fis');
  return {
    formation: me.formation, xi: me.xi, diff: diff,
    mentality: diff>12? 'ofe' : diff<-12? 'def' : 'equ',
    tactics: {
      passStyle: styleEdge>8? 'corto' : styleEdge<-8? 'directo' : 'mixto',
      pressing: pressEdge>=6? 'alta' : pressEdge<=-8? 'baja' : 'media',
      line: lineEdge>=8? 'adelantada' : lineEdge<=-8? 'retrasada' : 'media',
      width: adv.width==='amplio' && styleEdge<0? 'amplio' : 'normal',
      tempo: 'normal', marking: 'mixto', penaltyTaker:null, freeKickTaker:null
    }
  };
}
// en copa la IA guarda titulares cuando el rival es más flojo (cuanto más flojo, más cambia);
// primero descansan los más cargados. En semis y finales juega con todo.
function aiCupRotate(club, opp, stage){
  if(!stage || stage==='sf' || stage==='final') return 0;
  var gap = clubStrength(club) - clubStrength(opp);
  var n = gap>=6? 4 : gap>=3? 3 : gap>=0? 1 : 0;
  if(n && stage==='r1') n++;
  if(!n) return 0;
  var byId = function(id){ return club.players.find(function(p){ return p.id===id; }); };
  var starters = club.lineup.map(byId).filter(function(p){ return p && (p.pos!=='POR' || gap>=6); })
    .sort(function(a,b){ return (playerLoad(b)-playerLoad(a)) || (overall(b)-overall(a)); });
  var rested = 0;
  starters.forEach(function(p){
    if(rested>=n) return;
    var sub = club.players.filter(function(b){ return b.pos===p.pos && club.lineup.indexOf(b.id)===-1 && !isUnavailable(b); })
      .sort(function(a,b){ return selectionValue(b)-selectionValue(a); })[0];
    if(!sub || selectionValue(sub) < selectionValue(p)*0.8) return;
    club.lineup = club.lineup.map(function(id){ return id===p.id? sub.id : id; });
    rested++;
  });
  return rested;
}
function aiPrepareMatch(club, opp, cupStage){
  var myClub = getMyClub();
  if(myClub && club.id===myClub.id) return null;
  var plan = aiPlanFor(club, opp);
  club.formation = plan.formation;
  autoLineup(club);
  plan.rested = aiCupRotate(club, opp, cupStage);
  club.mentality = plan.mentality;
  club.tactics = plan.tactics;
  return plan;
}
function playSimFixture(item){
  var home = state.teams.find(function(t){ return t.id===item.home; });
  var away = state.teams.find(function(t){ return t.id===item.away; });
  if(!home || !away) return null;
  aiPrepareMatch(home, away);
  aiPrepareMatch(away, home);
  var m = engineSimMatch(home, away, item.leagueId, item.round);
  applyResult(home, m.homeGoals, m.awayGoals);
  applyResult(away, m.awayGoals, m.homeGoals);
  m.events.filter(function(e){ return e.type==='goal'; }).forEach(function(e){
    var club = e.team==='home'? home : away;
    var p = club.players.find(function(pl){ return pl.id===e.playerId; });
    if(p) p.goals = (p.goals||0)+1;
  });
  state.results.push({round:item.round, leagueId:item.leagueId, homeId:home.id, awayId:away.id, homeName:home.name, awayName:away.name,
    homeGoals:m.homeGoals, awayGoals:m.awayGoals,
    events: m.events.filter(function(e){ return e.type==='goal' || e.type==='yellow' || e.type==='red'; }),
    homeShots:m.homeShots, awayShots:m.awayShots, homeXG:Math.round((m.homeXG||0)*10)/10, awayXG:Math.round((m.awayXG||0)*10)/10});
  return home.name+' '+m.homeGoals+'-'+m.awayGoals+' '+away.name;
}
function runSimItem(item){
  var line = item.cup? playCupSim(item) : playSimFixture(item);
  if(line && item.ticker) state.ticker = [line].concat(state.ticker||[]).slice(0,40);
}
// sin club propio: la semana termina cuando se jugó toda la fecha
function finishPendingWeek(){
  var w = state && state.pendingWeek;
  if(!w || (state.pendingSims && state.pendingSims.length)) return;
  state.pendingWeek = null;
  if(w.cupDate!==undefined){ finishCupDate(w.cupDate); saveGame(); return; }
  state.matchdayIdx++;
  advanceRecovery(recoveryDaysAfterLeague());
  applyFinances();
  maybeAdjustCareerAfterMatchday();
  saveGame();
}
function flushSims(){
  if(!state || !state.pendingSims) return;
  while(state.pendingSims.length) runSimItem(state.pendingSims.shift());
  finishPendingWeek();
}
function pumpSims(){
  simPumpHandle = null;
  if(!state || !state.pendingSims || !state.pendingSims.length) return;
  // mientras mirás tu partido en vivo no se juega nada más, para que la cancha no se trabe
  var busy = !!(state.liveMatch && state.liveMatch.status==='playing' && currentView==='partido');
  if(!busy){
    var t0 = Date.now();
    // si estás esperando que pase la semana, se juega más rápido; si no, en ratos chicos
    var budget = state.pendingWeek? 60 : 45;
    while(state.pendingSims.length && Date.now()-t0 < budget) runSimItem(state.pendingSims.shift());
    if(!state.pendingSims.length) finishPendingWeek();
    saveGame();
    if(currentView==='tabla' || (currentView==='inicio' && !state.liveMatch)) render();
  }
  if(state.pendingSims.length) simPumpHandle = setTimeout(pumpSims, busy? 600 : (state.pendingWeek? 16 : 40));
}
function schedulePump(){ if(!simPumpHandle) simPumpHandle = setTimeout(pumpSims, 60); }
function beginMatchday(){
  flushSims();
  var idx = state.matchdayIdx;
  var myClub = getMyClub();
  var tickerLines = [];
  var liveStarted = false;
  var myLineupChanged = false;
  state.teams.forEach(function(club){
    var changed = ensureFitLineup(club);
    if(changed && myClub && club.id===myClub.id) myLineupChanged = true;
  });
  if(myLineupChanged) tickerLines.push('Bajas por lesión te obligaron a modificar el once inicial.');
  var relevantLeague = myClub? myClub.leagueId : (viewingLeagueId || LEAGUES_META[0].id);
  state.pendingSims = state.pendingSims || [];
  LEAGUES_META.forEach(function(league){
    var rounds = state.leagueFixtures[league.id];
    var round = rounds[idx];
    if(!round) return;
    var containsMine = myClub && league.id===myClub.leagueId;
    round.matches.forEach(function(fix){
      var home = state.teams.find(function(t){return t.id===fix.home;});
      var away = state.teams.find(function(t){return t.id===fix.away;});
      var isMyMatch = containsMine && (home.id===myClub.id || away.id===myClub.id);
      var item = {leagueId:league.id, round:round.round, home:home.id, away:away.id};
      if(isMyMatch){
        var mySide = home.id===myClub.id? 'home':'away';
        if(mySide==='home') aiPrepareMatch(away, home); else aiPrepareMatch(home, away);
        state.liveMatch = beginLiveMatch(home, away, mySide, round.round, league.id);
        liveStarted = true;
      } else if(league.id===relevantLeague && myClub){
        // los de tu liga se juegan ya, para que la tabla y la cinta queden al día
        var line = playSimFixture(item);
        if(line) tickerLines.push(line);
      } else {
        if(league.id===relevantLeague) item.ticker = true;
        state.pendingSims.push(item);
      }
    });
    if(!containsMine) round.played = true;
  });
  state.ticker = tickerLines.concat(state.ticker||[]).slice(0,40);
  if(!liveStarted){
    // sin partido propio, la fecha se juega en segundo plano y la semana pasa al terminar
    if(myClub) state.leagueFixtures[myClub.leagueId][idx].played = true;
    state.pendingWeek = {idx: idx, total: state.pendingSims.length};
    if(state.pendingSims.length) schedulePump(); else finishPendingWeek();
  } else {
    schedulePump();
  }
}
function rolloverSeason(){
  flushSims();
  returnLoans();
  var myClub = getMyClub();
  if(myClub){
    var table = standings(myClub.leagueId);
    var champion = table[0];
    var myPos = table.findIndex(function(t){return t.id===myClub.id;})+1;
    var league = LEAGUES_META.find(function(l){return l.id===myClub.leagueId;});
    var allInLeague = [];
    state.teams.filter(function(t){return t.leagueId===myClub.leagueId;}).forEach(function(t){ t.players.forEach(function(p){ allInLeague.push({name:p.name, goals:p.goals||0, clubName:t.name}); }); });
    allInLeague.sort(function(a,b){return b.goals-a.goals;});
    var top = allInLeague[0];
    state.history.unshift({season:state.season, leagueName:league.name, championName:champion.name, myPos:myPos,
      topScorerName: top? top.name+' ('+top.clubName+')':'-', topScorerGoals: top?top.goals:0});
    state.history = state.history.slice(0,20);
    var seasonObj = state.manager.boardObjective || computeBoardObjective(myClub);
    var objMet = myPos <= seasonObj.target;
    var objMargin = seasonObj.target - myPos;
    var objRepDelta, objJsDelta, objMsg;
    if(objMet){
      objRepDelta = objMargin>=3? 8 : objMargin>=1? 5 : 3;
      objJsDelta = objMargin>=3? 20 : objMargin>=1? 12 : 6;
      objMsg = 'La junta directiva quedó conforme con la temporada: cumpliste el objetivo ("'+seasonObj.label+'").';
    } else {
      var objMissBy = myPos - seasonObj.target;
      objRepDelta = objMissBy>=5? -10 : -5;
      objJsDelta = objMissBy>=5? -25 : -12;
      objMsg = 'La junta directiva quedó decepcionada: no cumpliste el objetivo de temporada ("'+seasonObj.label+'").';
    }
    state.manager.reputation = clamp(state.manager.reputation+objRepDelta,0,100);
    state.manager.jobSecurity = clamp(state.manager.jobSecurity+objJsDelta,0,100);
    state.manager.history.unshift({season:state.season, event:objMsg});
    state.manager.history = state.manager.history.slice(0,20);
  } else {
    state.manager.reputation = clamp(state.manager.reputation-2,0,100);
  }

  var posMap = {};
  LEAGUES_META.forEach(function(league){
    standings(league.id).forEach(function(t,i){ posMap[t.id]=i+1; });
  });

  state.teams.forEach(function(club){
    var league = LEAGUES_META.find(function(l){return l.id===club.leagueId;});
    var usedNames = new Set(club.players.map(function(p){return p.name;}));
    var coachLvl = staffLevel(club,'coach');
    var growthBoost = Math.floor((coachLvl-1)/2);
    var declineCut = Math.floor((coachLvl-1)/2);
    var survivors = [];
    var expiredNames = [];
    club.players.forEach(function(p){
      p.age++;
      p.goals = 0;
      if(p.age>=38) return;
      if(p.age>=35 && Math.random()<0.5) return;
      p.contractYears = Math.max(0, (p.contractYears!==undefined? p.contractYears : 2) - 1);
      if(p.contractYears<=0){ expiredNames.push(p.name); return; }
      if(p.age<=25 && overall(p)<p.potential){
        var bump = rnd(1,4)+growthBoost;
        p.atq=clamp(p.atq+bump,10,99); p.cre=clamp(p.cre+bump,10,99); p.def=clamp(p.def+bump,10,99); p.fis=clamp(p.fis+bump,10,99); p.por=clamp(p.por+bump,10,99);
      } else if(p.age>=31){
        var drop = Math.max(0, rnd(1,4)-declineCut);
        p.atq=clamp(p.atq-drop,10,99); p.cre=clamp(p.cre-drop,10,99); p.def=clamp(p.def-drop,10,99); p.fis=clamp(p.fis-drop,10,99); p.por=clamp(p.por-drop,10,99);
      }
      p.value = marketValue(p);
      p.fitness = 100;
      p.load = 0;
      p.injuryWeeks = 0;
      p.yellowCardsSeason = 0;
      survivors.push(p);
    });
    if(expiredNames.length && myClub && club.id===myClub.id){
      state.ticker = ['Se fueron libres por vencimiento de contrato: '+expiredNames.join(', ')+'.'].concat(state.ticker||[]).slice(0,40);
    }

    /* ---- juveniles: envejecen, progresan y algunos suben al primer equipo ---- */
    if(!club.youthPlayers) club.youthPlayers = [];
    var youthLvl = staffLevel(club,'youth');
    var youthGrowthBoost = Math.floor(youthLvl/2);
    var keptYouth = [];
    club.youthPlayers.forEach(function(yp){
      yp.age++;
      if(overall(yp)<yp.potential){
        var ybump = rnd(1,3)+youthGrowthBoost;
        yp.atq=clamp(yp.atq+ybump,10,99); yp.cre=clamp(yp.cre+ybump,10,99); yp.def=clamp(yp.def+ybump,10,99); yp.fis=clamp(yp.fis+ybump,10,99); yp.por=clamp(yp.por+ybump,10,99);
      }
      yp.value = marketValue(yp);
      var forcedGraduate = yp.age>=20;
      var aiAutoPromote = false;
      if(!forcedGraduate && (!myClub || club.id!==myClub.id) && yp.age>=18){
        var samePos = survivors.filter(function(p){return p.pos===yp.pos;});
        var avgPos = samePos.length? samePos.reduce(function(s,p){return s+overall(p);},0)/samePos.length : 0;
        if(overall(yp) >= avgPos-3) aiAutoPromote = true;
      }
      if(forcedGraduate || aiAutoPromote){
        yp.fitness = 100; yp.injuryWeeks = 0;
        yp.wage = playerWage(yp);
        yp.contractYears = rnd(2,4);
        if(yp.releaseClause===undefined) yp.releaseClause = null;
        survivors.push(yp);
      } else {
        keptYouth.push(yp);
      }
    });
    var youthCap = 6;
    if(myClub && club.id===myClub.id){
      // tu club: llega una camada entera y elegís a quién te quedás (ver Juveniles)
      state.youthIntake = makeYouthIntake({tier:club.tier, players:survivors, youthPlayers:keptYouth, staff:club.staff}, league);
    } else {
      var newYouthCount = clamp(rnd(1,3), 0, Math.max(0, youthCap-keptYouth.length));
      for(var yni=0; yni<newYouthCount; yni++) keptYouth.push(genYouthPlayer({tier:club.tier, players:survivors, youthPlayers:keptYouth, staff:club.staff}, league));
    }
    club.youthPlayers = keptYouth;

    while(survivors.length<18){
      var counts = {POR:0,DEF:0,MED:0,DEL:0};
      survivors.forEach(function(p){ counts[p.pos]++; });
      var pos = 'DEL';
      if(counts.POR<2) pos='POR'; else if(counts.DEF<6) pos='DEF'; else if(counts.MED<6) pos='MED';
      var np = genPlayer(pos, TIER_BASE[club.tier]+leagueOffset(league)-6, usedNames, league);
      np.age = rnd(17,19);
      np.potential = clamp(overall(np)+rnd(10,25), overall(np), 99);
      np.value = marketValue(np);
      survivors.push(np);
    }
    club.players = survivors;
    autoLineup(club);
    if(club.tactics.penaltyTaker && !survivors.some(function(p){return p.id===club.tactics.penaltyTaker;})) club.tactics.penaltyTaker = null;
    if(club.tactics.freeKickTaker && !survivors.some(function(p){return p.id===club.tactics.freeKickTaker;})) club.tactics.freeKickTaker = null;
    club.stats = {pj:0,pg:0,pe:0,pp:0,gf:0,gc:0,pts:0};
    var bonus = Math.max(0,(13-posMap[club.id]))*40000;
    club.budget += bonus + rnd(20000,80000);
  });

  state.season++;
  state.matchdayIdx = 0;
  state.results = [];
  LEAGUES_META.forEach(function(league){
    var ids = state.teams.filter(function(t){return t.leagueId===league.id;}).map(function(t){return t.id;});
    state.leagueFixtures[league.id] = generateFixtures(ids);
  });
  state.lastMatch = null;
  state.negotiation = null;
  state.staffMarket = genStaffMarket();
  if(myClub) state.manager.boardObjective = computeBoardObjective(myClub);
  state.manager.promisesUsed = 0;
  state.manager.ultimatum = null;
  if(myClub && state.youthIntake && state.youthIntake.season===state.season) newsYouthIntake(myClub);
  else state.youthIntake = null;
  setupCups(posMap);
}

function liveFlankDefender(lm, side, lane){
  if(!anim || anim.key!==animMatchKey(lm) || lane==='c') return null;
  var defs = animSide(side).filter(function(pl){ return pl.pos==='DEF'; });
  if(!defs.length) return null;
  // banda derecha: para el local es abajo en la cancha, para el visitante arriba
  var wantLow = (side==='home') === (lane==='r');
  defs.sort(function(a,b){ return wantLow? b.by-a.by : a.by-b.by; });
  return animName(defs[0]);
}
function liveInsights(lm){

  }
  var suffer = null;

    else if(rvXG-myXG>=0.8) out.push({pri:65, text:'El rival nos supera en situaciones claras ('+rvXG.toFixed(1)+' de xG contra '+myXG.toFixed(1)+').',
      hint: myG>=rvG? 'Vas bien en el marcador pero sufrís: conviene cerrarse.' : 'Así no alcanza: hay que cambiar algo.',
      act: myG>=rvG? ['mentality','def','Más defensivos'] : ['pressing','alta','Presión arriba']});
  }
  if(an[me].ownLoss>=8 && an[me].ownLoss/Math.max(1, an[me].loss)>=0.45){

  }
  var myOn = (lm[me+'OnPitch']||[]).map(function(id){ return myClub.players.find(function(p){ return p.id===id; }); }).filter(Boolean);

  }
  var myTac = (me==='home'? lm.homeTactics : lm.awayTactics) || {};
  var myMent = me==='home'? lm.homeMentality : lm.awayMentality;
  out.forEach(function(o){
    if(!o.act) return;
    var cur = o.act[0]==='mentality'? myMent : myTac[o.act[0]];

  });
  out.sort(function(a,b){ return b.pri-a.pri; });
  return out.slice(0,4);

    '<p class="feature-line"><strong>Cómo suele jugar:</strong> '+escapeHtml(tacLine)+'</p>'+
    '<p class="feature-line"><strong>Figuras:</strong> '+stars.map(function(p){ return escapeHtml(p.name)+' <span class="muted">('+p.pos+', GEN '+overall(p)+(p.goals? ', '+p.goals+' goles' : '')+')</span>'; }).join(' · ')+'</p>'+
    (missing.length? '<p class="feature-line"><strong>Bajas:</strong> '+missing.map(function(p){ return escapeHtml(p.name)+' <span class="muted">('+(isInjured(p)? 'lesionado' : 'suspendido')+')</span>'; }).join(' · ')+'</p>' : '<p class="feature-line muted">Sin bajas.</p>')+
    '<p class="eyebrow" style="margin-top:14px;">Duelo por líneas (tu once contra el suyo)</p>'+
    cmpRow('Tu defensa vs. su ataque', lineAvg(mine,'DEF'), lineAvg(theirs,'DEL'))+
    cmpRow('Mediocampo', lineAvg(mine,'MED'), lineAvg(theirs,'MED'))+
    cmpRow('Tu ataque vs. su defensa', lineAvg(mine,'DEL'), lineAvg(theirs,'DEF'))+
    (tipsHTML? '<p class="eyebrow" style="margin-top:14px;">Lo que recomienda tu asistente</p>'+tipsHTML : '')+
  '</div>';
}
// lo que el asistente recomienda para un rival puntual (lo usan el informe del rival y el botón del asistente)
function rivalTipsFor(myClub, opp, plan){
  plan = plan || aiPlanFor(opp, myClub);
  var mine = myClub.lineup.map(function(id){ return myClub.players.find(function(p){ return p.id===id; }); }).filter(Boolean);
  var theirs = plan.xi;
  var tips = [];
  var theirDefFis = attrAvg(theirs,'DEF','fis'), myDelFis = attrAvg(mine,'DEL','fis');
  if(myDelFis && theirDefFis && myDelFis - theirDefFis >= 6) tips.push({t:'Su defensa es lenta (físico '+Math.round(theirDefFis)+' contra '+Math.round(myDelFis)+' de tus delanteros): los pelotazos a la espalda los lastiman.', a:['set-passstyle','directo','Juego directo']});
  if(lineAvg(theirs,'MED') - lineAvg(mine,'MED') >= 5) tips.push({t:'Te superan en el mediocampo: con un volante más (4-5-1) se empareja la pelea.', a:['quick-formation','4-5-1','Pasar a 4-5-1']});
  if(lineAvg(theirs,'DEL') - lineAvg(mine,'DEF') >= 6) tips.push({t:'Sus delanteros son mejores que tus defensores: una línea retrasada te cuida la espalda.', a:['set-line','retrasada','Línea retrasada']});
  if(plan.mentality==='ofe') tips.push({t:'Van a salir a atacarte: cuando recuperes habrá espacio para la contra.', a:['set-tempo','rapido','Ritmo rápido']});
  if(plan.diff <= -6) tips.push({t:'Sos claro favorito: salí a buscarlo desde el arranque.', a:['set-mentality','ofe','Mentalidad ofensiva']});
  else if(plan.diff >= 6) tips.push({t:'Es un rival superior: cerrarse y salir de contra es la forma de sacar algo.', a:['set-mentality','def','Mentalidad defensiva']});
  return tips.slice(0,3);
}

/* ---------- el asistente a mano: todo lo que recomienda, en un solo lugar y con un toque ----------
   Junta lo que dice el informe del rival (para el próximo partido) y lo que sale de los atributos
   del plantel (formación, once, táctica). Lo del rival manda: si los dos opinan sobre lo mismo,
   queda el consejo para el partido.                                                              */
var assistantOpen = false;
var ASSIST_FIELDS = [
  {action:'set-mentality', key:'mentality', label:'Mentalidad', table:function(){ return MENTALITY; }, cur:function(c){ return c.mentality; }},
  {action:'set-passstyle', key:'passStyle', label:'Estilo de pase', table:function(){ return PASS_STYLES; }, cur:function(c){ return c.tactics.passStyle; }},
  {action:'set-width', key:'width', label:'Amplitud', table:function(){ return WIDTH; }, cur:function(c){ return c.tactics.width; }},
  {action:'set-tempo', key:'tempo', label:'Ritmo', table:function(){ return TEMPO; }, cur:function(c){ return c.tactics.tempo; }},
  {action:'set-pressing', key:'pressing', label:'Presión', table:function(){ return PRESSING; }, cur:function(c){ return c.tactics.pressing; }},
  {action:'set-line', key:'line', label:'Línea defensiva', table:function(){ return LINE_HEIGHT; }, cur:function(c){ return c.tactics.line; }},
  {action:'set-marking', key:'marking', label:'Marcaje', table:function(){ return MARKING; }, cur:function(c){ return c.tactics.marking; }}
];
function nextOpponentFor(club){
  if(!club || state.liveMatch || seasonFinished()) return null;
  var cd = nextCupDate();
  if(cd!==null){
    var mc = myCupMatchOn(cd);
    return mc? cupTeam(mc.m.home===club.id? mc.m.away : mc.m.home) : null;
  }
  var fx = state.leagueFixtures[club.leagueId], round = fx && fx[state.matchdayIdx];
  var m = round && round.matches.find(function(x){ return x.home===club.id || x.away===club.id; });
  if(!m) return null;
  var oppId = m.home===club.id? m.away : m.home;
  return state.teams.find(function(t){ return t.id===oppId; }) || null;
}
function assistCurrentValue(club, action){
  if(action==='quick-formation') return club.formation;
  var f = ASSIST_FIELDS.find(function(x){ return x.action===action; });
  return f? f.cur(club) : null;
}
function assistLineupRec(club){
  var probe = {formation:club.formation, players:club.players, lineup:[]};
  autoLineup(probe);
  var byId = function(id){ return club.players.find(function(p){ return p.id===id; }); };
  var cur = club.lineup.map(byId).filter(Boolean), prop = probe.lineup.map(byId).filter(Boolean);
  var outs = cur.filter(function(p){ return probe.lineup.indexOf(p.id)===-1; });
  var ins = prop.filter(function(p){ return club.lineup.indexOf(p.id)===-1; });
  if(!outs.length && !ins.length) return null;
  var sum = function(l){ return l.reduce(function(s,p){ return s+selectionValue(p); },0); };
  var need = Object.keys(FORMATIONS[club.formation]).reduce(function(s,k){ return s+FORMATIONS[club.formation][k]; },0);
  var urgent = outs.some(isUnavailable) || cur.length<need;
  if(!urgent && sum(prop)-sum(cur) < 3) return null;
  function why(p){
    if(isInjured(p)) return 'lesionado';
    if(isSuspended(p)) return 'suspendido';
    var fit = Math.round(playerFitness(p));
    return fit<85? fitnessLabel(fit).toLowerCase()+', '+fit+'%' : 'hoy rinde menos';
  }
  var parts = outs.slice(0,3).map(function(p){ return 'sale '+p.name+' ('+why(p)+')'; });
  if(outs.length>3) parts.push('y '+(outs.length-3)+' cambio'+(outs.length-3===1?'':'s')+' más');
  var inNames = ins.slice(0,3).map(function(p){ return p.name; }).join(', ');
  var text = 'Mejor once para hoy: '+parts.join(', ')+(inNames? '; entra'+(ins.length===1?'':'n')+' '+inNames : '')+'.';
  return {group:'plantel', text:text, action:'assist-lineup', id:'', label:'Armar el once', order:1};
}
function assistantRecs(club){
  if(!club) return {opp:null, list:[]};
  var opp = nextOpponentFor(club);
  var list = [], covered = {};
  (opp? rivalTipsFor(club, opp) : []).forEach(function(t){
    covered[t.a[0]] = true;
    if(assistCurrentValue(club, t.a[0])!==t.a[1]) list.push({group:'rival', text:t.t, action:t.a[0], id:t.a[1], label:t.a[2], order:t.a[0]==='quick-formation'? 0 : 2});
  });
  var best = computeBestXI(club);
  if(!covered['quick-formation'] && best.formation!==club.formation && best.formationScore-best.currentFormationScore>=0.5)
    list.push({group:'plantel', text:'El '+best.formation+' le rinde más a tu plantel que el '+club.formation+' (calidad del once '+fmt1(best.formationScore)+' contra '+fmt1(best.currentFormationScore)+').', action:'quick-formation', id:best.formation, label:'Pasar a '+best.formation, order:0});
  // si cambia la formación el once se rearma solo; si no, se mira si conviene rotar
  if(!list.some(function(r){ return r.action==='quick-formation'; })){
    var lr = assistLineupRec(club);
    if(lr) list.push(lr);
  }
  var adv = tacticalAdviceForXI(best.xi);
  ASSIST_FIELDS.forEach(function(f){
    if(covered[f.action]) return;
    var want = adv[f.key], cur = f.cur(club), tbl = f.table();
    if(want===cur || !tbl[want]) return;
    list.push({group:'plantel', text:f.label+': '+tbl[want].label+' le queda mejor a tu plantel que '+(tbl[cur]? tbl[cur].label : 'lo actual')+'.', action:f.action, id:want, label:tbl[want].label, order:2});
  });
  list = list.concat(contractRecsFor(club));
  return {opp:opp, list:list};
}
function contractRecsFor(club){
  var avg = squadAvgOverall(club), xi = club.lineup || [], out = [];
  club.players.forEach(function(p){
    var yrs = p.contractYears!==undefined? p.contractYears : 2, ov = overall(p);
    var key = xi.indexOf(p.id)!==-1 || ov>=avg;
    if(p.loanFrom) return;
    if(yrs<=1 && key && p.age<=31){
      var est = renewalEstimate(p, 3);
      out.push({group:'contratos', manual:true, text:p.name+' (GEN '+ov+', '+p.age+' años'+(xi.indexOf(p.id)!==-1? ', titular' : '')+') termina contrato esta temporada y se va libre si no renovás. Renovar 3 temporadas: bono de unos '+fmtMoney(est.bonus)+' y salario de '+fmtMoney(est.wage)+'/f.',
        action:'renew-contract', id:p.id, label:'Renovar', order:3, sort:-ov});
    } else if(p.raiseAsk){
      out.push({group:'contratos', manual:true, text:p.name+' pide aumento: cobra '+fmtMoney(p.wage||0)+'/f y quiere '+fmtMoney(p.raiseAsk.want)+'/f. Mientras no se lo des, le baja la moral ('+Math.round(p.morale!==undefined? p.morale : 75)+').',
        action:'grant-raise', id:p.id, label:'Darle el aumento', order:3, sort:-ov+100});
    }
  });
  out = out.sort(function(a,b){ return a.sort-b.sort; }).slice(0,5);
  var nb = bidsList().filter(function(b){ return club.players.some(function(p){ return p.id===b.playerId; }); }).length;
  if(nb) out.push({group:'mercado', manual:true, text:'Tenés '+nb+' oferta'+(nb===1?'':'s')+' de otros clubes por tus jugadores esperando respuesta.', action:'nav', id:'mercado', label:'Ver ofertas', order:3});
  if(youthIntakePending()){
    var it = state.youthIntake, gem = it.players.find(function(p){ return p.gem; });
    out.push({group:'cantera', manual:true, text:'Llegó la camada '+it.season+': '+it.players.length+' chicos a prueba'+(gem? ', y uno viene con fama de joya' : '')+'. Elegí a quiénes sumar a la cantera.', action:'nav', id:'juveniles', label:'Ver la camada', order:3});
  }
  return out;
}
function autoAssistCount(recs){ return recs.list.filter(function(r){ return !r.manual; }).length; }
function applyAssistRec(club, r){
  if(r.action==='quick-formation'){ if(FORMATIONS[r.id]){ club.formation = r.id; autoLineup(club); } return; }
  if(r.action==='assist-lineup'){ autoLineup(club); return; }
  if(r.action==='set-mentality'){ club.mentality = r.id; return; }
  var f = ASSIST_FIELDS.find(function(x){ return x.action===r.action; });
  if(f) club.tactics[f.key] = r.id;
}
function assistantVisible(){ return !!(state && getMyClub() && !state.liveMatch); }
function assistantFabHTML(recs){

/* ---------- copas: nacionales e internacionales ----------
   Cada liga tiene su copa a eliminación directa y los mejores de cada liga juegan la Champions
   o la Libertadores. Las fechas de copa van entre las fechas de liga: cuando la liga llega a la
   fecha "after" de una fecha de copa, primero se juega la copa y después sigue la liga.
   Los partidos son los mismos que los de liga (el mismo motor), pero no suman a la tabla.     */
var NATIONAL_CUPS = {premier:'FA Cup', laliga:'Copa del Rey', brasileirao:'Copa do Brasil', argentina:'Copa Argentina', uruguay:'Copa AUF Uruguay'};
// las de segundo orden (second) toman a los que siguen en la tabla (offset) y pagan menos (prizeMul)
var CONTINENTAL_CUPS = [
  {id:'ucl', name:'Champions League', slots:{premier:4, laliga:4}},
  {id:'lib', name:'Copa Libertadores', slots:{brasileirao:4, argentina:2, uruguay:2}},
  {id:'uel', name:'Europa League', slots:{premier:4, laliga:4}, offset:{premier:4, laliga:4}, second:true, prizeMul:0.35},
  {id:'sud', name:'Copa Sudamericana', slots:{brasileirao:4, argentina:2, uruguay:2}, offset:{brasileirao:4, argentina:2, uruguay:2}, second:true, prizeMul:0.35}
];
// supercopa de cada liga: campeón de liga contra campeón de copa, a partido único antes de la fecha 1
var SUPER_CUPS = {premier:'Community Shield', laliga:'Supercopa de España', brasileirao:'Supercopa do Brasil', argentina:'Supercopa Argentina', uruguay:'Supercopa Uruguaya'};
var CUP_CALENDAR = [
  {after:0, kind:'sup', stage:'final'},
  {after:2, kind:'cont', stage:'g1'}, {after:3, kind:'nat', stage:'r1'}, {after:4, kind:'cont', stage:'g2'},
  {after:6, kind:'cont', stage:'g3'}, {after:7, kind:'nat', stage:'qf'}, {after:9, kind:'cont', stage:'g4'},
  {after:11, kind:'cont', stage:'g5'}, {after:12, kind:'nat', stage:'sf'}, {after:13, kind:'cont', stage:'g6'},
  {after:15, kind:'cont', stage:'sf'}, {after:18, kind:'nat', stage:'final'}, {after:20, kind:'cont', stage:'final'}
];
var CUP_STAGE_LABEL = {r1:'Primera ronda', qf:'Cuartos de final', sf:'Semifinal', final:'Final',
  g1:'Fase de grupos · Fecha 1', g2:'Fase de grupos · Fecha 2', g3:'Fase de grupos · Fecha 3',
  g4:'Fase de grupos · Fecha 4', g5:'Fase de grupos · Fecha 5', g6:'Fase de grupos · Fecha 6'};
// premios en plata (se ajustan por el peso de la liga del club, igual que los presupuestos)
var CUP_PRIZES = {
  nat:{r1:20000, qf:35000, sf:60000, final:150000, runnerUp:60000},
  cont:{entry:200000, groupWin:40000, groupDraw:15000, sf:150000, final:500000, runnerUp:200000},
  sup:{final:100000, runnerUp:40000}
};
function cupPrize(comp, key){ return Math.round(((CUP_PRIZES[comp.type]||{})[key]||0)*(comp.prizeMul||1)); }
var viewingCupId = null;
function cupShuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j = rnd(0,i); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function cupTeam(id){ return state.teams.find(function(t){ return t.id===id; }); }
function cupRepFactor(club){
  var league = club? LEAGUES_META.find(function(l){ return l.id===club.leagueId; }) : null;
  return 1 + ((league? league.reputation : 3)-3)*0.35;
}
function cupPay(clubId, amount){
  var club = cupTeam(clubId);
  if(club && amount) club.budget += Math.round(amount*cupRepFactor(club)/500)*500;
}
function cupName(compId){
  var comp = state.cups && state.cups.comps[compId];
  return comp? comp.name : '';
}
function cupMatchLabel(compId, stage){ return cupName(compId)+' · '+(CUP_STAGE_LABEL[stage]||stage); }
// el orden de cada liga: la tabla de la temporada anterior, o la jerarquía si recién arranca el mundo
function cupLeagueSeeds(leagueId, prevPos){
  var clubs = state.teams.filter(function(t){ return t.leagueId===leagueId; });
  if(prevPos && clubs.every(function(t){ return prevPos[t.id]; })){
    return clubs.sort(function(a,b){ return prevPos[a.id]-prevPos[b.id]; }).map(function(t){ return t.id; });
  }
  return clubs.sort(function(a,b){ return (b.tier-a.tier) || (clubStrength(b)-clubStrength(a)); }).map(function(t){ return t.id; });
}
function cupKoMatch(home, away){ return {home:home, away:away, hg:null, ag:null, pens:null, winner:null, played:false}; }
// el de menos jerarquía juega de local en la copa, como en la Copa del Rey o la Copa Argentina
function cupHostLower(comp, a, b){
  return (comp.seed[a]||99) > (comp.seed[b]||99)? cupKoMatch(a, b) : cupKoMatch(b, a);
}
function cupDrawPairs(comp, ids){
  var list = cupShuffle(ids), out = [];
  for(var i=0;i+1<list.length;i+=2) out.push(cupHostLower(comp, list[i], list[i+1]));
  return out;
}
function setupCups(prevPos){
  var prevCups = state.cups;
  var cups = {season:state.season, calendar:CUP_CALENDAR.map(function(d){ return {after:d.after, kind:d.kind, stage:d.stage, played:false}; }), comps:{}};
  state.cups = cups;
  LEAGUES_META.forEach(function(league){
    var seeds = cupLeagueSeeds(league.id, prevPos);
    var comp = {id:'cup-'+league.id, type:'nat', name:NATIONAL_CUPS[league.id] || ('Copa '+league.country), leagueIds:[league.id],
      teams:seeds.slice(), seed:{}, ko:{}, championId:null, runnerUpId:null};
    seeds.forEach(function(id, i){ comp.seed[id] = i+1; });
    var byes = Math.max(0, 16 - seeds.length);
    comp.byes = seeds.slice(0, byes);
    comp.ko.r1 = cupDrawPairs(comp, seeds.slice(byes));
    cups.comps[comp.id] = comp;
  });
  CONTINENTAL_CUPS.forEach(function(meta){
    var qualified = [];
    Object.keys(meta.slots).forEach(function(lid){
      var from = meta.offset? (meta.offset[lid]||0) : 0;
      qualified = qualified.concat(cupLeagueSeeds(lid, prevPos).slice(from, from+meta.slots[lid]));
    });
    var comp = {id:meta.id, type:'cont', name:meta.name, leagueIds:Object.keys(meta.slots), teams:qualified.slice(), seed:{}, ko:{},
      groups:[{name:'A', teams:[]}, {name:'B', teams:[]}], groupDays:[], championId:null, runnerUpId:null};
    if(meta.second){ comp.second = true; comp.prizeMul = meta.prizeMul; }
    // bombos de a dos por jerarquía: cada grupo recibe uno de cada bombo
    var bySeed = qualified.slice().sort(function(a,b){ return clubStrength(cupTeam(b))-clubStrength(cupTeam(a)); });
    bySeed.forEach(function(id, i){ comp.seed[id] = i+1; });
    for(var p=0; p<bySeed.length; p+=2){
      var pot = cupShuffle(bySeed.slice(p, p+2));
      comp.groups[0].teams.push(pot[0]);
      if(pot[1]) comp.groups[1].teams.push(pot[1]);
    }
    var perGroup = comp.groups.map(function(g){ return generateFixtures(g.teams); });
    for(var day=0; day<6; day++){
      var matches = [];
      perGroup.forEach(function(rounds, gi){
        (rounds[day]? rounds[day].matches : []).forEach(function(m){ matches.push({group:gi, home:m.home, away:m.away, hg:null, ag:null, played:false}); });
      });
      comp.groupDays.push(matches);
    }
    qualified.forEach(function(id){ cupPay(id, cupPrize(comp, 'entry')); });
    cups.comps[comp.id] = comp;
  });
  LEAGUES_META.forEach(function(league){
    var seeds = cupLeagueSeeds(league.id, prevPos);
    var champ = seeds[0], other = null;
    // la copa de la temporada anterior: solo si de verdad es la temporada pasada y hay tabla
    var prevCup = prevPos && prevCups && prevCups.season===state.season-1 && prevCups.comps? prevCups.comps['cup-'+league.id] : null;
    if(prevCup && prevCup.championId && seeds.indexOf(prevCup.championId)!==-1 && prevCup.championId!==champ) other = prevCup.championId;
    if(!other) other = seeds[1];
    if(!champ || !other) return;
    var comp = {id:'sup-'+league.id, type:'sup', name:SUPER_CUPS[league.id] || ('Supercopa '+league.country), leagueIds:[league.id],
      teams:[champ, other], seed:{}, ko:{final:[cupKoMatch(champ, other)]}, championId:null, runnerUpId:null,
      cupWinnerId: prevCup && prevCup.championId===other? other : null};
    comp.seed[champ] = 1; comp.seed[other] = 2;
    cups.comps[comp.id] = comp;
  });
  return cups;
}
function cupGroupTable(comp, gi){
  var rows = {};
  comp.groups[gi].teams.forEach(function(id){ rows[id] = {id:id, pj:0, pg:0, pe:0, pp:0, gf:0, gc:0, pts:0}; });
  comp.groupDays.forEach(function(day){
    day.forEach(function(m){
      if(m.group!==gi || !m.played) return;
      var h = rows[m.home], a = rows[m.away];
      h.pj++; a.pj++; h.gf+=m.hg; h.gc+=m.ag; a.gf+=m.ag; a.gc+=m.hg;
      if(m.hg>m.ag){ h.pg++; a.pp++; h.pts+=3; }
      else if(m.hg<m.ag){ a.pg++; h.pp++; a.pts+=3; }
      else { h.pe++; a.pe++; h.pts++; a.pts++; }
    });
  });
  return Object.keys(rows).map(function(k){ return rows[k]; }).sort(function(a,b){
    return (b.pts-a.pts) || ((b.gf-b.gc)-(a.gf-a.gc)) || (b.gf-a.gf) || ((comp.seed[a.id]||99)-(comp.seed[b.id]||99));
  });
}
// los partidos de una fecha de copa en una competencia, con la referencia para anotar el resultado
function cupStageMatches(comp, stage){
  if(stage.charAt(0)==='g'){
    var day = comp.groupDays? comp.groupDays[Number(stage.slice(1))-1] : null;
    return (day||[]).map(function(m, i){ return {m:m, key:stage+':'+i}; });
  }
  return (comp.ko[stage]||[]).map(function(m, i){ return {m:m, key:stage+':'+i}; });
}
function cupFindMatch(comp, key){
  var parts = String(key).split(':'), stage = parts[0], i = Number(parts[1]);
  if(stage.charAt(0)==='g') return (comp.groupDays[Number(stage.slice(1))-1]||[])[i] || null;
  return (comp.ko[stage]||[])[i] || null;
}

// tanda de penales: patean los cinco mejores definidores y después muerte súbita
function cupShootout(home, away){
  function kickers(club){
    var xi = club.lineup.map(function(id){ return club.players.find(function(p){ return p.id===id; }); }).filter(Boolean);
    var list = xi.filter(function(p){ return p.pos!=='POR'; }).sort(function(a,b){ return (b.atq||0)-(a.atq||0); });
    return list.length? list : xi;
  }
  function keeper(club){
    var xi = club.lineup.map(function(id){ return club.players.find(function(p){ return p.id===id; }); }).filter(Boolean);
    return xi.find(function(p){ return p.pos==='POR'; }) || {por:50};
  }
  var kh = kickers(home), ka = kickers(away), gh = keeper(home), ga = keeper(away);
  function kick(p, gk){ return Math.random() < clamp(0.76 + ((p.atq||50)-(gk.por||50))/400, 0.6, 0.9); }
  var h = 0, a = 0;
  for(var i=0;i<5;i++){
    if(kick(kh[i%kh.length], ga)) h++;
    if(kick(ka[i%ka.length], gh)) a++;
  }
  var n = 5;
  while(h===a && n<30){
    if(kick(kh[n%kh.length], ga)) h++;
    if(kick(ka[n%ka.length], gh)) a++;
    n++;
  }
  if(h===a){ if(Math.random()<0.5) h++; else a++; }
  return {h:h, a:a};
}
// anota el resultado de un partido de copa y reparte premios; devuelve la línea para la cinta
function cupRecordResult(compId, key, hg, ag, et){
  var comp = state.cups.comps[compId];
  var m = comp? cupFindMatch(comp, key) : null;
  if(!m || m.played) return '';
  m.hg = hg; m.ag = ag; m.played = true;
  if(et) m.et = true;
  var home = cupTeam(m.home), away = cupTeam(m.away);
  if(home) home.budget += matchdayIncome(home);
  var stage = String(key).split(':')[0];
  var pensTxt = '';
  if(stage.charAt(0)==='g'){
    if(hg>ag) cupPay(m.home, cupPrize(comp, 'groupWin'));
    else if(ag>hg) cupPay(m.away, cupPrize(comp, 'groupWin'));
    else { cupPay(m.home, cupPrize(comp, 'groupDraw')); cupPay(m.away, cupPrize(comp, 'groupDraw')); }
  } else {
    if(hg===ag){
      m.pens = cupShootout(home, away);
      pensTxt = ' ('+(et? 'alargue y ' : '')+m.pens.h+'-'+m.pens.a+' por penales)';
    } else if(et) pensTxt = ' (en el alargue)';
    m.winner = (hg>ag || (hg===ag && m.pens.h>m.pens.a))? m.home : m.away;
    if(stage==='final'){
      comp.championId = m.winner;
      comp.runnerUpId = m.winner===m.home? m.away : m.home;
      cupPay(comp.championId, cupPrize(comp, 'final'));
      cupPay(comp.runnerUpId, cupPrize(comp, 'runnerUp'));
    } else {
      cupPay(m.winner, cupPrize(comp, stage));
    }
  }
  if(home) adjustMorale(home, hg>ag? 'win' : hg===ag? 'draw' : 'loss');
  if(away) adjustMorale(away, ag>hg? 'win' : hg===ag? 'draw' : 'loss');
  return comp.name+': '+(home? home.name : '')+' '+hg+'-'+ag+' '+(away? away.name : '')+pensTxt;
}

function beginCupDate(di){

  state.teams.forEach(function(club){

    if(changed && myClub && club.id===myClub.id) myLineupChanged = true;
  });
  if(myLineupChanged) tickerLines.push('Bajas por lesión te obligaron a modificar el once inicial.');
  state.pendingSims = state.pendingSims || [];
  cupDateComps(d).forEach(function(comp){
    var mineHere = myClub && (comp.leagueIds.indexOf(myClub.leagueId)!==-1);
    cupStageMatches(comp, d.stage).forEach(function(x){
      if(x.m.played) return;
      var home = cupTeam(x.m.home), away = cupTeam(x.m.away);
      if(!home || !away) return;
      var isMine = myClub && (home.id===myClub.id || away.id===myClub.id);
      if(isMine){
        var mySide = home.id===myClub.id? 'home' : 'away';
        if(mySide==='home') aiPrepareMatch(away, home, d.stage); else aiPrepareMatch(home, away, d.stage);
        state.liveMatch = beginLiveMatch(home, away, mySide, 100+di, comp.id);
        state.liveMatch.cup = {compId:comp.id, key:x.key, stage:d.stage, dateIdx:di};
        state.liveMatch.ko = d.stage.charAt(0)!=='g';
        liveStarted = true;
      } else {
        state.pendingSims.push({cup:true, compId:comp.id, key:x.key, dateIdx:di, home:home.id, away:away.id, ticker:!!mineHere});
      }
    });
  });
  if(tickerLines.length) state.ticker = tickerLines.concat(state.ticker||[]).slice(0,40);
  if(!liveStarted){
    state.pendingWeek = {idx:state.matchdayIdx, total:state.pendingSims.length, cupDate:di};
    if(state.pendingSims.length) schedulePump(); else finishPendingWeek();
  } else {

// cuando termina una fecha de copa: se arma el cruce siguiente y se festeja al campeón
function finishCupDate(di){
  var d = state.cups.calendar[di];
  if(!d || d.played) return;
  d.played = true;
  // de la copa al próximo partido de liga quedan cuatro días (la supercopa es en la pretemporada)
  advanceRecovery(d.after>0? 4 : 7);
  var myClub = getMyClub();
  cupDateComps(d).forEach(function(comp){
    if(comp.type==='nat'){
      if(d.stage==='r1') comp.ko.qf = cupDrawPairs(comp, comp.byes.concat(comp.ko.r1.map(function(m){ return m.winner; })));
      else if(d.stage==='qf') comp.ko.sf = cupDrawPairs(comp, comp.ko.qf.map(function(m){ return m.winner; }));
      else if(d.stage==='sf'){
        var fin = cupShuffle(comp.ko.sf.map(function(m){ return m.winner; }));
        comp.ko.final = [cupKoMatch(fin[0], fin[1])];
      }
    } else if(comp.type==='cont'){
      if(d.stage==='g6'){
        var A = cupGroupTable(comp, 0), B = cupGroupTable(comp, 1);
        comp.ko.sf = [cupKoMatch(A[0].id, B[1].id), cupKoMatch(B[0].id, A[1].id)];
      } else if(d.stage==='sf'){
        var finC = cupShuffle(comp.ko.sf.map(function(m){ return m.winner; }));
        comp.ko.final = [cupKoMatch(finC[0], finC[1])];

    }
