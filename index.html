/* ---------- guardado en tu cuenta (nube) + aviso sin conexión ---------- */
// La partida se guarda siempre en este dispositivo (localStorage) y, además, en tu cuenta de Claude:
// data/users/<id>/save (resumen) + partes comprimidas en dos ranuras (a/b) para no romper la copia buena.
var CL = {db:null, uid:null, state:'buscando', ready:false, ok:false, at:0, dirty:false, busy:false, timer:null, pending:null, lastWrite:0};
var CLOUD_CHUNK = 120000;
var LOCAL_TS0 = 0;
function cloudPath(k){ return 'data/users/'+CL.uid+'/'+k; }
function b64FromBytes(u8){ var s='', step=0x8000; for(var i=0;i<u8.length;i+=step) s+=String.fromCharCode.apply(null, u8.subarray(i,i+step)); return btoa(s); }
function bytesFromB64(b){ var s=atob(b), u8=new Uint8Array(s.length); for(var i=0;i<s.length;i++) u8[i]=s.charCodeAt(i); return u8; }
function packState(){
  var json = JSON.stringify(state);
  if(typeof CompressionStream!=='function') return Promise.resolve('raw:'+json);
  return new Response(new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()
    .then(function(buf){ return 'gz1:'+b64FromBytes(new Uint8Array(buf)); });
}
function unpackState(code){
  try{
    if(code.slice(0,4)==='raw:') return Promise.resolve(JSON.parse(code.slice(4)));
    if(code.slice(0,4)==='gz1:'){
      var ds = new Blob([bytesFromB64(code.slice(4))]).stream().pipeThrough(new DecompressionStream('gzip'));
      return new Response(ds).text().then(function(t){ return JSON.parse(t); });
    }
  }catch(e){ return Promise.reject(e); }
  return Promise.reject('formato');
}
function validCloudState(o){ return !!(o && o.__v===2 && o.teams && o.teams.length && o.manager && o.leagueFixtures); }
function liveBusy(){ return !!(state && state.liveMatch && state.liveMatch.status==='playing' && currentView==='partido'); }
function cloudInit(){
  if(!window.claude || typeof window.claude.use!=='function'){ CL.state='sin'; CL.ready=true; cloudBadge(); return; }
  Promise.all([window.claude.use('db'), window.claude.use('user')]).then(function(r){
    var db=r[0], us=r[1];
    if(!db || !us){ CL.state='sin'; CL.ready=true; cloudBadge(); return null; }
    return us.id().then(function(id){
      if(!id){ CL.state='sin'; CL.ready=true; cloudBadge(); return null; }
      CL.db=db; CL.uid=id;
      return db.doc(cloudPath('save')).get().then(function(snap){
        var m = snap.exists? snap.data() : null;
        if(m && m.n>0 && m.ts>LOCAL_TS0) return cloudRead(m).then(function(o){
          if(validCloudState(o)){ CL.pending=o; CL.at=m.ts; CL.ok=true; CL.ready=true; CL.state='ok'; tryApplyPending(); }
          else cloudFinishInit();
        });
        if(m && m.n>0){ CL.ok=true; CL.at=m.ts; }
        cloudFinishInit();
      });
    });
  }).catch(function(){ CL.state='error'; CL.ready=true; offBar(); cloudBadge(); });
}
function cloudFinishInit(){
  CL.ready=true; CL.state='ok';
  if(state && (state._ts||1)>CL.at) cloudQueue(true);
  offBar(); cloudBadge();
}
function cloudRead(m){
  var ps=[]; for(var i=0;i<m.n;i++) ps.push(CL.db.doc(cloudPath('p'+m.slot+i)).get());
  return Promise.all(ps).then(function(snaps){
    var code=''; for(var i=0;i<snaps.length;i++){ if(!snaps[i].exists) return null; code+=snaps[i].data().d; }
    return unpackState(code);
  }).catch(function(){ return null; });
}
// si en tu cuenta hay una partida más nueva (la jugaste en otro dispositivo), se carga cuando no estás en medio de un partido
function tryApplyPending(){
  if(!CL.pending || liveBusy()) return;
  var o=CL.pending; CL.pending=null;
  stopLiveTicker();
  state=o;
  normalizeTactics(); normalizeClubColors(); normalizeLiveMatch(); normalizePlayerHealth(); normalizeStaff(); normalizeRoles();
  normalizeContracts(); normalizeManagerExtras(); normalizePinned(); normalizeNews(); normalizeCups();
  currentView='inicio'; confirmingReset=false;
  var mc=getMyClub(); viewingLeagueId = mc? mc.leagueId : (state.manager.lastLeagueId||null);
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); lastSaveOk=true; }catch(e){ lastSaveOk=false; }
  render();
  if(state.pendingSims && state.pendingSims.length) schedulePump();
  else if(state.pendingWeek) finishPendingWeek();
  toast('Cargamos tu partida guardada en tu cuenta ✓');
}
function cloudQueue(now){
  if(!CL.db || !CL.ready || CL.pending || !state) return;
  CL.dirty=true; clearTimeout(CL.timer);
  // como mucho una subida cada 20 segundos mientras jugás; al salir, al tocar Guardar o al volver la señal se sube enseguida
  var wait = now? 0 : Math.max(4000, 20000-(Date.now()-CL.lastWrite));
  CL.timer=setTimeout(function(){ cloudWrite(); }, wait);
}
function cloudWrite(force){
  if(!CL.dirty || !CL.db || !state) return Promise.resolve(CL.ok);
  if(navigator.onLine===false){ CL.state='error'; offBar(); cloudBadge(); return Promise.resolve(false); }
  if(!force && liveBusy()){ clearTimeout(CL.timer); CL.timer=setTimeout(function(){ cloudWrite(); }, 15000); return Promise.resolve(CL.ok); }
  if(CL.busy) return new Promise(function(res){ setTimeout(function(){ res(cloudWrite(force)); }, 400); });
  CL.busy=true; CL.dirty=false; CL.lastWrite=Date.now();
  var ts=state._ts||Date.now();
  var myClub=getMyClub();
  var info={season:state.season, club: myClub? myClub.name : ''};
  return packState().then(function(code){
    var n=Math.ceil(code.length/CLOUD_CHUNK);
    return CL.db.doc(cloudPath('save')).get().then(function(snap){
      var old=snap.exists? snap.data() : null, slot = old && old.slot==='a'? 'b' : 'a';
      var i=0;
      function next(){
        if(i>=n) return CL.db.doc(cloudPath('save')).set({slot:slot, n:n, ts:ts, season:info.season, club:info.club});
        var k=i++; return CL.db.doc(cloudPath('p'+slot+k)).set({d:code.slice(k*CLOUD_CHUNK,(k+1)*CLOUD_CHUNK)}).then(next);
      }
      return next();
    });
  }).then(function(){ CL.busy=false; CL.ok=true; CL.at=ts; CL.state='ok'; offBar(); cloudBadge(); return true; },
    function(){ CL.busy=false; CL.ok=false; CL.state='error'; CL.dirty=true; offBar(); cloudBadge(); return false; });
}
function cloudClear(){
  if(CL.db && CL.uid){ CL.pending=null; clearTimeout(CL.timer); CL.dirty=false; CL.db.doc(cloudPath('save')).set({n:0, ts:Date.now()}).catch(function(){}); CL.at=0; CL.ok=false; cloudBadge(); }
}
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden' && CL.dirty){ clearTimeout(CL.timer); cloudWrite(true); } });
function isOff(){ return navigator.onLine===false || (!!CL.db && CL.state==='error'); }
function offBar(){
  var b=document.getElementById('offline-bar');
  if(!b){ b=document.createElement('div'); b.id='offline-bar'; b.className='offline-bar'; b.setAttribute('role','status'); b.textContent='Sin conexión · seguís jugando, se guarda en este dispositivo'; b.hidden=true; document.body.appendChild(b); }

function cloudRetry(){
  offBar(); if(navigator.onLine===false) return;
  if(!CL.db){ if(CL.state==='error'){ CL.state='buscando'; cloudInit(); } return; }
  if(CL.dirty && !CL.busy){ clearTimeout(CL.timer); cloudWrite(true).then(function(ok){ if(ok) toast('Partida subida a tu cuenta ✓'); }); }
}
window.addEventListener('offline', function(){ offBar(); cloudBadge(); if(state) toast('Sin conexión: seguí jugando, se guarda en este dispositivo'); });
window.addEventListener('online', function(){ offBar(); setTimeout(cloudRetry, 1500); });
setInterval(function(){ if(CL.state==='error') cloudRetry(); }, 30000);
function hhmm(ts){ var d=new Date(ts); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }
function cloudStatusText(){
  if(!CL.db) return CL.state==='buscando'? 'Conectando con tu cuenta…' : 'Guardado en este dispositivo';
  if(CL.pending) return 'Cargando partida de tu cuenta…';
  if(navigator.onLine===false || CL.state==='error') return CL.dirty? 'Sin señal · se sube sola al volver' : 'Sin señal · guardado en este dispositivo';
  if(CL.dirty || CL.busy) return 'Guardando en tu cuenta…';

function cloudBadge(){ var el=document.getElementById('cloud-status'); if(el) el.textContent=cloudStatusText(); }
function saveNow(){
  if(!state) return;
  saveGame();
  if(!CL.db){ toast(lastSaveOk? 'Partida guardada ✓' : 'No se pudo guardar en este dispositivo'); return; }

/* ---------- rendering ---------- */
var animBoundSvg = null, animNodeMap = null;
function animBindSvg(svg){
  animBoundSvg = svg;
  animNodeMap = {trail:null, ball:null, shadow:null, carrier:null, players:{}, refs:{}, labels:{}, sayband:null, saytext:null, saymin:null};
  var nodes = (svg.ownerDocument||document).querySelectorAll('[data-anim]');
  for(var i=0;i<nodes.length;i++){
    var el = nodes[i], key = el.getAttribute('data-anim');
    if(key==='trail') animNodeMap.trail = el;
    else if(key==='ball') animNodeMap.ball = el;
    else if(key==='ballshadow') animNodeMap.shadow = el;
    else if(key==='fx') animNodeMap.fx = el;
    else if(key==='carrier') animNodeMap.carrier = el;
    else if(key==='sayband') animNodeMap.sayband = el;
    else if(key==='saytext') animNodeMap.saytext = el;
    else if(key==='saymin') animNodeMap.saymin = el;
    else if(key.indexOf('ref:')===0) animNodeMap.refs[key.slice(4)] = el;
    else if(key.indexOf('lbl:')===0) animNodeMap.labels[key.slice(4)] = el;
    else if(key.charAt(1)===':'){
      var kind = key.charAt(0), pid = key.slice(2);
      if(!animNodeMap.players[pid]) animNodeMap.players[pid] = {};
      animNodeMap.players[pid][kind] = el;
    }
  }
}
// --- solo dibujo: pelota con altura y frenado, hacia dónde mira cada uno, que no se pisen en pantalla y la cámara.
// Nada de esto toca la simulación: se calcula a partir de su estado y se tira cuadro a cuadro.
var PITCH_LOFT = {pass:0, through:0.7, long:7, cross:5.5, clear:9, shot:1.2, touch:0.5};
var PITCH_EASE = {pass:0.45, through:0.4, long:0.15, cross:0.15, clear:0.1, shot:0.15, touch:0.6};
var PITCH_CAM_W = 64, PITCH_CAM_H = PITCH_CAM_W*72/109;
var animVis = {key:null, off:[0,0], lastT:0, face:{}, prev:{}, sep:{}, disp:{}, cam:null};
var pitchCamMode = (function(){
  try{ var v = localStorage.getItem('elTecnicoCam'); if(v==='cam' || v==='full') return v; }catch(e){}
  return (window.innerWidth||1000) < 700? 'cam' : 'full';
})();
function pitchSetCam(m){ pitchCamMode = m==='cam'? 'cam' : 'full'; try{ localStorage.setItem('elTecnicoCam', pitchCamMode); }catch(e){} }
// dónde se dibuja la pelota en vuelo: sale rápida y llega frenando (mismo tiempo de vuelo), y las altas tienen altura
function animBallVisual(ball){
  var f = ball.flight;
  if(!f || !f.dur){
    // la pelota alta pica un par de veces al caer
    var land = null;
    (anim && anim.fx || []).forEach(function(fx){ if(fx.type==='land') land = fx; });
    var ageL = land? (anim.clock - land.t)/animViewMul() : 9;
    return {x:ball.x, y:ball.y, h: ageL < 0.8? 1.6*Math.abs(Math.sin(ageL*Math.PI/0.32))*Math.exp(-ageL*4) : 0};
  }
  var k = Math.max(0, Math.min(1, f.t/f.dur));

function sndToggle(){

  if(kind==='foul'? !sndLive() : (ENGINE_HEADLESS || !state || !state.liveMatch || currentView!=='partido' || !sndReady())) return;
  var now = performance.now();
  if(kind==='foul' && now-SND.lastWhistle < 900) return;
  SND.lastWhistle = now;
  var pattern = kind==='end'? [[0,0.38],[0.55,0.38],[1.1,1.15]] : kind==='half'? [[0,0.45],[0.62,0.95]] : kind==='kickoff'? [[0,0.6]] : [[0,0.24+Math.random()*0.12]];

  var k = (side==='home'? 1 : 0.6) * (outcome==='palo'? 1 : outcome==='atajada'? 0.8 : 0.55);

  var kk = key+':'+(lm.clock>=halfEnd(lm)? 2 : 1)+(lm.extraTime? 'e' : '');
  if(SND.kickKey!==kk && lm.status==='playing'){
    if(lm.clock===0 || lm.clock===halfEnd(lm) || isExtraBreak(lm)) sndWhistle('kickoff');
    SND.kickKey = kk;
  }
  // en jugadas clave el gol se canta cuando se ve

    SND.shownGoals = goals;
  }
  SND.shownH = sc.h;
  var lvl = 0.10;
  if(anim.ball && !anim.replay){
    var side = anim.poss || 'home';
    var adv = animAdvance(side, anim.ball.x);
    var ex = clamp((adv-45)/50, 0, 1);
    lvl = 0.09 + ex*ex*(side==='home'? 0.22 : 0.12) + (anim.setPiece? 0.04 : 0);

}

function boardMoodHTML(myClub){
  var st = boardStanding(myClub), risk = boardRisk();
  if(!st) return '';
  var mood = st.progress<0.25? 'Todavía es temprano: la directiva espera a ver cómo arranca la temporada.'
    : st.status==='ok'? 'La directiva está conforme: vas en camino de cumplir.'
    : st.status==='tight'? 'Estás cerca, pero por debajo de lo que piden. Les falta poco para ponerse nerviosos.'
    : 'Estás lejos del objetivo: la directiva te va a ir restando confianza fecha a fecha.';
  var cls = risk.key==='low'? 'is-good' : risk.key==='mid'? 'is-avg' : 'is-poor';
  var u = state.manager.ultimatum;
  return '<p class="feature-line">'+mood+'</p>'+
    '<p class="feature-line">Riesgo de despido: <span class="rating-badge '+cls+'">'+risk.label+'</span>'+
    (u? ' · '+u.points+' de '+u.need+' puntos, quedan '+u.left+' partido'+(u.left===1?'':'s') : risk.key==='high'? ' · si la confianza baja de 25 te dan un ultimátum' : '')+'</p>';
}
function renderTabla(){

function renderFixture(){
  var myClub = getMyClub();
  if(!myClub) return '<div class="card"><p class="eyebrow">Fixture</p><p class="feature-line muted">No dirigís ningún club, así que no tenés calendario propio. Mirá la Tabla para seguir las 5 ligas.</p></div>';
  var allRounds = state.leagueFixtures[myClub.leagueId];
  var rounds = allRounds.filter(function(round){
    if(fixtureFilter==='jugados') return !!round.played;
    if(fixtureFilter==='proximos') return !round.played;
    return true;
  });
  var filterChips = [['todos','Todos'],['proximos','Próximos'],['jugados','Jugados']].map(function(f){
    return '<button class="chip-btn '+(fixtureFilter===f[0]?'is-active':'')+'" data-action="set-fixture-filter" data-id="'+f[0]+'" type="button">'+f[1]+'</button>';
  }).join('');
  var rows = rounds.map(function(round){
    var fix = round.matches.find(function(m){ return m.home===myClub.id || m.away===myClub.id; });
    var isHome = fix.home===myClub.id;
    var oppId = isHome? fix.away : fix.home;
    var opp = state.teams.find(function(t){ return t.id===oppId; });
    var score = '—';
    if(round.played){
      var res = state.results.find(function(r){ return r.round===round.round && r.leagueId===myClub.leagueId && (r.homeId===myClub.id||r.awayId===myClub.id); });
      if(res) score = res.homeGoals+' - '+res.awayGoals;
    }
    return '<tr class="'+(round.round-1===state.matchdayIdx?'is-next':'')+'">'+
      '<td class="num">'+round.round+'</td><td class="team-cell">'+(isHome?'vs ':'@ ')+crestSVG(opp,18)+escapeHtml(opp.name)+'</td><td class="num mono">'+score+'</td></tr>';
  }).join('');
  var maxRound = 0;
  state.results.forEach(function(r){ if(r.leagueId===myClub.leagueId && r.round>maxRound) maxRound=r.round; });
  var lastRound = state.results.filter(function(r){ return r.leagueId===myClub.leagueId && r.round===maxRound; });
  var lastRoundHTML = lastRound.length ?
    '<div class="card"><p class="eyebrow">Última fecha jugada</p><ul class="result-list">'+
    lastRound.map(function(r){
      var rHome = state.teams.find(function(t){return t.id===r.homeId;});
      var rAway = state.teams.find(function(t){return t.id===r.awayId;});
      return '<li><span class="team-chip">'+crestSVG(rHome,16)+escapeHtml(r.homeName)+'</span><span class="mono score">'+r.homeGoals+' - '+r.awayGoals+'</span><span class="team-chip">'+crestSVG(rAway,16)+escapeHtml(r.awayName)+'</span></li>';
    }).join('')+
    '</ul></div>' : '';
  var emptyRowsHTML = rounds.length? '' : '<p class="feature-line muted" style="margin-top:10px;">No hay fechas para este filtro.</p>';
  return '<div class="view-grid"><div class="card"><p class="eyebrow">Tu calendario</p><div class="chip-row">'+filterChips+'</div>'+
    '<div class="table-wrap" style="margin-top:12px;"><table class="table">'+
    '<thead><tr><th>Fecha</th><th>Rival</th><th>Resultado</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+emptyRowsHTML+'</div>'+myCupFixturesHTML(myClub)+lastRoundHTML+'</div>';
}

   Este motor ES el partido. Un equipo tiene la pelota, un jugador la tiene en los pies y decide
   qué hacer según sus atributos, su rol y la táctica; el rival lo presiona, le corta pases y se
   la quita. Los goles, remates, córners, faltas, penales y tarjetas salen de lo que pasa en la
   cancha, no de un dado aparte. Cada minuto de partido son ENGINE_SEC_PER_MIN segundos de motor. */
var anim = null;

// reloj son ENGINE_SEC_PER_MIN segundos de fútbol, y la pantalla lo muestra acelerado como el FM
var ENGINE_SEC_PER_MIN = 40;

var ENGINE_HOLD_MUL = 6;

var ENGINE_HEAVY_TOUCH = 0.05;
// con cuánta frecuencia el que marca encima intenta quitarla, por segundo de juego (calibrado)
var ENGINE_DUEL_RATE = 0.35;
// cuánto más aguanta la pelota el que tiene un rival encima (segundos de juego)
var ENGINE_PRESS_RELEASE = 0.7;
// qué parte de los choques termina en falta (calibrado)
var ENGINE_FOUL_SHARE = 0.22;
var ENGINE_STEP = 1/30;
var ENGINE_HEADLESS = false;

var ENGINE_SHOT_EAGERNESS = 0.23;
var ENGINE_HEAT_MIN = 15;

function animComputeMeans(){

  var keepers = all.filter(function(pl){ return pl.pos==='POR'; });
  var level = 0, n = 0;
  field.forEach(function(pl){ ['atq','cre','def','fis'].forEach(function(k){ level += (pl.player[k]||45)*(pl.perf||1); n++; }); });
  level = n? level/n : 60;
  var gk = keepers.length? keepers.reduce(function(sum, pl){ return sum + (pl.player.por||45)*(pl.perf||1); }, 0)/keepers.length : level;

function engLM(){ return state && state.liveMatch; }
function engMinute(){ var lm = engLM(); return lm? Math.min(lm.clock+1, matchEnd(lm)) : 0; }
function engEvent(ev){
  var lm = engLM();
  if(!lm) return ev;
  ev.minute = engMinute();
  lm.events.push(ev);
  annotateScores(lm.events);
  if(anim) anim.minuteEvents.push(ev);
  return ev;
}
function engStat(side, key, n){
  var lm = engLM();
  if(!lm) return;
  var k = side+key;
  lm[k] = (lm[k]||0) + (n===undefined? 1 : n);
}
function engRate(pl, d){ var lm = engLM(); if(lm && pl) bumpRating(lm, pl.id, d); }

// localía: con los cambios por cansancio el visitante se emparejaba al final, por eso pasó de 1.015 a 1.03
var ENGINE_HOME_PERF = 1.03;
function animPerfFor(p, club, isHome){
  var mult = fitnessPerfMult(playerFitness(p));
  // fuera de su puesto rinde menos: no sabe dónde pararse
  var outOfPos = livePos(p)!==p.pos? 0.9 : 1;
  return mult * moraleMultiplier(p) * chemistryMultiplier(club) * (isHome? ENGINE_HOME_PERF : 1) * outOfPos;
}
function animRefreshPerf(){
  if(!anim) return;
  ['home','away'].forEach(function(side){
    var club = side==='home'? anim.homeClub : anim.awayClub;
    animSide(side).forEach(function(pl){
      pl.perf = animPerfFor(pl.player, club, side==='home');
      var fit = playerFitness(pl.player);
      pl.speedFactor = (0.96 + clamp(animAttr(pl,'fis')-60, -30, 30)/30*0.14) * (0.88 + 0.12*fit/100);
    });
  });
}
function animMakePlayer(p, side, bx, by, wide, club){
  return {
    id:p.id, player:p, side:side, pos:livePos(p),
    bx:bx, by:by, wide:wide,
    x:bx, y:by, tx:bx, ty:by,
    speedFactor: 0.82 + clamp((p.fis||60)-45, 0, 45)/45*0.42,
    perf: animPerfFor(p, club, side==='home'),
    intent:null, intentUntil:0, markId:null, jitterX:0, jitterY:0,
    speed: ANIM_JOG, runUntil:0, beatenUntil:0
  };
}
function animBuildSide(club, ids, isHome){
  var players = ids.map(function(id){ return club.players.find(function(p){return p.id===id;}); }).filter(Boolean);
  var grouped = {POR:[],DEF:[],MED:[],DEL:[]};
  players.forEach(function(p){ (grouped[livePos(p)] || grouped.MED).push(p); });
  var depths = isHome? {POR:6,DEF:25,MED:48,DEL:70} : {POR:94,DEF:75,MED:52,DEL:30};
  var out = [];
  POS_ORDER.forEach(function(pos){
    var list = grouped[pos] || [];
    var n = list.length;
    list.forEach(function(p, i){
      var wide = n>=3 && (i===0 || i===n-1);
      var pl = animMakePlayer(p, isHome?'home':'away', depths[pos], ((i+1)/(n+1))*100, wide, club);
      // en una delantera de tres, los de las puntas son extremos: arrancan más atrás y bajan a defender
      if(pos==='DEL' && wide){ pl.winger = true; pl.bx = isHome? 62 : 38; pl.x = pl.tx = pl.bx; }
      out.push(pl);
    });
  });
  return out;
}
function animInit(lm, homeClub, awayClub){
  anim = {
    key: animMatchKey(lm),
    home: animBuildSide(homeClub, lm.homeOnPitch||[], true),
    away: animBuildSide(awayClub, lm.awayOnPitch||[], false),
    poss: 'home',
    ball: {x:50, y:50, holder:null, flight:null},
    holdTimer: 0.6,
    transitionUntil: 0,
    trail: [],
    lastShotAt: -9,
    clock: 0,
    homeName: lm.homeName, awayName: lm.awayName,
    homeClub: homeClub, awayClub: awayClub,
    say: null,
    setPiece: null,
    card: null,
    panelUntil: 0,
    buffer: [], lastRecAt: 0, replay: null,
    secondHalf: lm.clock >= halfEnd(lm),
    refs: {ref:{x:50,y:54}, ar1:{x:50,y:2}, ar2:{x:50,y:98}},
    minuteAcc: 0, minuteEvents: [],
    possTime: {home:0, away:0}, terrMin: {home:0, away:0},
    lastPass: null, slowUntil: 0, lastMode: null, needRender: false
  };
  animComputeMeans();
  animRefreshPerf();
  animKickoff(lm.clock>=halfEnd(lm)? 'away' : 'home');
  return anim;
}
// keep the animator's squads in step with subs and red cards without losing the run of play
function animReconcile(lm, homeClub, awayClub){
  if(!anim) return;
  ['home','away'].forEach(function(side){
    var club = side==='home'? homeClub : awayClub;
    var ids = (side==='home'? lm.homeOnPitch : lm.awayOnPitch) || [];
    var list = anim[side];
    for(var i=list.length-1;i>=0;i--){
      if(ids.indexOf(list[i].id)===-1){
        if(anim.ball.holder===list[i]) anim.ball.holder = null;
        if(anim.setPiece && anim.setPiece.taker===list[i]) anim.setPiece.taker = null;
        list.splice(i,1);
      }
    }
    ids.forEach(function(id){
      if(list.some(function(p){ return p.id===id; })) return;
      var p = club.players.find(function(x){ return x.id===id; });
      if(!p) return;
      var peers = list.filter(function(q){ return q.pos===livePos(p); });
      var ref = peers[0] || list[0];
      var np = animMakePlayer(p, side, ref? ref.bx : 50, ref? ref.by : 50, false, club);
      if(ref){ np.x = ref.x; np.y = ref.y; }
      list.push(np);
    });
    animRelayout(side);
  });
}
// cada uno vuelve a su lugar en el dibujo: después de un cambio, una roja o una formación nueva
function animRelayout(side){
  var list = animSide(side), isHome = side==='home';
  var depths = isHome? {POR:6,DEF:25,MED:48,DEL:70} : {POR:94,DEF:75,MED:52,DEL:30};
  var groups = {POR:[],DEF:[],MED:[],DEL:[]};
  list.forEach(function(pl){ pl.pos = livePos(pl.player); (groups[pl.pos] || groups.MED).push(pl); });
  POS_ORDER.forEach(function(pos){
    var g = groups[pos].slice().sort(function(a,b){ return a.by-b.by; });
    var n = g.length;
    g.forEach(function(pl, i){
      pl.bx = depths[pos]; pl.by = ((i+1)/(n+1))*100; pl.wide = n>=3 && (i===0 || i===n-1);
      pl.winger = pos==='DEL' && pl.wide;
      if(pl.winger) pl.bx = isHome? 62 : 38;
    });
  });
}
function animName(pl){
  if(!pl || !pl.player) return '';
  var parts = String(pl.player.name).split(' ').filter(Boolean);
  return parts[parts.length-1] || pl.player.name;
}
function animSay(text, side, tone){
  if(!anim) return;
  // mientras está el panel del gol, la frase que explica cómo salió se queda quieta
  if(!tone && anim.panelUntil > anim.clock) return;
  // lo que se grita desde el banco queda un momento en el relato
  if(!tone && anim.say && anim.say.tone==='shout' && anim.clock - anim.say.born < 2.5*animViewMul()) return;
  // con el partido acelerado, cada frase queda al menos un segundo a la vista (las importantes pasan igual)
  if(!tone && anim.say && anim.clock - anim.say.born < 1.1*animViewMul()) return;
  anim.say = {text:text, side:side||null, born:anim.clock, tone:tone||null};
}
// el cartelito que entra sobre la cancha: escudo, número, nombre y una línea de contexto
// cuántos segundos de partido pasan por segundo de pantalla (para que los carteles y efectos duren lo mismo a la vista)
function animViewMul(){
  var lm = engLM();
  if(!lm || ENGINE_HEADLESS) return 1;
  return Math.min(SPEED_MULT[lm.speed || 'normal'] || 1, SPEED_MULT.fast);
}
function animShowCard(club, player, line, accent, holdFor){
  if(!anim) return;
  anim.card = {
    club: club, num: club? (club.players.indexOf(player)+1) : '',
    name: player? player.name : '', line: line, accent: accent||null,
    until: anim.clock + (holdFor||3.4)*animViewMul()
  };
}
function animPressureOn(pl){
  if(!pl) return 0;
  var rivals = animRival(pl.side), n = 0;
  for(var i=0;i<rivals.length;i++){
    if(rivals[i].pos==='POR' || rivals[i].beatenUntil > anim.clock) continue;
    if(animDist(pl.x, pl.y, rivals[i].x, rivals[i].y) < 9) n++;
  }
  return n;
}
function animNearestRival(pl, x, y){
  var rivals = animRival(pl.side), best = null, bestD = 1e9;
  rivals.forEach(function(r){
    if(r.pos==='POR') return;
    var d = animDist(x, y, r.x, r.y);
    if(d<bestD){ bestD = d; best = r; }
  });
  return {p:best, d:bestD};
}
// how far each team stands from its own goal, and how tight it sits — this is what makes
// a high press look different from a deep block, and what makes a team visibly drop back
function animBasePos(pl, ctx){
  // con mentalidad ofensiva hasta los defensores se paran en campo rival cuando se ataca
  var extra = ctx.attacking && ctx.ment==='ofe' && pl.pos==='DEF' && pl.wide? 5 : 0;
  var bx = pl.bx;
  // sin la pelota, el extremo se suma a la línea de volantes
  if(pl.winger && !ctx.attacking) bx = ctx.dir>0? 46 : 54;
  // el equipo se achica alrededor de su centro: las líneas juegan cerca una de otra
  if(ctx.bxMean!==undefined) bx = ctx.bxMean + (bx - ctx.bxMean)*ENGINE_COMPACT;
  var depth = bx + ctx.dir*(ctx.push + extra);
  // sin la pelota el 9 no baja a defender al área: queda cerca de la mitad para salir de contra
  if(pl.pos==='DEL' && !ctx.attacking && ENGINE_OUTLET_ADV > 0){
    var advD = ctx.dir>0? depth : 100-depth;
    if(advD < ENGINE_OUTLET_ADV) depth = ctx.dir>0? ENGINE_OUTLET_ADV : 100-ENGINE_OUTLET_ADV;
  }
  var lane = 50 + (pl.by-50)*ctx.widthMul*(pl.wide? 1.05 : 0.9) + ctx.laneShift*(pl.wide? 0.45 : 1);
  return {x: clamp(depth, 3, 97), y: clamp(lane, 5, 95)};
}
// the opponents' deepest line, so a striker knows where "in behind" is
function animLastLine(side){
  // el segundo rival más retrasado (sin ordenar toda la lista: se llama en cada paso)
  var rv = animRival(side), first = -1e9, second = -1e9, n = 0;
  for(var i=0;i<rv.length;i++){
    if(rv[i].pos==='POR') continue;
    var a = animAdvance(side, rv[i].x); n++;
    if(a > first){ second = first; first = a; } else if(a > second) second = a;
  }
  return n>1? second : (n? first : 70);
}
// la línea del fuera de juego: el último defensor rival (sin contar al arquero)
function animOffsideLine(side){
  var deepest = 50;
  animRival(side).forEach(function(p){
    if(p.pos==='POR') return;
    var a = animAdvance(side, p.x);
    if(a>deepest) deepest = a;
  });
  return deepest;
}
function animIsOffside(side, m){
  var a = animAdvance(side, m.x);
  if(a<=50) return false;
  return a > Math.max(animOffsideLine(side), animAdvance(side, anim.ball.x)) + 0.8;
}
// every so often each defender picks the rival he is responsible for
function animAssignMarks(side){
  var markers = animSide(side).filter(function(p){ return p.pos!=='POR'; });
  var targets = animRival(side).filter(function(p){ return p.pos!=='POR'; }).slice();
  markers.forEach(function(m){ m.markId = null; });
  markers.sort(function(a,b){ return animAdvance(side,a.x)-animAdvance(side,b.x); });
  markers.forEach(function(m){
    if(!targets.length) return;
    var best = null, bd = 1e9;
    targets.forEach(function(t){
      var d = animDist(m.x, m.y, t.x, t.y);
      if(d<bd){ bd = d; best = t; }
    });
    if(best && bd < 34){
      m.markId = best.id;
      targets.splice(targets.indexOf(best), 1);
    }
  });
}
// Each player decides for himself what to do next, on his own clock. This is what stops
// the eleven from sliding around as one rigid block: at any instant some are sprinting
// into space, some are dropping off, some are just walking back into shape.
function animPickIntent(pl, ctx){
  var now = anim.clock;
  var attacking = ctx.attacking;
  var ball = anim.ball;
  var dToBall = animDist(pl.x, pl.y, ball.x, ball.y);
  var adv = animAdvance(pl.side, pl.x);
  var ballAdv = ctx.ballAdv;
  var r = Math.random();
  var kind, dur;
  // el rol se nota en qué hace cada uno cuando no tiene la pelota
  var atkTilt = roleTilt(pl.player, 'atk') * (ctx.ment==='ofe'? 1.1 : ctx.ment==='def'? ENGINE_DEF_TILT : 1);
  if(anim.clock < anim.transitionUntil && !attacking && adv > 55){
    kind = 'recover'; dur = 0.8 + Math.random()*0.9;
  } else if(!attacking){
    if(pl===ctx.presser || pl===ctx.presser2){ kind = 'press'; dur = 0.5 + Math.random()*0.7; }
    else if(pl.markId && r<0.62){ kind = 'mark'; dur = 0.7 + Math.random()*1.2; }
    else if(r<0.85){ kind = 'cover'; dur = 0.8 + Math.random()*1.4; }
    else { kind = 'hold'; dur = 0.9 + Math.random()*1.5; }
  } else if(pl===ball.holder){
    kind = 'hold'; dur = 0.3;
  } else if(animOnCounter(pl.side) && (pl.pos==='DEL' || (pl.pos==='MED' && r<0.5))){
    kind = pl.pos==='DEL'? 'runBehind' : 'arrive'; dur = 1.2 + Math.random()*0.8;
  } else {
    if(pl.pos==='DEL' && ballAdv>34 && r<0.5*atkTilt && pl.player.role!=='falso_9'){ kind = 'runBehind'; dur = 0.9 + Math.random()*0.9; }
    else if(pl.wide && ballAdv>28 && r<0.62){ kind = 'drift'; dur = 0.8 + Math.random()*1.3; }
    else if(pl.pos==='DEF' && pl.wide && ballAdv>52 && r<0.72*atkTilt){ kind = 'overlap'; dur = 1.0 + Math.random()*1.2; }
    else if(pl.pos==='MED' && ballAdv>55 && r<0.4*atkTilt && pl.player.role!=='mediocentro_defensivo'){ kind = 'arrive'; dur = 1.0 + Math.random()*1.0; }
    else if(pl.winger && ballAdv>58 && r<0.5){ kind = 'cutIn'; dur = 0.9 + Math.random()*0.9; }
    else if(dToBall<30 && r<0.8){ kind = 'support'; dur = 0.5 + Math.random()*0.9; }
    else if(r<0.9){ kind = 'checkBack'; dur = 0.5 + Math.random()*0.8; }
    else { kind = 'hold'; dur = 0.8 + Math.random()*1.4; }
  }
  pl.intent = kind;
  pl.intentUntil = now + dur;
  // a bit of personal space each player aims for, so nobody stacks perfectly on a formula
  pl.jitterX = rnd(-25,25)/10; pl.jitterY = rnd(-30,30)/10;
  // el destino de la corrida se elige una vez por intención, no cuadro a cuadro
  pl.r1 = Math.random(); pl.r2 = Math.random();
}
function animR(pl, a, b, two){ var r = two? pl.r2 : pl.r1; if(r===undefined) r = 0.5; return a + (b-a)*r; }
function animIntentTarget(pl, ctx){
  var ball = anim.ball;
  var base = animBasePos(pl, ctx);
  var dir = ctx.dir;
  var tx = base.x, ty = base.y, speed = ANIM_JOG;
  switch(pl.intent){
    case 'press':
      tx = ball.x - dir*1.4; ty = ball.y; speed = ANIM_SPRINT; break;
    case 'mark': {
      var man = animRival(pl.side).filter(function(p){ return p.id===pl.markId; })[0];
      if(man){
        tx = man.x - dir*2.2; ty = man.y + pl.jitterY*0.25;
        speed = animDist(pl.x,pl.y,tx,ty)>7? ANIM_SPRINT : ANIM_JOG;
      } else { pl.intent='cover'; }
      break;
    }
    case 'cover':
      tx = base.x - dir*3 + (ball.x-base.x)*0.12;
      // los defensores se mueven como una línea: misma altura, suben y bajan juntos
      if(pl.pos==='DEF' && ctx.defLine!==null) tx = ctx.defLine - dir*2 + (ball.x-ctx.defLine)*0.08;
      ty = base.y + (ball.y-base.y)*0.3;
      speed = ANIM_WALK + (ctx.ballAdv>60? ANIM_JOG-ANIM_WALK : 0);
      break;
    case 'recover':
      tx = base.x - dir*6; ty = base.y + (ball.y-base.y)*0.2; speed = ANIM_SPRINT; break;
    case 'runBehind':
      tx = clamp(dir>0? ctx.lastLine+animR(pl,2,7) : 100-(ctx.lastLine+animR(pl,2,7)), 6, 94);
      // diagonal: se mete entre central y lateral o se abre a la espalda del lateral
      ty = clamp(base.y + (pl.r2<0.6? (50-base.y)*0.4 : (base.y<50? -6 : 6)) + pl.jitterY*0.5, 8, 92);
      speed = ANIM_SPRINT; break;
    case 'arrive':
      // el volante que llega desde atrás al borde del área
      tx = clamp(dir>0? 80+animR(pl,-3,4) : 20+animR(pl,-4,3), 6, 94);
      ty = clamp(50 + (base.y-50)*0.5 + pl.jitterY, 20, 80);
      speed = ANIM_SPRINT*0.85; break;
    case 'cutIn':
      // el extremo se cierra hacia el arco, por dentro de su lateral
      tx = clamp(dir>0? 82+animR(pl,-3,4) : 18+animR(pl,-4,3), 6, 94);
      ty = clamp(50 + (pl.by<50? -1 : 1)*animR(pl,10,18,true), 18, 82);
      speed = ANIM_SPRINT*0.9; break;
    case 'drift':
      tx = base.x + dir*animR(pl,1,6);
      ty = pl.by<50? clamp(base.y-animR(pl,3,9,true), 6, 46) : clamp(base.y+animR(pl,3,9,true), 54, 94);
      speed = ANIM_JOG; break;
    case 'overlap':
      tx = clamp(base.x + dir*animR(pl,9,18), 5, 95);
      ty = pl.by<50? clamp(base.y-4, 6, 45) : clamp(base.y+4, 55, 94);
      speed = ANIM_SPRINT; break;
    case 'support': {
      var ang = Math.atan2(pl.y-ball.y, pl.x-ball.x);
      var want = 11 + Math.abs(pl.jitterX);
      tx = clamp(ball.x + Math.cos(ang)*want, 4, 96);
      ty = clamp(ball.y + Math.sin(ang)*want, 6, 94);
      speed = ANIM_JOG; break;
    }
    case 'checkBack':
      tx = clamp(base.x - dir*animR(pl,3,8), 4, 96);
      ty = clamp(base.y + pl.jitterY*0.5, 6, 94);
      speed = ANIM_JOG; break;
    default:
      tx = base.x; ty = base.y;
      speed = ANIM_WALK;
  }
  // a player is his own man, but he is also part of a team: everything except chasing the
  // ball or a marked opponent is pulled slightly back towards his place in the shape
  if(pl.intent!=='press'){
    var blend = pl.intent==='mark'? 0.15 : (pl.intent==='arrive' || pl.intent==='cutIn')? 0.12 : 0.32;
    tx = tx + (base.x-tx)*blend;
    ty = ty + (base.y-ty)*blend;
  }
  tx = clamp(tx,3,97); ty = clamp(ty,5,95);
  // el que ataca sin la pelota se para en línea con el último defensor: espera el pase para picar
  if(ctx.attacking && ctx.offLine!==undefined && pl.pos!=='POR' && anim.ball.holder!==pl && !(ball.flight && ball.flight.receiver===pl)){
    var onLine = Math.max(50, Math.max(ctx.offLine, ctx.ballAdv) - ENGINE_ONSIDE_MARGIN);
    var advT = dir>0? tx : 100-tx;
    if(advT > onLine) tx = dir>0? onLine : 100-onLine;
  }
  // a player holding his position does not chase every centimetre the shape drifts:
  // he stands still until it is worth walking again
  if(pl.intent==='hold' || pl.intent==='cover'){
    if(pl.lockX===undefined || animDist(tx,ty,pl.lockX,pl.lockY) > 2.6){ pl.lockX = tx; pl.lockY = ty; }
    tx = pl.lockX; ty = pl.lockY;
  } else { pl.lockX = undefined; }
  var tempoRun = ctx.attacking? (ctx.tempo==='rapido'? 1.05 : ctx.tempo==='pausado'? 0.96 : 1) : 1;
  if(!ctx.attacking && animOnCounter(animOther(pl.side)) && animAdvance(pl.side, pl.x) > animAdvance(pl.side, ball.x)) tempoRun *= 0.72;
  pl.tx = tx; pl.ty = ty; pl.speed = speed*(pl.speedFactor||1)*tempoRun;
}
function animUpdateTargets(dt){
  var ball = anim.ball;
  var now = anim.clock;
  // con la pelota en el aire, de cada equipo sale el más cercano a donde va a caer
  var chaser = {home:null, away:null}, flC = ball.flight;
  if(flC && flC.kind!=='shot' && flC.kind!=='touch' && !anim.setPiece){
    ['home','away'].forEach(function(sd){
      var best = null, bd = 22;
      animSide(sd).forEach(function(p){
        if(p.pos==='POR' || p===flC.receiver) return;
        var dd = animDist(p.x, p.y, flC.x2, flC.y2);
        if(dd < bd){ bd = dd; best = p; }
      });
      if(flC.receiver && flC.receiver.side===sd && flC.kind==='pass') best = null;
      chaser[sd] = best;
    });
  }
  ['home','away'].forEach(function(side){
    var isHome = side==='home';
    var attacking = side===anim.poss;
    var mates = animSide(side);
    var tactics = animTac(side);
    var ment = animMent(side);
    var lineFrac = VIS_LINE_ANCHOR[tactics.line] || 0.5;
    var pressMul = VIS_PRESS_PULL[tactics.pressing] || 1;
    var widthMul = VIS_WIDTH_SPREAD[tactics.width] || 1;
    var ballAdv = animAdvance(side, ball.x);
    var mentPush = ment==='ofe'? 2 : ment==='def'? ENGINE_DEF_PUSH : 0;
    var ctx = {
      dir: isHome? 1 : -1,
      attacking: attacking,
      ment: ment,
      tempo: tactics.tempo,
      widthMul: attacking? widthMul : Math.min(1, widthMul)*0.9,
      ballAdv: ballAdv,
      lastLine: animLastLine(side),
      offLine: animOffsideLine(side),
      push: attacking
        ? clamp((ballAdv-38)*0.62 + mentPush, -10, 34)
        : clamp((ballAdv-52)*0.5 + (lineFrac-0.5)*40 + Math.min(0, mentPush), -24, 20),
      laneShift: (ball.y-50) * (attacking? 0.3 : 0.5),
      presser: null, presser2: null, defLine: null,
      bxMean: (function(){ var sm = 0, n = 0; for(var i=0;i<mates.length;i++){ if(mates[i].pos!=='POR'){ sm += mates[i].bx; n++; } } return n? sm/n : 50; })()
    };
    if(!attacking){
      var dl = mates.filter(function(p){ return p.pos==='DEF'; });
      if(dl.length>=2) ctx.defLine = ctx.bxMean + (dl.reduce(function(sm,p){ return sm + p.bx; }, 0)/dl.length - ctx.bxMean)*ENGINE_COMPACT + ctx.dir*ctx.push;
    }
    if(now > (anim.markAt||0)) animAssignMarks(side);
    if(!attacking && ball.holder){
      var cands = mates.filter(function(p){ return p.pos!=='POR' && p.beatenUntil<=now; })
        .sort(function(a,b){ return animDist(a.x,a.y,ball.x,ball.y)-animDist(b.x,b.y,ball.x,ball.y); });
      // con repliegue nadie sale a buscar arriba: se espera al rival en campo propio
      var dropOff = tactics.pressing==='baja' && ballAdv > 52;
      ctx.presser = dropOff? null : (cands[0] || null);
      if(tactics.pressing==='alta' && ballAdv > 55 && cands[1] && animDist(cands[1].x, cands[1].y, ball.x, ball.y) < 14) ctx.presser2 = cands[1];
      if(pressMul>1.1 && cands[1] && Math.random()<0.02) ctx.presser = cands[1];
    }
    var sp = anim.setPiece;
    mates.forEach(function(pl){
      if(pl.pos==='POR'){
        if(sp && sp.type==='penalty' && side!==sp.side){
          pl.tx = isHome? 1.5 : 98.5; pl.ty = 50; pl.speed = ANIM_JOG; return;
        }
        pl.tx = isHome? clamp(4 + (ball.x-50)*0.06, 2, 14) : clamp(96 + (ball.x-50)*0.06, 86, 98);
        pl.ty = clamp(50 + (ball.y-50)*0.32, 32, 68);
        pl.speed = ANIM_JOG;
        return;
      }
      if(sp && (sp.type==='free' || sp.type==='penalty') && pl===sp.taker){ pl.tx = sp.x; pl.ty = sp.y; pl.speed = ANIM_SPRINT*1.6*(pl.speedFactor||1); return; }
      if(sp && sp.type==='penalty'){
        // todos afuera del área, esperando el rebote
        var edge = sp.side==='home'? 80 : 20;
        pl.tx = clamp(edge + (sp.side==='home'? -1 : 1)*Math.abs(pl.jitterX) + (side===sp.side? 0 : (sp.side==='home'? 1.5 : -1.5)), 4, 96);
        pl.ty = clamp(50 + (pl.by-50)*0.55, 18, 82);
        pl.speed = ANIM_JOG*(pl.speedFactor||1);
        return;
      }
      if(sp && sp.type==='free'){
        if(side!==sp.side){
          // barrera: los tres más cercanos se paran a nueve metros, en la línea del arco
          var ord = mates.filter(function(p){return p.pos!=='POR';}).sort(function(a,b){ return animDist(a.x,a.y,sp.x,sp.y)-animDist(b.x,b.y,sp.x,sp.y); });
          var idx = ord.indexOf(pl);
          if(idx>=0 && idx<3){
            pl.tx = clamp(sp.x + (sp.side==='home'? 8.5 : -8.5), 3, 97);
            pl.ty = clamp(sp.y - 2 + idx*2, 5, 95);
            pl.speed = ANIM_SPRINT*(pl.speedFactor||1);
            return;
          }
        }
      }
      if(sp && sp.type==='corner'){
        if(pl===sp.taker){ pl.tx = sp.x; pl.ty = sp.y; pl.speed = ANIM_SPRINT*1.6*(pl.speedFactor||1); return; }
        var boxX = sp.side==='home'? 88 : 12;
        var off = (pl.by-50)*0.45;
        // los centrales del que ataca suben a cabecear; queda uno atrás por si sale la contra
        if(side===sp.side && pl.pos==='DEF' && !pl.wide && pl.by<50){ off = 0; }
        else if(side===sp.side && (pl.pos==='DEF' && pl.wide)){ pl.tx = sp.side==='home'? 55 : 45; pl.ty = pl.by; pl.speed = ANIM_JOG; return; }
        pl.tx = clamp(boxX + (side===sp.side? 0 : (sp.side==='home'? -3 : 3)) + rnd(-4,4), 5, 95);
        pl.ty = clamp(50 + off + rnd(-4,4), 30, 70);
        pl.speed = ANIM_SPRINT*(pl.speedFactor||1)*1.35;
        return;
      }
      if(pl.runUntil>now){ pl.speed = ANIM_SPRINT*(pl.speedFactor||1); return; }
      var flI = ball.flight;
      if(flI && !sp && flI.kind!=='shot' && (pl===flI.receiver || (pl===chaser[side] && (flI.kind==='long' || flI.kind==='clear') && flI.t > flI.dur*0.3))){
        var dI = animDist(pl.x, pl.y, flI.x2, flI.y2);
        pl.tx = flI.x2; pl.ty = flI.y2;
        pl.speed = (dI>3? ANIM_SPRINT : ANIM_JOG)*(pl.speedFactor||1);
        return;
      }
      if(!pl.intent || pl.intentUntil<=now || ((pl===ctx.presser || pl===ctx.presser2) && pl.intent!=='press')) animPickIntent(pl, ctx);
      animIntentTarget(pl, ctx);

  });

}
// nadie arranca ni frena en seco: se acelera, se frena antes de llegar y los giros cuestan
var ENGINE_ACCEL = 9, ENGINE_DECEL = 13;
function animMovePlayers(dt){
  ['home','away'].forEach(function(side){
    animSide(side).forEach(function(pl){
      var vx = pl.vx || 0, vy = pl.vy || 0;
      var dx = pl.tx-pl.x, dy = pl.ty-pl.y;
      var d = Math.sqrt(dx*dx+dy*dy);
      var want = 0, wx = 0, wy = 0;
      if(d > 0.05){
        want = Math.min(pl.speed || ANIM_JOG, Math.sqrt(2*ENGINE_DECEL*d));
        wx = dx/d*want; wy = dy/d*want;
      }
      var ex = wx-vx, ey = wy-vy, e = Math.sqrt(ex*ex+ey*ey);
      var cur = Math.sqrt(vx*vx+vy*vy);
      var lim = (want > cur? ENGINE_ACCEL : ENGINE_DECEL)*dt;
      if(e > lim){ vx += ex/e*lim; vy += ey/e*lim; } else { vx = wx; vy = wy; }
      var step = Math.sqrt(vx*vx+vy*vy)*dt;
      if(d > 0.05 && step >= d && want < 0.8){ pl.x = pl.tx; pl.y = pl.ty; vx = 0; vy = 0; }
      else { pl.x = clamp(pl.x + vx*dt, 0.5, 99.5); pl.y = clamp(pl.y + vy*dt, 0.5, 99.5); }
      pl.vx = vx; pl.vy = vy;
    });
  });
}
// marca para la pantalla (entrada, gambeta, cabezazo, falta, control largo, pique): no cambia nada del partido
function animFx(type, a, b){
  if(ENGINE_HEADLESS || !anim) return;
  anim.fx = anim.fx || [];
  anim.fx.push({type:type, a:a? a.id : null, b:b? b.id : null, t:anim.clock, x:anim.ball.x, y:anim.ball.y});
  if(anim.fx.length > 12) anim.fx.shift();
}
function animAddTrail(x1, y1, x2, y2, kind){
  anim.trail.push({x1:x1, y1:y1, x2:x2, y2:y2, kind:kind, born:anim.clock});

function animGiveBall(pl){

    anim.ball.x = pl.x; anim.ball.y = pl.y;
    if(anim.poss !== pl.side){
      anim.poss = pl.side;

// si el que la perdió tenía mucha gente arriba, el que la recupera sale de contra
function animCheckCounter(pl){
  var side = pl.side;

  anim.counter = null;
  if(ballAdv > 62) return;
  var behind = animRival(side).filter(function(r){ return r.pos!=='POR' && animAdvance(side, r.x) > ballAdv; }).length;
  var limit = animTac(side).tempo==='rapido'? 6 : 5;
  if(behind <= limit){
    anim.counter = {side:side, until: anim.clock + (animTac(side).tempo==='rapido'? 8 : 7)};
    if(behind <= 4) animSay(choice(['¡Contragolpe del {T}!','¡Sale rápido el {T}, hay espacio!','¡Cuidado, el {T} agarra mal parado al rival!'])
      .replace('{T}', side==='home'? anim.homeName : anim.awayName), side);
  }

function animOnCounter(side){ return !!(anim.counter && anim.counter.side===side && anim.counter.until > anim.clock); }
function animTempoMul(side){
  var t = animTac(side).tempo;

}
// cada equipo arriesga según cómo marca: al hombre se va más al choque, en zona se espera
function animFoulMod(side){

// a marker who gets right on top of the ball carrier can take it off him — this is what
// creates turnovers, and with them the transitions and the retreating block
function animDuels(dt){
  var holder = anim.ball.holder;
  if(!holder || holder.pos==='POR' || anim.ball.flight || anim.setPiece) return;
  if(anim.clock < anim.transitionUntil) return;
  var tactics = animTac(animOther(holder.side));
  var markMul = tactics.marking==='al_hombre'? 1.3 : (tactics.marking==='zonal'? 0.88 : 1);
  var protect = animAttr(holder,'cre')*0.45 + animAttr(holder,'atq')*0.2 + animAttr(holder,'fis')*0.35;
  var rivals = animRival(holder.side);
  for(var i=0;i<rivals.length;i++){
    var r = rivals[i];
    if(r.pos==='POR' || r.beatenUntil > anim.clock) continue;
    var d = animDist(r.x, r.y, holder.x, holder.y);
    if(d > 3.2) continue;
    var tackle = animAttr(r,'def')*0.7 + animAttr(r,'fis')*0.3;
    var shape = animOnCounter(holder.side)? 0.7 : (animMent(r.side)==='def' && animAdvance(r.side, holder.x) < 40? 1.12 : 1);
    // la presión alta se nota donde se presiona: arriba, encima de la salida rival
    if(animTac(r.side).pressing==='alta' && animAdvance(r.side, holder.x) > 55) shape *= 1.5;
    var chance = (1 - d/3.2) * 1.3 * markMul * shape * clamp(animEdge(tackle, protect, 55), 0.6, 1.7) * ENGINE_DUEL_RATE * dt;
    if(Math.random() < chance){
      if(Math.random() < 0.42*ENGINE_FOUL_SHARE*Math.sqrt(animFoulMod(r.side))*(animInBox(holder.side, holder)? 0.35 : 1)){ animFoul(r, holder); return; }
      animAddTrail(holder.x, holder.y, r.x, r.y, 'clear');
      animSay(choice(['{B} se la quita a {A}','{B} le gana la pelota a {A}','Buena recuperación de {B} ante {A}'])
        .replace('{B}', animName(r)).replace('{A}', animName(holder)), r.side);
      engRate(r, 0.035); engRate(holder, -0.025);
      animFx('tackle', r, holder);
      var lostP = anPlayer(holder.id); if(lostP) lostP.lost++;
      animGiveBall(r);
      return;
    }
  }
}
// el que tiene la pelota encara: si le gana al marcador, lo deja en el camino
function animTakeOn(holder, def){
  var att = animAttr(holder,'atq')*0.45 + animAttr(holder,'cre')*0.25 + animAttr(holder,'fis')*0.3;
  var dv = animAttr(def,'def')*0.65 + animAttr(def,'fis')*0.35;
  var p = clamp(0.5*animEdge(att, dv, 40), 0.2, 0.8);
  var dir = holder.side==='home'? 1 : -1;
  if(Math.random() < p){
    def.beatenUntil = anim.clock + 1.3;
    holder.tx = clamp(holder.x + dir*rnd(7,11), 3, 97);
    holder.ty = clamp(holder.y + (holder.y<50? rnd(1,5) : -rnd(1,5)), 6, 94);
    holder.runUntil = anim.clock + 0.9;
    holder.speed = ANIM_SPRINT*(holder.speedFactor||1);
    anim.holdTimer = 0.75;
    animSay(choice(['{A} encara y deja en el camino a {B}','¡Qué jugada de {A}, se saca de encima a {B}!','{A} le gana el mano a mano a {B}'])
      .replace('{A}', animName(holder)).replace('{B}', animName(def)), holder.side);
    engRate(holder, 0.05); engRate(def, -0.03);
    animFx('dribble', holder, def);
    var bp = anPlayer(def.id); if(bp) bp.beat++;

  }
  if(Math.random() < 0.5*ENGINE_FOUL_SHARE*Math.sqrt(animFoulMod(def.side))*(animInBox(holder.side, holder)? 0.35 : 1)){ animFoul(def, holder); return; }
  animSay(choice(['{B} le gana el duelo a {A}','{A} intenta encarar pero {B} no se la deja pasar','Bien {B}, le cierra el camino a {A}'])
    .replace('{A}', animName(holder)).replace('{B}', animName(def)), def.side);
  engRate(def, 0.04); engRate(holder, -0.03);
  animFx('tackle', def, holder);

// falta: suma al conteo, puede haber tarjeta y se para la pelota donde fue (o penal)
function animFoul(fouler, victim){
  engStat(fouler.side, 'Fouls');
  sndWhistle('foul');
  var vAdv = animAdvance(victim.side, victim.x);
  var inBox = animInBox(victim.side, victim);
  var danger = vAdv>70? 1.5 : vAdv>50? 1.1 : 0.8;
  var mod = animFoulMod(fouler.side);
  var lmF = engLM();
  // el que ya está amonestado mide más la pierna
  var booked = !!(lmF && lmF.yellowIds && lmF.yellowIds[fouler.id]);
  var r = Math.random();
  var card = null;
  if(r < 0.0025*mod + (inBox? 0.004 : 0)) card = 'red';
  else if(r < 0.16*Math.sqrt(mod)*danger*(booked? 0.3 : 1)) card = 'yellow';
  animAddTrail(fouler.x, fouler.y, victim.x, victim.y, 'clear');
  animFx('foul', fouler, victim);
  anim.ball.holder = null; anim.ball.flight = null;
  anim.ball.x = victim.x; anim.ball.y = victim.y;
  if(!card){
    animSay(choice(['Falta de {B} sobre {A}','{B} lo baja a {A}, falta','El árbitro cobra falta de {B} a {A}'])
      .replace('{A}', animName(victim)).replace('{B}', animName(fouler)), victim.side);
  }
  engRate(fouler, -0.03);
  if(card) engCard(fouler, card);
  if(inBox) animStartPenalty(victim.side, victim);
  else animStartFreeKick(victim.side, victim.x, victim.y);
}
function engCard(pl, type, reason){
  var lm = engLM();
  if(!lm || !pl) return;
  var p = pl.player, side = pl.side;
  var club = side==='home'? anim.homeClub : anim.awayClub;
  lm.yellowIds = lm.yellowIds || {};
  if(type==='yellow' && lm.yellowIds[p.id]){ type = 'red'; reason = 'doble amarilla'; }
  if(type==='yellow'){
    lm.yellowIds[p.id] = true;
    p.yellowCardsSeason = (p.yellowCardsSeason||0)+1;
    var accum = p.yellowCardsSeason>=5;
    if(accum){ p.suspensionMatches = (p.suspensionMatches||0)+1; p.yellowCardsSeason = 0; }
    engEvent({type:'yellow', team:side, playerId:p.id, playerName:p.name, accumSuspension:accum});
    engRate(pl, -0.4);
    animShowCard(club, p, 'Tarjeta amarilla', 'yellow', 3.0);

    return;
  }
  var banMatches = 1;
  if(!reason){
    var sev = Math.random();
    if(sev<0.55){ banMatches=1; reason='roja directa'; }
    else if(sev<0.88){ banMatches=2; reason='falta grave'; }
    else { banMatches=3; reason='conducta violenta'; }
  }
  p.suspensionMatches = (p.suspensionMatches||0)+banMatches;
  engEvent({type:'red', team:side, playerId:p.id, playerName:p.name, banMatches:banMatches, reason:reason});
  engRate(pl, -1.2);

  animSay('¡Roja para '+animName(pl)+'! '+(side==='home'? anim.homeName : anim.awayName)+' se queda con uno menos', side, 'red');
