  animReconcile(lm, anim.homeClub, anim.awayClub);
}
function animLaunch(fromPl, toX, toY, kind, receiver){
  var ball = anim.ball;
  var sx = ball.x, sy = ball.y;
  var speed = ANIM_SPEEDS[kind] || ANIM_SPEEDS.pass;
  var dist = animDist(sx, sy, toX, toY);
  // el pase no cae siempre en los pies: más largo y peor pasador, más se desvía
  var errK = PASS_ERROR[kind];
  if(errK && fromPl){
    var errM = dist*errK*clamp(1.6 - animAttr(fromPl,'cre')/60, 0.5, 1.4)*Math.random();
    var errA = Math.random()*Math.PI*2;
    toX = clamp(toX + Math.cos(errA)*errM, 1, 99); toY = clamp(toY + Math.sin(errA)*errM, 2, 98);
    dist = animDist(sx, sy, toX, toY);
  }
  ball.holder = null;
  ball.flight = {
    x1:sx, y1:sy, x2:toX, y2:toY, t:0,
    dur: Math.max(0.12, dist/speed),
    kind: kind, receiver: receiver || null, from: fromPl,
    offside: !!(receiver && fromPl && receiver.side===fromPl.side && (kind==='through' || kind==='long' || kind==='pass') && animIsOffside(fromPl.side, receiver)),
    offX: receiver? receiver.x : undefined, offY: receiver? receiver.y : undefined
  };
  if(kind!=='touch') animAddTrail(sx, sy, toX, toY, kind);
}
var PASS_ERROR = {pass:0.05, through:0.08, long:0.1, cross:0.08};
// a pass can be cut out — that is what makes a risky ball actually risky to watch,
// and a good reader of the game cuts out more than a bad one
function animInterceptor(fromPl, toX, toY, riskMul){
  var rivals = animRival(fromPl.side);
  var sx = anim.ball.x, sy = anim.ball.y;
  var vx = toX-sx, vy = toY-sy;
  var len = Math.sqrt(vx*vx+vy*vy) || 1;
  var best = null, bestScore = 0;
  var passer = animAttr(fromPl,'cre');
  var atkTac = animTac(fromPl.side);
  var org = animOnCounter(fromPl.side)? 0.75 : 1;
  // amplitud: abrir la cancha estira al rival; jugar por el embudo se choca con más piernas
  org *= atkTac.width==='amplio'? 0.9 : atkTac.width==='estrecho'? 1.12 : 1;
  if(atkTac.passStyle==='corto' && animDist(sx, sy, toX, toY) < 22) org *= 0.8;
  if(animMent(animOther(fromPl.side))==='def' && animAdvance(fromPl.side, toX) > 60) org *= 1.15;
  rivals.forEach(function(r){
    if(r.pos==='POR' || r.beatenUntil > anim.clock) return;
    var t = ((r.x-sx)*vx + (r.y-sy)*vy) / (len*len);
    if(t<0.12 || t>0.95) return;
    var px = sx+vx*t, py = sy+vy*t;
    var off = animDist(r.x, r.y, px, py);
    if(off > 7) return;
    var chance = Math.min(0.9, (1 - off/7) * 0.32 * riskMul * org * clamp(animEdge(animAttr(r,'def'), passer, 55), 0.65, 1.6));
    if(chance > bestScore){ bestScore = chance; best = {p:r, x:px, y:py}; }
  });
  if(best && Math.random() < bestScore) return best;
  return null;
}
function animPassCandidates(holder){
  var mates = animSide(holder.side);
  var dir = holder.side==='home'? 1 : -1;
  var vision = clamp(animAttr(holder,'cre')/60, 0.8, 1.3);
  return mates.filter(function(m){ return m!==holder && m.pos!=='POR'; }).map(function(m){
    var d = animDist(holder.x, holder.y, m.x, m.y);
    var forward = dir*(m.x-holder.x);
    var open = animNearestRival(holder, m.x, m.y).d;
    var w = 1;
    w *= d<6? 0.5 : d<32? 1.5 : d<44? 0.5 : 0.1;
    w *= 1 + Math.max(0, forward)/(animAdvance(holder.side, holder.x) > 60? 70 : 40);
    // el que llega desde atrás o se cierra desde la banda es una opción muy buscada
    if(m.intent==='arrive' || m.intent==='cutIn') w *= 1.6;
    if(animAdvance(holder.side, m.x) > 60) w *= 1/(1 + 1.0*animHeat(m));
    // el que ve el juego elige al compañero libre; el que no, se la da al primero que encuentra
    w *= Math.pow(0.5 + Math.min(open, 16)/16, vision);
    if(animIsOffside(holder.side, m)) w *= 0.25/vision;
    return {m:m, w:w, d:d};
  }).filter(function(c){ return c.w>0; });
}
function animPickWeighted(cands){
  var total = 0;
  cands.forEach(function(c){ total += c.w; });
  var r = Math.random()*total;
  for(var i=0;i<cands.length;i++){ r -= cands[i].w; if(r<=0) return cands[i]; }
  return cands[cands.length-1];
}
// probabilidad de gol de un remate desde donde está el jugador: distancia, ángulo y marca encima
function animShotXG(pl){
  var adv = animAdvance(pl.side, pl.x);
  var dx = Math.max(0.5, (100-adv)*1.05), dy = Math.abs(pl.y-50)*0.68;
  var dist = Math.sqrt(dx*dx+dy*dy);
  var ang = Math.abs(Math.atan2(dy+3.66, dx) - Math.atan2(dy-3.66, dx));
  var xg = 1/(1+Math.exp(-(-1.9 + 2.5*ang - 0.08*dist)));
  var close = 0;
  animRival(pl.side).forEach(function(r){ if(r.pos!=='POR' && r.beatenUntil<=anim.clock && animDist(r.x,r.y,pl.x,pl.y)<5) close++; });
  xg *= Math.pow(0.8, Math.min(close, 3));
  // al que ya pateó lo marcan más de cerca y le tapan el remate, cada vez más
  var heat = animHeat(pl);
  if(heat>=1) xg *= 1/(1 + heat*0.1);
  return clamp(xg, 0.004, 0.7);
}
// rivales parados entre el que remata y el arco
function animLaneBlockers(pl){
  var gx = animGoalX(pl.side), gy = 50;
  var vx = gx-pl.x, vy = gy-pl.y, len2 = vx*vx+vy*vy || 1, n = 0;
  animRival(pl.side).forEach(function(r){
    if(r.pos==='POR') return;
    var t = ((r.x-pl.x)*vx + (r.y-pl.y)*vy)/len2;
    if(t<0.02 || t>0.9) return;
    if(animDist(r.x, r.y, pl.x+vx*t, pl.y+vy*t) < 3.2) n++;
  });
  return n;
}
var ANIM_SHOT_LINES = {
  goal: ['¡GOL de {A}!','¡La clavó {A}!','¡{A} no perdona y la manda a guardar!'],
  atajada: ['¡Remata {A} y aparece el arquero!','Remate de {A}, gran atajada','{A} prueba y el arquero la saca'],
  palo: ['¡{A} la estrella en el palo!','Remate de {A} al palo'],
  bloqueado: ['Remate de {A}, bloqueado por la defensa','{A} intenta y le bloquean el disparo'],
  desviado: ['{A} remata y se le va desviada','Disparo de {A} que se pierde afuera']
};
// el remate se define acá: la calidad de la situación, la definición del que patea y el arquero
function animShoot(holder, opts){
  opts = opts || {};
  var side = holder.side, rivalSide = animOther(side);
  var xg = opts.xg!==undefined? opts.xg : animShotXG(holder);
  if(opts.header) xg *= 0.82;
  if(animOnCounter(side)) xg *= 1.12;
  // con mentalidad ofensiva quedan menos atrás y las situaciones del rival son más limpias;
  // con mentalidad defensiva hay más cuerpos en el área
  var dm = animMent(rivalSide);
  var dl = animTac(rivalSide).line;
  var exposure = 1;
  if(!opts.penalty) exposure *= dm==='ofe'? ENGINE_EXPO_OFE : dm==='def'? ENGINE_EXPO_DEF : 1;
  if(!opts.penalty && !opts.freeKick) exposure *= dl==='adelantada'? 1.2 : dl==='retrasada'? 0.82 : 1;
  // el dibujo también pesa: con tres atrás quedan espacios, con cinco volantes el medio se cierra
  var lines = animLineCounts(rivalSide), mine = animLineCounts(side);
  if(!opts.penalty){
    exposure *= lines.DEF<=3? 1.07 : lines.DEF>=5? 0.92 : 1;
    exposure *= lines.MED>=5? 0.89 : lines.MED<=3? 1.04 : 1;
    exposure *= mine.DEL>=3? 0.85 : mine.DEL<=1? 1.08 : 1;
  }
  // los riesgos se suman, pero un equipo no puede quedar más abierto que esto
  xg *= clamp(exposure, ENGINE_EXPO_MIN, ENGINE_EXPO_MAX);
  var keeper = animKeeper(rivalSide);
  var fin = opts.header? (animAttr(holder,'atq')*0.6 + animAttr(holder,'fis')*0.4) : animAttr(holder,'atq');
  if(opts.freeKick) fin = animAttr(holder,'cre');
  var gk = keeper? animAttr(keeper,'por') : 20;
  var pGoal = clamp(ENGINE_FINISH * engTune().fin * xg * clamp(1.1 + (fin-50)/90, 0.5, 1.45) * clamp(1.3 - (gk-50)/110, 0.75, 1.7), 0.003, 0.92);
  var outcome;
  if(opts.penalty){
    pGoal = clamp(0.76 + (animAttr(holder,'atq')-70)/250 - (gk-70)/300, 0.55, 0.9);
    outcome = Math.random()<pGoal? 'goal' : (Math.random()<0.6? 'atajada' : 'desviado');
  } else if(Math.random() < pGoal){
    outcome = 'goal';
  } else {
    var pBlock = opts.freeKick? 0.2 : clamp(0.1 + animLaneBlockers(holder)*0.15, 0, 0.55);
    var pSave = clamp(0.3 + xg*0.6, 0.3, 0.62);
    var r2 = Math.random();
    if(r2 < pBlock) outcome = 'bloqueado';
    else if(r2 < pBlock+0.03) outcome = 'palo';
    else if(r2 < pBlock+0.03 + pSave*(1-pBlock)) outcome = 'atajada';
    else outcome = 'desviado';
  }
  anim.lastShotAt = anim.clock;
  // el xG que se muestra es la chance de gol de un definidor y un arquero promedio: escalado para
  // que, a lo largo de una temporada, los xG sumen lo mismo que los goles
  var shotXG = Math.round((opts.penalty? 0.76 : clamp(xg*ENGINE_XG_SCALE*engTune().fin, 0.005, 0.95))*100)/100;
  var shotInfo = {x: Math.round(holder.x*10)/10, y: Math.round(holder.y*10)/10, xg: shotXG};
  engStat(side, 'XG', shotXG);
  var lmS = engLM();
  if(lmS && lmS.an){
    lmS.an[rivalSide].sv[liveLane(rivalSide, holder.y)]++;
    var ap = anPlayer(holder.id); if(ap){ ap.shots++; ap.xg = Math.round((ap.xg+shotXG)*100)/100; }
  }
  animHeatBump(holder);
  if(outcome!=='goal' && (opts.penalty || opts.freeKick || outcome==='atajada' || outcome==='palo' || xg>=0.07)){
    animQueueHighlight(animDist(holder.x, holder.y, animGoalX(side), 50)/95 + 1.1, 8);
  }
  engStat(side, 'Shots');
  if(outcome==='goal' || outcome==='atajada') engStat(side, 'ShotsOnTarget');
  var subtype = opts.penalty? 'penal' : (opts.freeKick? 'libre' : null);
  if(outcome!=='goal'){
    if(opts.penalty) engEvent({type:'miss', subtype:'penal', team:side, playerId:holder.id, playerName:holder.player.name, x:shotInfo.x, y:shotInfo.y, xg:shotXG});
    else engEvent({type:'shot', subtype:outcome, team:side, playerId:holder.id, playerName:holder.player.name, x:shotInfo.x, y:shotInfo.y, xg:shotXG});
    if(outcome==='atajada'){ engRate(holder, 0.06); engRate(keeper, 0.14); }
    else if(outcome==='palo') engRate(holder, 0.12);
    else engRate(holder, opts.penalty? -0.5 : -0.02);
  }
  var lines = ANIM_SHOT_LINES[outcome] || ANIM_SHOT_LINES.desviado;
  if(opts.penalty && outcome!=='goal') animSay(outcome==='atajada'? '¡El arquero le ataja el penal a '+animName(holder)+'!' : '¡'+animName(holder)+' tira el penal afuera!', side);
  else animSay((opts.header? '¡Cabezazo de '+animName(holder)+'! ' : '') + choice(lines).replace('{A}', animName(holder)), side);
  if(outcome!=='goal') sndChance(side, outcome, xg);
  var gx = animGoalX(side);
  var gy = clamp(50 + rnd(-4,4), 45, 55);
  if(outcome==='bloqueado'){
    var blocker = animNearestRival(holder, holder.x + (side==='home'?6:-6), holder.y);
    var bx = blocker.p? blocker.p.x : (side==='home'? holder.x+7 : holder.x-7);
    var by = blocker.p? blocker.p.y : holder.y;
    if(blocker.p) engRate(blocker.p, 0.05);
    animLaunch(holder, bx, by, 'shot', null);
    anim.ball.flight.onArrive = function(){
      if(Math.random()<0.5){ animStartCorner(side); return; }
      var pool = anim.home.concat(anim.away).filter(function(p){ return p.pos!=='POR'; });
      pool.sort(function(a,b){ return animDist(a.x,a.y,anim.ball.x,anim.ball.y)-animDist(b.x,b.y,anim.ball.x,anim.ball.y); });
      animGiveBall(pool[rnd(0, Math.min(2, pool.length-1))]);
    };
    return;
  }
  if(outcome==='desviado'){
    animLaunch(holder, gx, clamp(gy + (Math.random()<0.5?-1:1)*rnd(9,16), 12, 88), 'shot', null);
    anim.ball.flight.onArrive = function(){ animRestartFromKeeper(rivalSide); };
    return;
  }
  if(outcome==='palo'){
    animLaunch(holder, gx, (Math.random()<0.5? 44.6:55.4), 'shot', null);
    anim.ball.flight.onArrive = function(){
      var pool = anim.home.concat(anim.away).filter(function(p){ return p.pos!=='POR'; });
      pool.sort(function(a,b){ return animDist(a.x,a.y,anim.ball.x,anim.ball.y)-animDist(b.x,b.y,anim.ball.x,anim.ball.y); });
      animGiveBall(pool[0]);
    };
    return;
  }
  if(outcome==='goal'){
    var assist = (anim.lastPass && anim.lastPass.side===side && anim.lastPass.fromId!==holder.id && anim.clock-anim.lastPass.at < 7 && !opts.penalty && !opts.freeKick)
      ? animSide(side).filter(function(p){ return p.id===anim.lastPass.fromId; })[0] : null;
    animLaunch(holder, gx, gy, 'shot', null);
    anim.ball.flight.onArrive = function(){ animGoal(holder, assist, subtype, shotInfo); };
    return;
  }
  // atajada: a veces el arquero la manda al córner
  animLaunch(holder, side==='home'? 94 : 6, gy, 'shot', null);
  anim.ball.flight.onArrive = function(){
    anim.saveFlashUntil = anim.clock+0.5*animViewMul();
    if(!opts.penalty && Math.random()<0.45){ animStartCorner(side); return; }
    animRestartFromKeeper(rivalSide);
  };
}
function animGoal(scorer, assist, subtype, shot){
  var lm = engLM();
  if(!lm) return;
  var side = scorer.side, rivalSide = animOther(side);
  if(side==='home') lm.homeGoals++; else lm.awayGoals++;
  var ev = {type:'goal', team:side, playerId:scorer.id, playerName:scorer.player.name,
    assistId: assist? assist.id : null, assistName: assist? assist.player.name : null};
  if(subtype) ev.subtype = subtype;
  if(shot){ ev.x = shot.x; ev.y = shot.y; ev.xg = shot.xg; }
  engEvent(ev);
  engRate(scorer, subtype? 0.8 : 1.0);
  if(assist) engRate(assist, 0.5);
  engRate(animKeeper(rivalSide), subtype==='penal'? -0.12 : -0.32);
  lm.flashTeam = side; lm.flashTicks = 3;
  lm.attackMomentum = side==='home'? 85 : -85;
  sndGoal(side);
  var club = side==='home'? anim.homeClub : anim.awayClub;
  var tally = (scorer.player.goals||0) + lm.events.filter(function(e){ return e.type==='goal' && e.playerId===scorer.id; }).length;
  animShowCard(club, scorer.player, tally===1? '1.º gol en la temporada' : tally+'.º gol en la temporada', null, 3.6);
  // como en FM, después del gol se cuenta de dónde salió
  var linea;
  if(subtype==='penal') linea = '¡Gol de penal de '+animName(scorer)+'!';
  else if(subtype==='libre') linea = '¡Golazo de tiro libre de '+animName(scorer)+'!';
  else if(assist) linea = 'La habilitó '+animName(assist)+' y '+animName(scorer)+' no perdonó';
  else linea = '¡Gol de '+animName(scorer)+', lo hizo todo solo!';
  animSay(linea, side, 'goal');
  var speed = (lm.speed||'normal');
  if(speed==='headless'){
    // partido de otra cancha: no hay repetición ni panel
  } else if(speed==='keymoments'){
    anim.hiddenGoal = {side:side, ev:ev};
    animRecord(true);
    if(!anim.hlPending) anim.hlPending = {at:anim.clock, start: Math.max(anim.clock-9, anim.lastHlEnd||0), goal:null};
    anim.hlPending.goal = {scorerId: scorer.id};
    animStartHighlight();
  } else if(speed!=='fast') animStartReplay(scorer, assist);
  if(!anim.replay && !anim.hiddenGoal && speed!=='headless') anim.panelUntil = anim.clock + (speed==='fast'? 1.2 : 3.0);
  animKickoff(rivalSide);
}
function animRestartFromKeeper(side){
  var keeper = animKeeper(side);
  if(!keeper){ animGiveBall(animSide(side)[0]); return; }
  animGiveBall(keeper);
  anim.holdTimer = 0.7 + Math.random()*0.5;
}
function animKickoff(side){
  var mates = animSide(side);
  var mid = mates.filter(function(p){ return p.pos==='MED'; })[0] || mates[0];
  anim.home.forEach(function(p){ p.x = Math.min(p.bx, 48); p.y = p.by; p.tx = p.x; p.ty = p.y; p.intent = null; p.vx = p.vy = 0; });
  anim.away.forEach(function(p){ p.x = Math.max(p.bx, 52); p.y = p.by; p.tx = p.x; p.ty = p.y; p.intent = null; p.vx = p.vy = 0; });
  anim.setPiece = null;
  anim.lastPass = null;
  anim.hlPending = null;
  if(mid){ mid.x = 50; mid.y = 50; anim.poss = side; animGiveBall(mid); }
  anim.holdTimer = 0.8;
}
// el que tiene la pelota decide: patear, encarar, tirar el centro, filtrar, cambiar de frente o tocar
function animDecide(){
  var holder = anim.ball.holder;
  if(!holder) return;
  var side = holder.side;
  var adv = animAdvance(side, holder.x);
  var pressure = animPressureOn(holder);
  var tactics = animTac(side);
  var ment = animMent(side);
  var wide = holder.y<26 || holder.y>74;
  var dir = side==='home'? 1 : -1;
  var tempoMul = animTempoMul(side);

  // mano a mano: solo frente al arquero no se la da a nadie: encara y, cuando está a tiro, define
  if(holder.pos!=='POR' && !anim.setPiece && adv>=72 && Math.abs(holder.y-50)<26 && pressure===0){
    // nadie en el camino al arco: ni en la línea hacia el arco ni encima suyo
    var blockers1 = animRival(side).filter(function(r){
      if(r.pos==='POR') return false;
      if(animDist(r.x,r.y,holder.x,holder.y) < 5) return true;
      var t = (animAdvance(side, r.x) - adv)/(100 - adv);
      if(t <= -0.05 || t > 1.05) return false;
      return Math.abs(r.y - (holder.y + (50-holder.y)*t)) < 8 + 6*t;
    }).length;
    if(!blockers1){
      var xg1 = animShotXG(holder);
      if(xg1 >= ENGINE_ONEONONE_XG || adv >= 90){
        animSay(choice(['¡{A} queda mano a mano y define!','{A} se va solo y saca el remate','¡Solo {A} frente al arquero!']).replace('{A}', animName(holder)), side);
        animShoot(holder, {xg:xg1}); return;
      }
      holder.tx = clamp(holder.x + dir*rnd(6,10), 3, 97);
      holder.ty = clamp(holder.y + (50-holder.y)*0.35, 5, 95);
      holder.runUntil = anim.clock + 0.7;
      holder.speed = ANIM_SPRINT*(holder.speedFactor||1);
      if(!holder.soloSaid || anim.clock - holder.soloSaid > 8){ holder.soloSaid = anim.clock; animSay(choice(['{A} se va solo hacia el arco','{A} encara al arquero']).replace('{A}', animName(holder)), side); }
      anim.holdTimer = 0.55;
      return;
    }
  }

  // de contra se juega para adelante: rápido, al espacio, antes de que el rival se acomode
  if(animOnCounter(side)){
    var runners = animSide(side).filter(function(m){ return m!==holder && m.pos!=='POR' && dir*(m.x-holder.x) > 6 && (holder.pos==='POR' || animDist(m.x,m.y,holder.x,holder.y) < 40); })
      .sort(function(a,b){ return animAdvance(side,b.x)-animAdvance(side,a.x); });
    if(holder.pos==='POR' && runners.length){
      var rr = runners[0];
      animSay('¡Saca rápido '+animName(holder)+' buscando a '+animName(rr)+'!', side);
      animLaunch(holder, clamp(rr.x + dir*6, 4, 96), rr.y, 'long', rr);
      rr.runUntil = anim.clock + 1.6; rr.tx = clamp(rr.x + dir*6, 4, 96); rr.ty = rr.y;
      return;
    }
    if(holder.pos!=='POR' && pressure===0 && adv<72 && Math.random()<0.45){
      holder.tx = clamp(holder.x + dir*rnd(8,13), 3, 97);
      holder.ty = clamp(holder.y + (50-holder.y)*0.25, 5, 95);
      holder.runUntil = anim.clock + 0.9;
      holder.speed = ANIM_SPRINT*(holder.speedFactor||1);
      animSay(choice(['{A} arranca en velocidad','{A} lleva la contra','{A} se va solo hacia adelante']).replace('{A}', animName(holder)), side);
      anim.holdTimer = 0.8;
      return;
    }
    if(holder.pos!=='POR' && runners.length && Math.random()<0.7){
      var rn = animPickWatched(runners.slice(0, 3));
      var tx3 = clamp(rn.x + dir*rnd(6,12), 4, 96), ty3 = clamp(rn.y + (50-rn.y)*0.2, 6, 94);
      rn.runUntil = anim.clock + 1.4; rn.tx = tx3; rn.ty = ty3; rn.speed = ANIM_SPRINT*(rn.speedFactor||1);
      var cutC = animInterceptor(holder, tx3, ty3, 1.2);
      if(cutC){
        animSay('{B} corta la contra'.replace('{B}', animName(cutC.p)), cutC.p.side);
        animLaunch(holder, cutC.x, cutC.y, 'through', null);
        anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutC.p);
      } else {
        animSay(choice(['¡{A} la mete para {B}, que va solo!','{A} habilita a {B} en la contra']).replace('{A}',animName(holder)).replace('{B}',animName(rn)), side);
        animLaunch(holder, tx3, ty3, 'through', rn);
      }
      return;
    }
  }
  if(holder.pos==='POR'){
    var longKick = tactics.passStyle==='directo'? 0.55 : tactics.passStyle==='corto'? 0.12 : 0.3;
    if(pressure>0) longKick += 0.25;
    var outs = animPassCandidates(holder);
    var shortOuts = outs.filter(function(c){ return c.d<40 && c.m.pos==='DEF'; });
    if(Math.random() > longKick && shortOuts.length){
      var pick0 = animPickWeighted(shortOuts);
      animSay('Saca '+animName(holder)+' jugando corto con '+animName(pick0.m), side);
      animLaunch(holder, pick0.m.x, pick0.m.y, 'pass', pick0.m); return;
    }
    var fwd = animSide(side).filter(function(m){ return m.pos!=='POR' && animAdvance(side, m.x)>45; });
    var tgt0 = fwd.length? fwd[rnd(0,fwd.length-1)] : null;
    animSay('Saque largo de '+animName(holder)+(tgt0? ' buscando a '+animName(tgt0) : ''), side);
    animLaunch(holder, tgt0? tgt0.x : (side==='home'? 62:38), tgt0? tgt0.y : 50, 'long', null);
    return;
  }
  // ¿la patea?
  var xg = animShotXG(holder);
  var want = xg>=0.25? 0.95 : xg>=0.12? 0.75 : xg>=0.06? 0.45 : xg>=0.03? 0.2 : xg>=0.018? 0.06 : 0;
  want *= (ment==='ofe'? 1.1 : ment==='def'? 0.9 : 1) * clamp(1.08 + (animAttr(holder,'atq')-60)/100, 0.75, 1.35);
  if(pressure>=2 && xg>=0.05) want += 0.2;
  // los volantes se animan desde afuera; el 9 no tiene que patear todo lo que le llega
  want *= (holder.pos==='DEL'? 0.9 : holder.pos==='MED'? 1.75 : 1.7) * ENGINE_SHOT_EAGERNESS * engTune().shot;
  // el remate de media distancia: el que llega de atrás y tiene un hueco, prueba
  if(holder.pos!=='DEL' && xg>=0.015 && xg<0.08 && pressure<=1) want *= 2.8;
  // la descarga: el 9 de espaldas y marcado la deja para el que llega de frente
  if(holder.pos==='DEL' && adv>66 && pressure>=1 && xg<0.14){
    var oncoming = animSide(side).filter(function(m){
      var ma = animAdvance(side, m.x);
      return m!==holder && m.pos!=='POR' && m.pos!=='DEL' && ma>56 && ma<adv+2 && animDist(m.x,m.y,holder.x,holder.y)<22 && animPressureOn(m)<=1;
    });
    if(oncoming.length && Math.random()<0.6){
      var lay = oncoming[rnd(0, oncoming.length-1)];
      animSay(choice(['{A} aguanta de espaldas y la descarga para {B}','{A} la deja de primera para la llegada de {B}']).replace('{A}', animName(holder)).replace('{B}', animName(lay)), side);
      var cutL2 = animInterceptor(holder, lay.x, lay.y, 0.8);
      if(cutL2){ animLaunch(holder, cutL2.x, cutL2.y, 'pass', null); anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutL2.p); }
      else { animLaunch(holder, lay.x, lay.y, 'pass', lay); lay.quickShot = anim.clock + 1.2; }
      return;
    }
  }
  // el pase atrás: el que llega al fondo por un costado la tira para el que entra
  if(adv>82 && Math.abs(holder.y-50)>11 && xg<0.2){
    var arriving = animSide(side).filter(function(m){ return m!==holder && m.pos!=='POR' && animAdvance(side, m.x)>70 && animAdvance(side, m.x) < adv-3 && Math.abs(m.y-50)<16; });
    if(arriving.length && Math.random()<0.45){
      var cb = arriving[rnd(0, arriving.length-1)];
      animSay(choice(['{A} llega al fondo y la tira atrás para {B}','Pase atrás de {A}, ¡llega {B}!']).replace('{A}', animName(holder)).replace('{B}', animName(cb)), side);
      var cutCb = animInterceptor(holder, cb.x, cb.y, 1.0);
      if(cutCb){ animLaunch(holder, cutCb.x, cutCb.y, 'pass', null); anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutCb.p); }
      else { animLaunch(holder, cb.x, cb.y, 'pass', cb); cb.quickShot = anim.clock + 1.2; }
      return;
    }
  }
  var myShots = animHeat(holder);
  if(myShots>=1.5 && xg < 0.25){
    var better = animSide(side).filter(function(m){ return m!==holder && m.pos!=='POR' && animShotXG(m) > xg*0.9 && animDist(m.x,m.y,holder.x,holder.y) < 28; })[0];
    if(better && Math.random() < Math.min(0.8, 0.2*myShots)){
      animSay(choice(['{A} levanta la cabeza y la cede a {B}','Generoso {A}, se la deja a {B}']).replace('{A}', animName(holder)).replace('{B}', animName(better)), side);
      var cutB = animInterceptor(holder, better.x, better.y, 0.9);
      if(cutB){ animLaunch(holder, cutB.x, cutB.y, 'pass', null); anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutB.p); }
      else animLaunch(holder, better.x, better.y, 'pass', better);
      return;
    }
    want *= 1/(1 + (myShots-1)*0.3);
  }
  var shotBal = animShotBalance(side);
  want *= animTeamPatience(side) * shotBal;
  // el que casi no llega no espera la jugada perfecta: si tiene un metro, prueba desde afuera
  if(shotBal > 1.05 && want < 0.15 && xg >= 0.01 && adv >= 66 && pressure <= 1) want = Math.max(want, ENGINE_STARVED_SHOT*engTune().shot*(shotBal-1));
  if(holder.quickShot && holder.quickShot > anim.clock && xg>=0.025 && Math.random()<0.75*animTeamPatience(side)){ holder.quickShot = 0; animShoot(holder, {xg:xg}); return; }
  if(want>0 && anim.clock-anim.lastShotAt>0.8 && Math.random()<want){ animShoot(holder, {xg:xg}); return; }

  // el equipo que se cierra atrás no arriesga en su campo: la revienta
  var safety = ment==='def'? (pressure>=1 && adv<40? ENGINE_DEF_SAFETY : 0) : 0;
  if((pressure>=2 && adv<32 && Math.random()<0.55) || (safety && Math.random()<safety)){
    var far = animSide(side).filter(function(m){ return m!==holder && animAdvance(side, m.x)>55; });
    var tgt = far.length? far[rnd(0,far.length-1)] : null;
    if(adv<14 && Math.random()<0.2){
      animSay(animName(holder)+' la tira al córner para salir del apuro', side);
      animStartCorner(animOther(side));
      return;
    }
    animSay(choice(['{A} despeja como puede','{A} la revienta para salir de la presión'])
      .replace('{A}', animName(holder)), side);
    animLaunch(holder, tgt? tgt.x : (side==='home'? 75:25), tgt? tgt.y : holder.y, 'clear', null);
    return;
  }
  // mano a mano
  var nearR = animNearestRival(holder, holder.x, holder.y);
  if(nearR.p && nearR.d<6.5 && adv>45 && nearR.p.beatenUntil<=anim.clock){
    var dribble = holder.pos==='DEL'? 0.3 : holder.pos==='MED'? 0.17 : 0.06;
    dribble *= (ment==='ofe'? 1.1 : ment==='def'? 0.85 : 1) * clamp((animAttr(holder,'atq')+animAttr(holder,'cre'))/120, 0.6, 1.4);
    if(Math.random() < dribble){ animTakeOn(holder, nearR.p); return; }
  }
  if(wide && adv>62 && Math.random()<(tactics.width==='amplio'? 0.6 : tactics.width==='estrecho'? 0.32 : 0.46)){
    // el centro busca a cualquiera que llegue al área, no siempre al 9
    var box = animSide(side).filter(function(m){ return m!==holder && m.pos!=='POR' && Math.abs(m.y-50)<26 && animAdvance(side, m.x)>66; });
    var recv = animPickWatched(box);
    var tx = side==='home'? 89 : 11, ty = clamp(50+rnd(-10,10), 36, 64);
    animSay(choice(['Centro de {A} al área','{A} la tira al área buscando {B}','Desborda {A} y mete el centro'])
      .replace('{A}', animName(holder)).replace('{B}', recv? animName(recv):'un compañero'), side);
    animLaunch(holder, recv? recv.x : tx, recv? recv.y : ty, 'cross', recv);
    return;
  }
  var cands = animPassCandidates(holder);
  if(!cands.length){ anim.holdTimer = 0.4; return; }
  var roll = Math.random();
  var directBias = tactics.passStyle==='directo'? 0.12 : (tactics.passStyle==='corto'? -0.06 : 0);
  if(ment==='ofe') directBias += 0.04;
  if(ment==='def') directBias -= 0.03;
  if(tactics.tempo==='rapido') directBias += 0.03;
  var fwdCands = cands.filter(function(c){ return dir*(c.m.x-holder.x) > 2 && animAdvance(side, c.m.x) > 40 && c.d < 36; });
  if(roll < 0.14 + directBias && fwdCands.length){
    // pase al vacío: la pelota va al espacio y el compañero arranca a buscarla
    var pick = animPickWeighted(fwdCands);
    var tx2 = clamp(pick.m.x + dir*rnd(8,15), 4, 96);
    var ty2 = clamp(pick.m.y + rnd(-6,6), 6, 94);
    pick.m.runUntil = anim.clock + 1.4;
    pick.m.tx = tx2; pick.m.ty = ty2; pick.m.speed = ANIM_SPRINT*(pick.m.speedFactor||1);
    var cut = animInterceptor(holder, tx2, ty2, 1.7);
    if(cut){
      animSay('{A} arriesga el pase al vacío y {B} lo corta'.replace('{A}',animName(holder)).replace('{B}',animName(cut.p)), cut.p.side);
      animLaunch(holder, cut.x, cut.y, 'through', null);
      engRate(cut.p, 0.025);
      anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cut.p);
    } else {
      animSay(choice(['¡{A} filtra un pase al vacío para {B}!','Pase entre líneas de {A} buscando a {B}','{A} la pone al espacio para la carrera de {B}'])
        .replace('{A}',animName(holder)).replace('{B}',animName(pick.m)), side);
      animLaunch(holder, tx2, ty2, 'through', pick.m);
    }
    return;
  }
  if(roll < 0.24 + directBias){
    var farm = cands.filter(function(c){ return c.d>28; });
    var pickL = farm.length? animPickWeighted(farm) : animPickWeighted(cands);
    var cutL = animInterceptor(holder, pickL.m.x, pickL.m.y, 1.25);
    if(cutL){
      animSay('Pelotazo de {A} que corta {B}'.replace('{A}',animName(holder)).replace('{B}',animName(cutL.p)), cutL.p.side);
      animLaunch(holder, cutL.x, cutL.y, 'long', null);
      engRate(cutL.p, 0.02);
      anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutL.p);
    } else {
      animSay(choice(['{A} manda un pelotazo largo buscando a {B}','Cambio de frente de {A} hacia {B}','{A} juega largo para {B}'])
        .replace('{A}',animName(holder)).replace('{B}',animName(pickL.m)), side);
      animLaunch(holder, pickL.m.x, pickL.m.y, 'long', pickL.m);
    }
    return;
  }
  if(roll < 0.44 && pressure===0){
    // conduce hacia adelante, y si tiene el área cerca, hacia el arco
    var toGoal = adv>62;
    holder.tx = clamp(holder.x + dir*rnd(4,9), 3, 97);
    holder.ty = clamp(toGoal? holder.y + (50-holder.y)*0.35 : holder.y + rnd(-4,4), 5, 95);
    holder.speed = ANIM_JOG*1.3*(holder.speedFactor||1);
    animSay(choice(['{A} avanza con la pelota','{A} encara y se mete en campo rival','{A} conduce y gana metros','{A} usa bien los pies para salir jugando'])
      .replace('{A}',animName(holder)), side);
    anim.holdTimer = (0.5 + Math.random()*0.3)*tempoMul;
    return;
  }
  var pickS = animPickWeighted(cands);
  // de vez en cuando el relato habla del equipo y no del jugador, como en FM
  if(Math.random()<0.12){
    var teamName = side==='home'? anim.homeName : anim.awayName;
    animSay(adv>62
      ? choice(['El '+teamName+' está metido en campo rival','¡Gran presión del '+teamName+'!','El '+teamName+' no le da respiro al rival'])
      : choice(['El '+teamName+' va avanzando con el balón','El '+teamName+' mueve la pelota con paciencia','Sale jugando el '+teamName]), side);
  } else {
    animSay(choice(['{A} se la da a {B}','{A} toca corto para {B}','{A} la mueve hacia {B}','{B} recibe de {A} al primer toque'])
      .replace('{A}',animName(holder)).replace('{B}',animName(pickS.m)), side);
  }
  var cutS = animInterceptor(holder, pickS.m.x, pickS.m.y, pressure>0? 1.15 : 0.8);
  if(cutS){
    animSay(choice(['{B} adivina el pase de {A} y lo corta','La intercepta {B}','{B} lee el pase de {A}'])
      .replace('{A}',animName(holder)).replace('{B}',animName(cutS.p)), cutS.p.side);
    animLaunch(holder, cutS.x, cutS.y, 'pass', null);
    engRate(cutS.p, 0.025); engRate(holder, -0.015);
    anim.ball.flight.onArrive = (function(r){ return function(){ animGiveBall(r); }; })(cutS.p);
  } else {
    animLaunch(holder, pickS.m.x, pickS.m.y, 'pass', pickS.m);
  }
}
// la pelota cae en el área: la pelea el que mejor salta y mejor se ubica
function animResolveCross(side, receiver){
  var ball = anim.ball;
  var gk = animKeeper(animOther(side));
  var goalDist = animDist(ball.x, ball.y, animGoalX(side), 50);
  if(gk && goalDist < 13 && Math.random() < 0.22*clamp(animAttr(gk,'por')/70, 0.6, 1.4)){
    animSay('Sale '+animName(gk)+' y la agarra con seguridad', gk.side);
    engRate(gk, 0.05);
    animGiveBall(gk); anim.holdTimer = 1.0;
    return;
  }
  var att = receiver && animDist(receiver.x, receiver.y, ball.x, ball.y) < 6? receiver : null;
  if(!att){
    // la pelota cae entre varios: la gana uno de los que están cerca, no siempre el mismo
    var near = animSide(side).filter(function(p){ return p.pos!=='POR' && animDist(p.x,p.y,ball.x,ball.y) < 9; });
    att = animPickWatched(near) || animSide(side).filter(function(p){ return p.pos!=='POR'; })
      .sort(function(a,b){ return animDist(a.x,a.y,ball.x,ball.y)-animDist(b.x,b.y,ball.x,ball.y); })[0] || null;
  }
  var def = animNearestRival(att || {side:side}, ball.x, ball.y).p;
  var aScore = att? animAttr(att,'fis')*0.5 + animAttr(att,'atq')*0.5 - animDist(att.x,att.y,ball.x,ball.y)*3 : -999;
  var dScore = def? animAttr(def,'fis')*0.5 + animAttr(def,'def')*0.5 - animDist(def.x,def.y,ball.x,ball.y)*3 + 4 : -999;
  var pAtt = 1/(1+Math.exp(-(aScore-dScore)/14));
  animFx('header', att, def);
  if(att && Math.random() < pAtt){
    att.x = ball.x; att.y = ball.y;
    var xg = animShotXG(att);
    if(xg>0.04 && Math.random()<Math.min(0.85, ENGINE_HEADER_SHOT*engTune().shot)){ animShoot(att, {xg:xg, header:true}); return; }
    animGiveBall(att);
    return;
  }
  if(def){
    engRate(def, 0.04);
    if(Math.random()<0.45){
      animSay(animName(def)+' la manda al córner', def.side);
      animStartCorner(side);
      return;
    }
    animSay(choice(['Rechaza {B} de cabeza','{B} despeja el centro','Gana arriba {B} y la saca'])
      .replace('{B}', animName(def)), def.side);
    var dir = def.side==='home'? 1 : -1;
    anim.ball.x = def.x; anim.ball.y = def.y;
    animLaunch(def, clamp(def.x + dir*rnd(20,35), 5, 95), clamp(def.y + rnd(-25,25), 6, 94), 'clear', null);
  }
}
// el árbitro sigue la jugada de cerca y los dos asistentes corren sus líneas
function animMoveRefs(dt){
  // los árbitros son solo para la vista: sin pantalla no hace falta moverlos
  if(ENGINE_HEADLESS) return;
  var b = anim.ball, R = anim.refs;
  function ease(o, tx, ty, sp){
    var dx = tx-o.x, dy = ty-o.y, d = Math.sqrt(dx*dx+dy*dy);
    if(d<0.1) return;
    var st = Math.min(d, sp*dt);
    o.x += (dx/d)*st; o.y += (dy/d)*st;
  }
  ease(R.ref, clamp(b.x-6, 6, 94), clamp(b.y+9, 12, 88), 6.5);
  var homeLine = anim.home.filter(function(p){return p.pos!=='POR';}).map(function(p){return p.x;}).sort(function(a,b){return a-b;});
  var awayLine = anim.away.filter(function(p){return p.pos!=='POR';}).map(function(p){return p.x;}).sort(function(a,b2){return b2-a;});
  ease(R.ar1, clamp(awayLine[1]!==undefined? awayLine[1] : b.x, 4, 96), 1.5, 7.5);
  ease(R.ar2, clamp(homeLine[1]!==undefined? homeLine[1] : b.x, 4, 96), 98.5, 7.5);
}
function animStartCorner(side){
  var gx = side==='home'? 98.5 : 1.5;
  var gy = Math.random()<0.5? 2.5 : 97.5;
  var mates = animSide(side).filter(function(p){ return p.pos!=='POR'; });
  if(!mates.length) return;
  var taker = mates.slice().sort(function(a,b){ return animDist(a.x,a.y,gx,gy)-animDist(b.x,b.y,gx,gy); })[0];
  anim.setPiece = {type:'corner', side:side, x:gx, y:gy, taker:taker, until:anim.clock+4.2, taken:false};
  anim.ball.holder = null;
  anim.ball.flight = null;
  anim.ball.x = gx; anim.ball.y = gy;
  anim.poss = side;
  engStat(side, 'Corners');
  animSay('Córner para '+(side==='home'? anim.homeName : anim.awayName)+', lo va a ejecutar '+animName(taker), side);
}
function animSetPieceTaker(side, key, attr){
  var mates = animSide(side).filter(function(p){ return p.pos!=='POR'; });
  if(!mates.length) return null;
  var chosen = pickTaker(animTac(side), mates.map(function(m){ return m.player; }), key, attr);
  return mates.filter(function(m){ return chosen && m.id===chosen.id; })[0] || mates[0];
}
function animStartFreeKick(side, x, y){
  var mates = animSide(side).filter(function(p){ return p.pos!=='POR'; });
  if(!mates.length) return;
  var fx = clamp(x!==undefined? x : anim.ball.x, 6, 94);
  var fy = clamp(y!==undefined? y : anim.ball.y, 6, 94);
  var adv = animAdvance(side, fx);
  var danger = adv>66 && Math.abs(fy-50)<26;
  var taker = danger? animSetPieceTaker(side, 'freeKickTaker', 'cre')
    : mates.slice().sort(function(a,b){ return animDist(a.x,a.y,fx,fy)-animDist(b.x,b.y,fx,fy); })[0];
  anim.setPiece = {type:'free', side:side, x:fx, y:fy, taker:taker, until:anim.clock+(danger? 2.6 : 1.6), taken:false};
  anim.ball.holder = null; anim.ball.flight = null;
  anim.ball.x = fx; anim.ball.y = fy;
  anim.poss = side;
  anim.lastPass = null;
  animSay(danger? 'Tiro libre peligroso para '+(side==='home'? anim.homeName : anim.awayName)+'. Se para '+animName(taker)
    : 'Es un tiro libre para '+(side==='home'? anim.homeName : anim.awayName), side);
}
function animStartPenalty(side, victim){
  var taker = animSetPieceTaker(side, 'penaltyTaker', 'atq');
  var px = side==='home'? 89.5 : 10.5;
  anim.setPiece = {type:'penalty', side:side, x:px, y:50, taker:taker, until:anim.clock+3.0, taken:false};
  anim.ball.holder = null; anim.ball.flight = null;
  anim.ball.x = px; anim.ball.y = 50;
  anim.poss = side;
  anim.lastPass = null;
  animSay('¡PENAL para '+(side==='home'? anim.homeName : anim.awayName)+'! Le cometieron falta a '+animName(victim)+'. Va a patear '+animName(taker), side, 'goal');
}
function animSetPieceStep(dt){
  var sp = anim.setPiece;
  if(!sp) return true;
  var taker = sp.taker;
  if(!taker){
    var mates0 = animSide(sp.side).filter(function(p){ return p.pos!=='POR'; });
    taker = sp.taker = mates0[0] || null;
    if(!taker){ anim.setPiece = null; return true; }
  }
  anim.ball.x = sp.x; anim.ball.y = sp.y;
  var arrived = animDist(taker.x, taker.y, sp.x, sp.y) < 4.0;
  // en el córner se espera a que los centrales lleguen al área antes de tirar el centro
  if(arrived && sp.type==='corner' && animSide(sp.side).some(function(p){ return p.pos==='DEF' && !p.wide && animAdvance(sp.side, p.x)<=78; })) arrived = false;
  if(!sp.taken && (arrived || anim.clock > sp.until)){
    sp.taken = true;
    taker.x = sp.x; taker.y = sp.y;
    anim.setPiece = null;
    animGiveBall(taker);
    if(sp.type==='penalty'){ animShoot(taker, {penalty:true}); return true; }
    if(sp.type==='free'){
      var adv = animAdvance(sp.side, taker.x);
      if(adv>68 && Math.abs(taker.y-50)<24 && Math.random()<0.45){
        animSay(animName(taker)+' le pega directo al arco...', sp.side);
        animShoot(taker, {xg: clamp(0.11 - (90-adv)*0.003, 0.03, 0.12), freeKick:true});
        return true;
      }
      if(adv>66){
        var boxMates = animSide(sp.side).filter(function(p){ return p!==taker && Math.abs(p.y-50)<22 && animAdvance(sp.side, p.x)>70; });
        var rcv = boxMates.length? boxMates[rnd(0,boxMates.length-1)] : null;
        animSay('La pone al área '+animName(taker), sp.side);
        animLaunch(taker, rcv? rcv.x : (sp.side==='home'? 89:11), rcv? rcv.y : 50, 'cross', rcv);
        return true;
      }
      var opts = animPassCandidates(taker);
      if(opts.length){
        var p2 = animPickWeighted(opts);
        animSay(animName(taker)+' la juega corta con '+animName(p2.m), sp.side);
        animLaunch(taker, p2.m.x, p2.m.y, 'pass', p2.m);
      }
      return true;
    }
    var box = animSide(sp.side).filter(function(p){ return p!==taker && p.pos!=='POR' && animAdvance(sp.side, p.x)>78; });
    // los centrales que suben al córner son los más buscados de arriba
    var tall = box.filter(function(p){ return p.pos==='DEF'; });
    var recv = (tall.length && Math.random()<0.65)? tall[rnd(0, tall.length-1)] : animPickWatched(box);
    var tx = sp.side==='home'? 91 : 9;
    var ty = clamp(50 + rnd(-9,9), 36, 64);
    animSay(choice(['La manda al área {A}','Centro de {A} desde el córner','{A} la tira al primer palo'])
      .replace('{A}', animName(taker)), sp.side);
    animLaunch(taker, recv? recv.x : tx, recv? recv.y : ty, 'cross', recv);
    return true;
  }
  return false;
}
// se guarda un rollo corto de los ultimos segundos para poder repetir el gol
function animRecord(force){
  if(ENGINE_HEADLESS) return;
  if(!force && anim.clock - (anim.lastRecAt||0) < 0.12) return;
  anim.lastRecAt = anim.clock;
  var lmR = engLM();
  var bvR = animBallVisual(anim.ball);
  var f = {t:anim.clock, b:[anim.ball.x, anim.ball.y], v:[bvR.x, bvR.y, bvR.h], p:[], h: anim.ball.holder? anim.ball.holder.id : null,
    s: anim.say? [anim.say.text, anim.say.side, anim.say.tone] : null, m: lmR? Math.min(lmR.clock+1, matchEnd(lmR)) : 0};
  anim.home.concat(anim.away).forEach(function(pl){ f.p.push([pl.id, pl.x, pl.y]); });
  anim.buffer.push(f);
  if(anim.buffer.length > 150) anim.buffer.shift();
}
function animStartReplay(scorer, assist){
  if(!anim || anim.buffer.length < 6) return;
  var involved = [];
  if(scorer) involved.push(scorer.id);
  if(assist) involved.push(assist.id);
  // el último cuadro tiene que ser la pelota entrando
  anim.buffer.push({b:[anim.ball.x, anim.ball.y], p:anim.home.concat(anim.away).map(function(pl){ return [pl.id, pl.x, pl.y]; })});
  anim.replay = {frames: anim.buffer.slice(-70), i:0, scorerId: scorer? scorer.id : null, involved: involved};
  anim.buffer = [];
}
/* ---------- jugadas clave ----------
   Con "Jugadas clave" el partido corre rápido y se cuenta en el tablero. Cuando pasa algo que
   importa (un remate con peligro, un penal, una roja, un gol), el motor se detiene y en la
   cancha se ve la jugada entera desde unos segundos antes, como en FM.                        */
function animKeyMoments(){ var lm = engLM(); return !!(lm && lm.speed==='keymoments'); }
function animQueueHighlight(delay, back, goal){
  if(!animKeyMoments()) return;
  var at = anim.clock + delay;
  if(anim.hlPending){
    anim.hlPending.at = Math.max(anim.hlPending.at, at);
    if(goal) anim.hlPending.goal = goal;
    return;
  }
  anim.hlPending = {at:at, start: Math.max(anim.clock - back, anim.lastHlEnd||0), goal: goal||null};
}
function animStartHighlight(){
  var hp = anim.hlPending;
  anim.hlPending = null;
  if(!hp) return;
  anim.lastHlEnd = anim.clock;
  var frames = anim.buffer.filter(function(f){ return f.t!==undefined && f.t >= hp.start; });
  if(frames.length < 8){
    if(hp.goal){ anim.hiddenGoal = null; anim.panelUntil = anim.clock + 3.0; }
    return;
  }
  anim.replay = {kind:'highlight', frames: frames, i:0, goal: hp.goal, involved: hp.goal? [hp.goal.scorerId] : []};
}
// la pelota viaja; cuando llega, se resuelve quién se queda con ella
function animBallArrives(f){
  var ball = anim.ball;
  var arrive = f.onArrive, recv = f.receiver;
  ball.flight = null;
  if(arrive){ arrive(); return; }
  if(f.offside && recv){
    animSay('Fuera de juego de '+animName(recv)+', levanta la bandera el asistente', animOther(recv.side));
    engStat(recv.side, 'Offsides');
    animStartFreeKick(animOther(recv.side), f.offX!==undefined? f.offX : recv.x, f.offY!==undefined? f.offY : recv.y);
    return;
  }
  if(f.kind==='cross'){ animResolveCross(f.from? f.from.side : anim.poss, recv); return; }
  if(f.kind==='long' || f.kind==='clear') animFx('land', null, null);
  if(f.kind==='touch'){
    // la pelota suelta la gana el que llega primero: el dueño o el rival que estaba cerca
    var poolT = anim.home.concat(anim.away).filter(function(p){ return p.pos!=='POR'; })
      .sort(function(a,b){ return animDist(a.x,a.y,ball.x,ball.y)-animDist(b.x,b.y,ball.x,ball.y); });
    var winT = poolT[0];
    if(recv && winT && winT!==recv && animDist(recv.x,recv.y,ball.x,ball.y) - animDist(winT.x,winT.y,ball.x,ball.y) < 1.2) winT = recv;
    if(winT && recv && winT.side!==recv.side){
      animSay(choice(['Se le va larga a {A} y la gana {B}','Mal control de {A}, aprovecha {B}']).replace('{A}', animName(recv)).replace('{B}', animName(winT)), winT.side);
      var lostT = anPlayer(recv.id); if(lostT) lostT.lost++;
    }
    animGiveBall(winT || recv);
    return;
  }
  // el pase al vacío que cae en el área lo puede salir a cortar el arquero
  if(recv && f.kind==='through' && animAdvance(recv.side, ball.x) > 84 && Math.abs(ball.y-50) < 30){
    var gkT = animKeeper(animOther(recv.side));
    if(gkT && animDist(gkT.x, gkT.y, ball.x, ball.y) < 14 && Math.random() < 0.45*clamp(animAttr(gkT,'por')/60, 0.7, 1.3)){
      animSay('Sale '+animName(gkT)+' y le gana la carrera a '+animName(recv), gkT.side);
      engRate(gkT, 0.04);
      animGiveBall(gkT); anim.holdTimer = 0.9;
      return;
    }
  }
  if(recv && (f.kind==='long' || f.kind==='through')){
    var foe = animNearestRival(recv, ball.x, ball.y);
    var dR = animDist(recv.x, recv.y, ball.x, ball.y);
    if(foe.p && foe.d < 6 && dR < 9){
      var aR = (f.kind==='long'? animAttr(recv,'fis')*0.6 + animAttr(recv,'atq')*0.4 : animAttr(recv,'fis')*0.5 + animAttr(recv,'atq')*0.5) - dR*2.5;
      var aF = animAttr(foe.p,'def')*0.6 + animAttr(foe.p,'fis')*0.4 - foe.d*2.5;
      if(Math.random() > 1/(1+Math.exp(-(aR-aF)/14))){
        animSay(choice(['La gana {B} en el salto','{B} se adelanta y la corta','Anticipa {B} y se queda con la pelota']).replace('{B}', animName(foe.p)), foe.p.side);
        engRate(foe.p, 0.03);
        animGiveBall(foe.p);
        return;
      }
    }
  }
  if(recv && animDist(recv.x, recv.y, ball.x, ball.y) < 7){
    if(f.from && f.from.side===recv.side){
      anim.lastPass = {fromId:f.from.id, side:recv.side, at:anim.clock};

function animStep(dt){
  if(!anim) return;
  anim.clock += dt;
  animMoveRefs(dt);
  if(anim.setPiece){
    var done = animSetPieceStep(dt);
    if(!done){ animUpdateTargets(dt); animMovePlayers(dt); animRecord(); return; }
  }
  var ball = anim.ball;
  if(ball.flight){
    var f = ball.flight;
    f.t += dt;
    var k = Math.min(1, f.t/f.dur);
    ball.x = f.x1 + (f.x2-f.x1)*k;
    ball.y = f.y1 + (f.y2-f.y1)*k;
    if(k>=1) animBallArrives(f);
  } else if(ball.holder){
    ball.x = ball.holder.x; ball.y = ball.holder.y;
    // con un rival encima nadie se queda pensando: suelta rápido
    if(anim.holdTimer > ENGINE_PRESS_RELEASE && !anim.setPiece && animNearestRival(ball.holder, ball.x, ball.y).d < 4) anim.holdTimer = ENGINE_PRESS_RELEASE;
    animDuels(dt);
    anim.holdTimer -= dt;
    if(anim.ball.holder && anim.holdTimer<=0 && !anim.setPiece) animDecide();
  } else if(!anim.setPiece){
    var mates = animSide(anim.poss).filter(function(p){ return p.pos!=='POR'; });
    mates.sort(function(a,b){ return animDist(a.x,a.y,ball.x,ball.y)-animDist(b.x,b.y,ball.x,ball.y); });
    animGiveBall(mates[0] || animSide(anim.poss)[0]);
  }
  // quién tiene la pelota y dónde: de acá sale la posesión y el dominio territorial
  anim.possTime[anim.poss] += dt;
  // cada vez que un equipo pisa el último tercio, se anota por qué carril entró
  if(ball.holder && !anim.entryDone && animAdvance(anim.poss, ball.x) > 66){
    anim.entryDone = true;
    var lmE = engLM();
    if(lmE && lmE.an){ var dS = animOther(anim.poss); lmE.an[dS].vs[liveLane(dS, ball.y)]++; }
  }
  if(animAdvance(anim.poss, ball.x) > 66) anim.terrMin[anim.poss] += dt;

function engineAdvance(simDt){
  var steps = 0;
  while(simDt > 1e-6 && steps < 4000){
    if(!anim || !state.liveMatch || state.liveMatch.status!=='playing') return;
    if(anim.replay || anim.panelUntil > anim.clock) return;
    var h = Math.min(ENGINE_STEP, simDt);
    simDt -= h; steps++;
    animStep(h);
    if(anim.hlPending && anim.clock >= anim.hlPending.at){ animStartHighlight(); if(anim.replay) return; }
    anim.minuteAcc += h;
    if(anim.minuteAcc >= ENGINE_SEC_PER_MIN){

  }

function hexToRgb(hex){
  var h = String(hex||'').replace('#','');
  if(h.length===3) h = h.charAt(0)+h.charAt(0)+h.charAt(1)+h.charAt(1)+h.charAt(2)+h.charAt(2);
  var n = parseInt(h,16);
  if(isNaN(n) || h.length!==6) return {r:128,g:128,b:128};
  return {r:(n>>16)&255, g:(n>>8)&255, b:n&255};
}
function colorGap(a, b){
  var x = hexToRgb(a), y = hexToRgb(b);
  var dr = x.r-y.r, dg = x.g-y.g, db = x.b-y.b;
  return Math.sqrt(2*dr*dr + 4*dg*dg + 3*db*db);
}
function readableInk(hex){
  var c = hexToRgb(hex);
  var lum = (0.299*c.r + 0.587*c.g + 0.114*c.b)/255;
  return lum>0.6? '#10141b' : '#ffffff';
}
function rgbToHsl(hex){
  var c = hexToRgb(hex);
  var r = c.r/255, g = c.g/255, b = c.b/255;
  var max = Math.max(r,g,b), min = Math.min(r,g,b);
  var l = (max+min)/2, h = 0, s = 0;
  if(max!==min){
    var d = max-min;
    s = l>0.5? d/(2-max-min) : d/(max+min);
    if(max===r) h = ((g-b)/d + (g<b?6:0));
    else if(max===g) h = (b-r)/d + 2;
    else h = (r-g)/d + 4;
    h *= 60;
  }
  return {h:h, s:s, l:l};
}
var KIT_CLASH_GAP = 300;
var GK_KIT_PALETTE = ['#F2CE4E','#3FBF6F','#E0722F','#B06CD8','#2ED9D9','#F25FA0'];
// two kits clash when they're close overall, or when they're two shades of the same
// colour family — a light blue and a navy read as "both blue" on small dots. A colour
// that is nearly black or nearly white reads as black or white, not as its hue, so it
// never clashes on hue alone.
function kitsClash(a, b){
  if(colorGap(a, b) < KIT_CLASH_GAP) return true;
  var A = rgbToHsl(a), B = rgbToHsl(b);
  var aChromatic = A.s>0.25 && A.l>0.18 && A.l<0.85;
  var bChromatic = B.s>0.25 && B.l>0.18 && B.l<0.85;
  if(aChromatic && bChromatic){
    var dh = Math.abs(A.h-B.h);
    if(dh>180) dh = 360-dh;
    if(dh < 45 && Math.abs(A.l-B.l) < 0.45) return true;
  }
  return false;
}

// colours that clash with neither outfield kit — as in a real broadcast
function matchKits(homeClub, awayClub){
  var home = (homeClub && homeClub.color) || '#8899aa';
  var away = (awayClub && awayClub.color) || '#ccd2da';
  if(kitsClash(home, away)){
    var candidates = [(awayClub && awayClub.color2), '#F4F4F4', '#15181F'];
    var picked = null, bestGap = colorGap(home, away);
    candidates.forEach(function(c){
      if(!c || picked) return;
      if(!kitsClash(home, c)){ picked = c; return; }
      var g = colorGap(home, c);
      if(g > bestGap){ bestGap = g; away = c; }
    });
    if(picked) away = picked;
  }
  function pickGk(taken){
    var best = GK_KIT_PALETTE[0], bestScore = -1;
    GK_KIT_PALETTE.forEach(function(c){
      var score = Math.min(colorGap(c, home), colorGap(c, away));
      taken.forEach(function(t){ score = Math.min(score, colorGap(c, t)); });
      if(score > bestScore){ bestScore = score; best = c; }
    });
    return best;
  }
  var homeGk = pickGk([]);
  return {home:home, away:away, homeGk:homeGk, awayGk:pickGk([homeGk])};
}

  if(anim.panelUntil > anim.clock && !anim.replay){

  if(lm.speed==='keymoments' && !anim.replay && lm.status==='playing'){

      '<button class="replay-skip" data-action="skip-replay" type="button">Seguir</button></div>';
  } else if(anim.replay){
    var repNames = (anim.replay.involved||[]).map(function(id){
      var pl = anim.home.concat(anim.away).filter(function(q){ return q.id===id; })[0];
      if(!pl) return '';
      var cls = id===anim.replay.scorerId? 'is-scorer' : '';
      return '<span class="replay-name '+cls+'">'+escapeHtml(animName(pl))+'</span>';
    }).join('');
    repHTML = '<div class="replay-bar"><span class="replay-badge">REP.</span>'+repNames+
      '<button class="replay-skip" data-action="skip-replay" type="button">Saltar</button></div>';
  }
  var cardHTML = '';
  if(anim.card && anim.card.until > anim.clock && !anim.replay){
    var c = anim.card;

    cardHTML = '<div class="pitch-card'+accentCls+'">'+
      '<span class="pitch-card-crest">'+(c.club? crestSVG(c.club, 26) : '')+'</span>'+

    pitchFieldSVG()+'<g data-anim="trail"></g><g data-anim="fx"></g>'+refsSVG+homeDots+awayDots+carrierLabel+labelsSVG+ballShadow+ball+
  '</svg>'+
  sndToggleHTML()+
  '<div class="pitch-cam-toggle"><button class="pitch-cam-btn'+(pitchCamMode==='full'?' is-active':'')+'" data-action="pitch-cam" data-id="full" type="button">Cancha entera</button>'+
  '<button class="pitch-cam-btn'+(pitchCamMode==='cam'?' is-active':'')+'" data-action="pitch-cam" data-id="cam" type="button">Cámara</button></div>'+
  '</div>'+
  renderCommentaryBanner(lm, kits)+

// lo que se puede mostrar sin arruinar la jugada que todavía se está viendo
function liveHiddenGoal(){ return anim && anim.hiddenGoal? anim.hiddenGoal : null; }
function liveShownEvents(lm){ var hg = liveHiddenGoal(); return hg? lm.events.filter(function(e){ return e!==hg.ev; }) : lm.events; }
function liveShownScore(lm){
  var hg = liveHiddenGoal();
  return {h: lm.homeGoals - (hg && hg.side==='home'? 1 : 0), a: lm.awayGoals - (hg && hg.side==='away'? 1 : 0)};
}
function liveShownFlash(lm){ return liveHiddenGoal()? null : lm.flashTeam; }
// el tablero de jugadas clave: el reloj corre y el partido se cuenta en texto
function liveBoardHTML(lm, homeClub, awayClub){
  var evs = liveShownEvents(lm).filter(function(e){ return e.type!=='sub-injury' && e.type!=='sub'; }).slice(-5).reverse();
  var rows = evs.map(function(e){
    var d = eventDescription(e, lm.homeName, lm.awayName);
    return '<div class="board-row'+(e.type==='flavor'? ' is-flavor' : '')+'"><span class="board-min">'+e.minute+"'</span>"+
      (d.label? '<span class="board-tag board-'+e.type+'">'+d.label+'</span>' : '')+'<span class="board-txt">'+d.desc+'</span></div>';
  }).join('');
  return '<div class="board-head"><span class="live-dot"></span><span class="board-clock mono">'+lm.clock+"'</span>"+
    '<span class="board-note">Jugadas clave: el partido corre y frena cuando se arma algo</span></div>'+
    '<div class="board-feed">'+(rows || '<div class="board-row is-flavor"><span class="board-txt">Arrancó el partido.</span></div>')+'</div>';
}
function renderCommentaryBanner(lm, kits){
  var evs = liveShownEvents(lm)||[];
  var last = evs.length? evs[evs.length-1] : null;
  var txt = '', band = '#2a3244';
  if(anim && anim.say){
    txt = escapeHtml(anim.say.text);
    band = anim.say.side==='home'? kits.home : (anim.say.side==='away'? kits.away : '#2a3244');
    if(anim.say.tone==='yellow') band = '#f2ce4e';
    else if(anim.say.tone==='red') band = '#e5484d';
  } else if(last){
    txt = eventDescription(last, lm.homeName, lm.awayName).desc;
    band = last.team==='home'? kits.home : (last.team==='away'? kits.away : '#2a3244');
  }
  return '<div class="commentary-banner" data-anim="say"><span class="say-band" data-anim="sayband" style="background:'+band+';"></span>'+
    '<span class="mono" data-anim="saymin">'+(lm.clock||0)+"'</span><span class=\"commentary-text\" data-anim=\"saytext\">"+txt+'</span></div>';
}
function renderCompactMatchStats(m){
  var mine = m.mySide==='home';
  function pair(h,a){ return mine? ((h||0)+'-'+(a||0)) : ((a||0)+'-'+(h||0)); }
  return '<div class="stat-strip">'+
    '<span>Remates <strong class="mono">'+pair(m.homeShots, m.awayShots)+'</strong></span>'+
    '<span>Al arco <strong class="mono">'+pair(m.homeShotsOnTarget, m.awayShotsOnTarget)+'</strong></span>'+
    '<span>Córners <strong class="mono">'+pair(m.homeCorners, m.awayCorners)+'</strong></span>'+
    '<span>Faltas <strong class="mono">'+pair(m.homeFouls, m.awayFouls)+'</strong></span>'+
    '<span>xG <strong class="mono">'+(mine? (m.homeXG||0).toFixed(1)+'-'+(m.awayXG||0).toFixed(1) : (m.awayXG||0).toFixed(1)+'-'+(m.homeXG||0).toFixed(1))+'</strong></span>'+
  '</div>';
}
function renderPossessionBar(lm){
  var myPoss = lm.mySide==='home'? lm.possession : 100-lm.possession;
  return '<div class="stat-bar-block"><div class="stat-bar-label"><span>Posesión</span><span class="mono">'+Math.round(myPoss)+'% — '+Math.round(100-myPoss)+'%</span></div>'+
    '<div class="poss-bar"><div class="poss-fill-mine" style="width:'+myPoss+'%;"></div><div class="poss-fill-rival" style="width:'+(100-myPoss)+'%;"></div></div></div>';
}
function renderMomentumBar(lm){
  var myMomentum = lm.mySide==='home'? lm.attackMomentum : -lm.attackMomentum;
  var rightPct = clamp(myMomentum,0,100), leftPct = clamp(-myMomentum,0,100);
  return '<div class="stat-bar-block"><div class="stat-bar-label"><span>Momento de ataque</span><span class="mono">'+(myMomentum>=0?'vos':'rival')+'</span></div>'+
    '<div class="momentum-bar"><div class="momentum-track momentum-track-left"><div class="momentum-fill is-rival" style="width:'+leftPct+'%;"></div></div>'+
    '<div class="momentum-center"></div>'+
    '<div class="momentum-track momentum-track-right"><div class="momentum-fill is-mine" style="width:'+rightPct+'%;"></div></div></div></div>';
}
function statCompareRow(label, homeVal, awayVal, mySide){
  var myVal = mySide==='home'? homeVal : awayVal;
  var rivalVal = mySide==='home'? awayVal : homeVal;
  var total = myVal+rivalVal;
  var myPct = total>0? Math.round((myVal/total)*100) : 50;
  return '<div class="stat-bar-block"><div class="stat-bar-label"><span class="mono">'+myVal+'</span><span>'+label+'</span><span class="mono">'+rivalVal+'</span></div>'+
    '<div class="poss-bar"><div class="poss-fill-mine" style="width:'+myPct+'%;"></div><div class="poss-fill-rival" style="width:'+(100-myPct)+'%;"></div></div></div>';
}
function renderMatchStatsBlock(m){
  return (m.homeXG!==undefined? statCompareRow('Goles esperados (xG)', Math.round((m.homeXG||0)*10)/10, Math.round((m.awayXG||0)*10)/10, m.mySide) : '')+
    statCompareRow('Remates', m.homeShots||0, m.awayShots||0, m.mySide)+
    statCompareRow('Al arco', m.homeShotsOnTarget||0, m.awayShotsOnTarget||0, m.mySide)+
    statCompareRow('Córners', m.homeCorners||0, m.awayCorners||0, m.mySide)+
    statCompareRow('Faltas', m.homeFouls||0, m.awayFouls||0, m.mySide);
}
// la cronica que FM publica al terminar el partido
function matchReportHTML(m, homeClub, awayClub, motm){
  if(!m) return '';
  var mine = m.mySide==='home'? homeClub : awayClub;
  var rival = m.mySide==='home'? awayClub : homeClub;
  var myGoals = m.mySide==='home'? m.homeGoals : m.awayGoals;
  var hisGoals = m.mySide==='home'? m.awayGoals : m.homeGoals;
  var diff = myGoals - hisGoals;
  var head, body;
  if(diff >= 3) head = 'EL '+mine.name.toUpperCase()+' PASÓ POR ENCIMA DEL '+rival.name.toUpperCase();
  else if(diff > 0) head = 'EL '+mine.name.toUpperCase()+' SE LLEVÓ LOS TRES PUNTOS';
  else if(diff === 0) head = 'EL '+mine.name.toUpperCase()+' Y EL '+rival.name.toUpperCase()+' REPARTIERON PUNTOS';
  else if(diff > -3) head = 'DERROTA DEL '+mine.name.toUpperCase()+' ANTE EL '+rival.name.toUpperCase();
  else head = 'GOLPE DURO PARA EL '+mine.name.toUpperCase();
  if(diff >= 3) body = 'El '+mine.name+' hizo los deberes y goleó al '+rival.name+' por '+myGoals+' a '+hisGoals+'. Fue una tarde redonda, de esas que enderezan una temporada.';
  else if(diff > 0) body = 'El '+mine.name+' hizo los deberes y consiguió la victoria contra el '+rival.name+' por '+myGoals+' a '+hisGoals+'. La actuación de hoy es un paso al frente en la dirección adecuada.';
  else if(diff === 0) body = 'El '+mine.name+' y el '+rival.name+' igualaron '+myGoals+' a '+hisGoals+'. Un punto que sabe distinto según de qué lado se lo mire.';
  else body = 'El '+mine.name+' cayó '+hisGoals+' a '+myGoals+' frente al '+rival.name+'. Hay material para trabajar durante la semana.';
  if(m.cupLabel){
    if(diff > 0 && diff < 3) head = 'TRIUNFO DEL '+mine.name.toUpperCase()+' ANTE EL '+rival.name.toUpperCase();
    if(m.pens){
      var wonPens = m.mySide==='home'? m.pens.h>m.pens.a : m.pens.a>m.pens.h;
      head = wonPens? 'EL '+mine.name.toUpperCase()+' PASÓ POR PENALES' : 'EL '+mine.name.toUpperCase()+' QUEDÓ AFUERA POR PENALES';
      body = 'El '+mine.name+' y el '+rival.name+' igualaron '+myGoals+' a '+hisGoals+' y se definió desde el punto penal ('+(m.mySide==='home'? m.pens.h+'-'+m.pens.a : m.pens.a+'-'+m.pens.h)+').';
    }
  }
  var shots = (m.mySide==='home'? m.homeShots : m.awayShots)||0;
  var shotsR = (m.mySide==='home'? m.awayShots : m.homeShots)||0;
  var extra = shots>shotsR+4 && diff<=0
    ? ' Llama la atención el desbalance: '+shots+' remates propios contra '+shotsR+' del rival y nada para mostrar en el marcador.'
    : (motm? ' La figura de la cancha fue '+escapeHtml(motm.p.name)+', con '+motm.rating.toFixed(1)+' de calificación.' : '');
  return '<div class="card match-report"><p class="eyebrow">Crónica del partido</p>'+
    '<div class="report-head">'+escapeHtml(head)+'</div>'+
    '<p>'+escapeHtml(body)+extra+'</p></div>';
}
function motmFromRatings(ratings, homeClub, awayClub){
  var bestId=null, bestVal=-1;
  Object.keys(ratings||{}).forEach(function(pid){
    var v = ratings[pid];
    if(v>bestVal){ bestVal=v; bestId=pid; }
  });
  if(!bestId) return null;
  var p = homeClub.players.find(function(x){return x.id===bestId;});
  var club = homeClub;
  if(!p){ p = awayClub.players.find(function(x){return x.id===bestId;}); club = awayClub; }
  if(!p) return null;
  return {p:p, club:club, rating:bestVal};
}

function addedTimeBadge(lm){

  if(lm.clock >= 45 && lm.clock <= halfEnd(lm)) extra = lm.addedFirst||0;
  else if(lm.clock >= 90) extra = lm.addedSecond||0;
  return extra? '<span class="added-time">+'+extra+'</span>' : '';
}

// el asistente en pleno partido: lo que ve y los cambios que haría, a un toque y sin pausar
function liveAssistData(lm){
  var myClub = state.teams.find(function(t){ return t.id===(lm.mySide==='home'? lm.homeId : lm.awayId); });
  var onIds = lm[lm.mySide==='home'? 'homeOnPitch' : 'awayOnPitch'] || [];
  var onPitch = onIds.map(function(id){ return myClub.players.find(function(p){ return p.id===id; }); }).filter(Boolean);
  var bench = myClub.players.filter(function(p){ return onIds.indexOf(p.id)===-1; });
  var subs = suggestSubstitutions(lm, onPitch, bench);
  var subOutIds = subs.map(function(x){ return x.outP.id; });
  // lo que se muestra: las dos más importantes, sin repetir lo que ya cubre un cambio ni dos órdenes sobre lo mismo
  var seen = {}, tips = [];
  liveInsights(lm).forEach(function(o){
    if(tips.length>=2) return;
    if(o.subOut && subOutIds.indexOf(o.subOut)!==-1) return;
    if(o.act){ if(seen[o.act[0]]) return; seen[o.act[0]] = true; }
    tips.push(o);
  });
  return {subs:subs, tips:tips};
}
function liveAssistHTML(lm){
  var d = liveAssistData(lm);
  var tips = d.tips;
  var acts = tips.filter(function(o){ return o.act; });
  var rows = tips.map(function(o){
    return '<div class="live-assist-row"><div class="live-assist-text">'+escapeHtml(o.text)+(o.hint? '<span class="muted">'+escapeHtml(o.hint)+'</span>' : '')+'</div>'+
      (o.act? '<button class="btn btn-sm btn-primary" data-action="live-shout" data-id="'+o.act[0]+':'+o.act[1]+'" type="button">'+escapeHtml(o.act[2])+'</button>'
        : (o.done? '<span class="rating-badge is-good">✓ '+escapeHtml(o.done)+'</span>' : ''))+'</div>';
  }).join('');
  rows += d.subs.map(function(s){
    return '<div class="live-assist-row"><div class="live-assist-text"><strong>Cambio:</strong> sale '+escapeHtml(s.outP.name)+', entra '+escapeHtml(s.inP.name)+
      '<span class="muted">'+escapeHtml(s.outP.name)+' '+escapeHtml(s.reason)+'.</span></div>'+
      '<button class="btn btn-sm btn-primary" data-action="live-quick-sub" data-id="'+s.outP.id+'" data-in="'+s.inP.id+'" type="button">Hacer el cambio</button></div>';
  }).join('');
  var nAll = acts.length + d.subs.length;
  var allBtn = nAll>1? '<button class="btn btn-sm btn-ghost" data-action="live-assist-all" type="button">Aplicar todo ('+nAll+')</button>' : '';
  if(!rows) rows = '<div class="live-assist-row"><div class="live-assist-text muted">Por ahora no ve nada para cambiar. Te avisa acá apenas detecte algo.</div></div>';
  var note = d.subs.length? '<p class="hint" style="margin:6px 0 0;">Los cambios se hacen al toque, sin pausar, y usan una de tus 3 ventanas (todos juntos cuentan como una).</p>' : '';
  return '<div class="live-assist"><div class="live-assist-head"><span class="live-assist-title">Tu asistente · '+lm.clock+"'</span>"+allBtn+'</div>'+rows+note+'</div>';
}
// hace los cambios sin que el usuario tenga que pausar: es como una pausa corta, cuenta una ventana
function liveQuickSubs(pairs){
  var lm = state.liveMatch;
  if(!lm || !pairs.length) return;
  var wasPlaying = lm.status==='playing';
  lm.status = 'paused';
  pairs.forEach(function(pr){
    if(!canMakeSub(lm)) return;
    liveSubOut(pr[0]);
    liveSubIn(pr[1]);
    lm.pendingSubOut = null;
  });
  if(wasPlaying){
    lm.status = 'playing';
    lm.usedWindowThisPause = false;
    if(anim && anim.key===animMatchKey(lm)){
      animReconcile(lm, state.teams.find(function(t){return t.id===lm.homeId;}), state.teams.find(function(t){return t.id===lm.awayId;}));
      animRefreshPerf();
    }
  }
}
// las órdenes rápidas desde el banco, a mano mientras se juega
function liveShoutsHTML(lm){
  var myTac = lm.mySide==='home'? lm.homeTactics : lm.awayTactics;
  var myMent = lm.mySide==='home'? lm.homeMentality : lm.awayMentality;

    return '<div class="shout-row"><span class="shout-label">'+g.label+'</span><div class="chip-row">'+g.opts.map(function(o){
      return '<button class="chip-btn shout-btn '+(cur===o[0]?'is-active':'')+'" data-action="live-shout" data-id="'+g.field+':'+o[0]+'" type="button">'+o[1]+'</button>';
    }).join('')+'</div></div>';
  }).join('');
  var last = lm.lastShout && lm.lastShout.text && (lm.clock - lm.lastShout.minute) <= 3
    ? '<p class="shout-last">Gritaste: «'+escapeHtml(lm.lastShout.text)+'»</p>' : '';
  return '<div class="shouts"><p class="eyebrow" style="margin:14px 0 6px;">Órdenes desde el banco · sin parar el partido</p>'+rows+last+'</div>';
}
/* ---------- events ---------- */
function handleAction(action, id, el){
  switch(action){
    case 'select-league': setupSelectedLeague = id; setupStep='club'; setupSelectedIdx=null; render(); break;
    case 'setup-back': setupStep='league'; setupSelectedLeague=null; setupSelectedIdx=null; render(); break;
    case 'select-club': setupSelectedIdx = Number(id); render(); break;
    case 'start-career':
      if(setupSelectedIdx===null || !setupSelectedLeague) return;
      newCareer(setupSelectedLeague, setupSelectedIdx);
      currentView='inicio'; setupStep='league'; setupSelectedLeague=null; setupSelectedIdx=null;
      render(); break;
    case 'migrate-continue': migrateCareer(); currentView='inicio'; render(); break;
    case 'migrate-skip': migrationDismissed=true; render(); break;
    case 'legacy-world-dismiss': legacyWorldDismissed=true; render(); break;
    case 'nav':
      if(currentView==='partido' && id!=='partido') stopLiveTicker();
      currentView = id; flashMessage = null; assistantOpen = false;
      if(id==='noticias' && (state.news||[]).length){
        var firstN = state.news.find(function(x){ return x.id===selectedNewsId; }) || state.news[0];
        selectedNewsId = firstN.id;
        if(!firstN.read){ firstN.read = true; saveGame(); }
      }
      render();
      if(id==='partido') startLiveTicker();
      break;
    case 'pitch-cam': pitchSetCam(id); render(); break;
    case 'snd-toggle': sndToggle(); render(); break;
    case 'skip-replay':
      if(anim){
        var skippedGoal = anim.replay && anim.replay.kind==='highlight' && anim.replay.goal;
        anim.replay = null;
        anim.hiddenGoal = null;
        anim.panelUntil = skippedGoal? anim.clock + 2.0 : 0;
      }
      render(); break;
    case 'live-shout': {
      var sp = String(id||'').split(':');
      if(state.liveMatch && sp.length===2){ liveShout(sp[0], sp[1]); saveGame(); }
      render(); break;
    }
    case 'team-talk': {
      var lmT = state.liveMatch, clubT = getMyClub();
      if(lmT && clubT && !lmT.talkDone && TEAM_TALKS[id]) applyTeamTalk(lmT, clubT, id);
      saveGame(); render(); break;
    }
    case 'open-search': globalSearchOpen = true; glossaryOpen = false; render(); break;
    case 'close-search': globalSearchOpen = false; render(); break;
    case 'open-glossary': glossaryOpen = true; globalSearchOpen = false; render(); break;
    case 'close-glossary': glossaryOpen = false; render(); break;
    case 'open-assistant': assistantOpen = true; globalSearchOpen = false; glossaryOpen = false; render(); break;
    case 'close-assistant': assistantOpen = false; render(); break;
    case 'assist-lineup': { var mcA=getMyClub(); if(mcA){ autoLineup(mcA); saveGame(); } render(); break; }
    case 'assist-apply-all': {
      var mcAll = getMyClub();
      if(mcAll && assistantVisible()){
        // cambiar el once puede cambiar lo que conviene contra el rival: se repasa hasta que no quede nada (como mucho tres vueltas)
        for(var pass=0; pass<3; pass++){
          var recsAll = assistantRecs(mcAll).list.filter(function(r){ return !r.manual; }).sort(function(a,b){ return a.order-b.order; });
          if(!recsAll.length) break;
          recsAll.forEach(function(r){ applyAssistRec(mcAll, r); });
        }
        saveGame();
      }
      render(); break;
    }
    case 'noop': break;
    case 'search-goto-view': {
      if(currentView==='partido' && id!=='partido') stopLiveTicker();
      currentView = id; globalSearchOpen = false; globalSearchQuery = ''; render();
      if(id==='partido') startLiveTicker();
      break;
    }
    case 'search-goto-club': {
      var searchClub = state.teams.find(function(t){return t.id===id;});
      if(searchClub){
        var myClubS = getMyClub();
        if(currentView==='partido') stopLiveTicker();
        if(myClubS && searchClub.id===myClubS.id) currentView = 'plantel';
        else if(myClubS && searchClub.leagueId===myClubS.leagueId){ scoutClubFilter = searchClub.id; currentView = 'mercado'; }
        else { viewingLeagueId = searchClub.leagueId; currentView = 'tabla'; }
      }
      globalSearchOpen = false; globalSearchQuery = ''; render(); break;
    }
    case 'search-goto-player': {
      var myClubP = getMyClub();
      var foundClub = null, foundYouth = false;
      state.teams.some(function(t){
        if(t.players.some(function(p){return p.id===id;})){ foundClub = t; return true; }
        if((t.youthPlayers||[]).some(function(p){return p.id===id;})){ foundClub = t; foundYouth = true; return true; }
        return false;
      });
      if(foundClub){
        if(currentView==='partido') stopLiveTicker();
        if(myClubP && foundClub.id===myClubP.id){
          currentView = foundYouth? 'juveniles' : 'plantel';
        } else if(!myClubP){
          viewingLeagueId = foundClub.leagueId; currentView = 'tabla';
        } else if(!foundYouth && foundClub.leagueId===myClubP.leagueId){
          scoutClubFilter = foundClub.id; currentView = 'mercado';
        } else if(!foundYouth){
          var foundPlayer = foundClub.players.find(function(p){return p.id===id;});
          marketSearchQuery = foundPlayer? foundPlayer.name : '';
          marketSearchPos=''; marketSearchLeague=''; marketSearchMaxAge=''; marketSearchMinAge='';
          marketSearchMinOverall=''; marketSearchMaxOverall=''; marketSearchMinPotential='';
          marketSearchMinWillingness=''; marketSearchOnlyClause=false; marketSearchMaxClause='';
          currentView = 'mercado';
        } else {
          viewingLeagueId = foundClub.leagueId; currentView = 'tabla';
        }
      }
      globalSearchOpen = false; globalSearchQuery = ''; render(); break;
    }
    case 'edit-pins-open': pinnedEditorOpen = true; pinnedNotice = null; render(); break;
    case 'edit-pins-close': pinnedEditorOpen = false; pinnedNotice = null; render(); break;
    case 'set-fixture-filter': fixtureFilter = id; render(); break;
    case 'sim-matchday': {
      if(state.liveMatch || state.pendingWeek) return;
      var cupDi = nextCupDate();
      if(cupDi!==null) beginCupDate(cupDi);
      else if(state.matchdayIdx<totalMatchdays()) beginMatchday();
      else return;
      saveGame();
      if(state.liveMatch) currentView='partido';
      render();
      startLiveTicker();
      break;
    }
    case 'live-pause': if(state.liveMatch){ state.liveMatch.status='paused'; stopLiveTicker(); saveGame(); } render(); break;
    case 'live-resume': {
      var lmR = state.liveMatch;
      if(lmR){
        lmR.status='playing'; lmR.usedWindowThisPause=false;

          animReconcile(lmR, state.teams.find(function(t){return t.id===lmR.homeId;}), state.teams.find(function(t){return t.id===lmR.awayId;}));
          animRefreshPerf();

    case 'live-passstyle': liveSetTactic('passStyle', id); saveGame(); render(); break;
