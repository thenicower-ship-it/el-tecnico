        var plR = clubR2.players.find(function(x){ return x.id===rolePickerPid; }) ||
                  (clubR2.youthPlayers||[]).find(function(x){ return x.id===rolePickerPid; });
        if(plR && ROLE_WEIGHTS[plR.pos] && ROLE_WEIGHTS[plR.pos][id]){ plR.role = id; saveGame(); }
      }
      rolePickerPid = null; render(); break;
    }
    case 'apply-advice': {
      var mc6 = getMyClub();
      if(mc6){
        var xiInfo2 = computeBestXI(mc6);
        var adv2 = tacticalAdviceForXI(xiInfo2.xi);
        mc6.formation = xiInfo2.formation;
        autoLineup(mc6);
        mc6.mentality = adv2.mentality;
        mc6.tactics.passStyle = adv2.passStyle;
        mc6.tactics.pressing = adv2.pressing;
        mc6.tactics.line = adv2.line;
        mc6.tactics.width = adv2.width;
        mc6.tactics.tempo = adv2.tempo;
        mc6.tactics.marking = adv2.marking;
        mc6.tactics.penaltyTaker = adv2.penaltyTaker? adv2.penaltyTaker.id : null;
        mc6.tactics.freeKickTaker = adv2.freeKickTaker? adv2.freeKickTaker.id : null;
        saveGame();
      }
      render(); break;
    }
    case 'apply-live-advice': {
      var lm3 = state.liveMatch;
      if(lm3 && lm3.status==='paused'){
        var teamClub3 = state.teams.find(function(t){return t.id===(lm3.mySide==='home'?lm3.homeId:lm3.awayId);});
        var sideKey3 = lm3.mySide==='home'?'homeOnPitch':'awayOnPitch';
        var xi3 = lm3[sideKey3].map(function(pid){return teamClub3.players.find(function(p){return p.id===pid;});}).filter(Boolean);
        var adv3 = tacticalAdviceForXI(xi3);
        if(lm3.mySide==='home') lm3.homeMentality = adv3.mentality; else lm3.awayMentality = adv3.mentality;
        liveSetTactic('passStyle', adv3.passStyle);
        liveSetTactic('pressing', adv3.pressing);
        liveSetTactic('line', adv3.line);
        liveSetTactic('width', adv3.width);
        liveSetTactic('tempo', adv3.tempo);
        liveSetTactic('marking', adv3.marking);
        liveSetTactic('penaltyTaker', adv3.penaltyTaker? adv3.penaltyTaker.id : null);
        liveSetTactic('freeKickTaker', adv3.freeKickTaker? adv3.freeKickTaker.id : null);
        saveGame();
      }
      render(); break;
    }
    case 'toggle-starter': { var mc2=getMyClub(); if(mc2) toggleStarter(mc2, id); saveGame(); render(); break; }
    case 'bid-accept': { var resBa = acceptBid(id); toast(resBa.msg); saveGame(); render(); break; }
    case 'bid-reject': { var resBr = rejectBid(id); toast(resBr.msg); saveGame(); render(); break; }
    case 'bid-counter': { var resBc = counterBid(id); toast(resBc.msg); saveGame(); render(); break; }
    case 'loan-out': { var resLo = loanOut(id); toast(resLo.msg); saveGame(); render(); break; }
    case 'request-loan': requestLoan(); saveGame(); render(); break;
    case 'sell-player': { var res = sellPlayer(id); flashMessage = res.msg; saveGame(); render(); break; }
    case 'hire-staff-market': { var roleH = el?el.dataset.role:null; var resHire = hireStaffFromMarket(roleH, id); flashMessage = resHire.msg; saveGame(); render(); break; }
    case 'poach-staff': { var roleP = el?el.dataset.role:null; var clubP = el?el.dataset.club:null; var resPoach = poachStaff(roleP, clubP, id); flashMessage = resPoach.msg; saveGame(); render(); break; }
    case 'intake-sign': { var resIs = intakeSign(id); toast(resIs.msg); saveGame(); render(); break; }
    case 'intake-pass': intakePass(id); saveGame(); render(); break;
    case 'intake-best': { var resIb = intakeSignBest(); toast(resIb.msg); saveGame(); render(); break; }
    case 'intake-close': if(state.youthIntake) state.youthIntake.players = []; saveGame(); render(); break;
    case 'release-youth': { var resRy = releaseYouth(id); toast(resRy.msg); saveGame(); render(); break; }
    case 'promote-youth': { var resProm = promoteYouthPlayer(id); flashMessage = resProm.msg; saveGame(); render(); break; }
    case 'promise-minutes': { var resPromise = promiseMinutes(id); flashMessage = resPromise.msg; saveGame(); render(); break; }
    case 'list-transfer': { var resList = listForTransfer(id); flashMessage = resList.msg; saveGame(); render(); break; }
    case 'renew-contract': { var resRenew = renewContract(id, 3, false); flashMessage = resRenew.msg; saveGame(); render(); toast(resRenew.msg); break; }
    case 'grant-raise': { var resRaise = grantRaise(id); flashMessage = resRaise.msg; saveGame(); render(); toast(resRaise.msg); break; }
    case 'renew-contract-clause': { var resRenewC = renewContract(id, 3, true); flashMessage = resRenewC.msg; saveGame(); render(); toast(resRenewC.msg); break; }
    case 'buy-clause': { var clubBC = el?el.dataset.club:null; var resClause = buyViaReleaseClause(id, clubBC); flashMessage = resClause.msg; saveGame(); render(); break; }
    case 'scout-player': scoutPlayer(id, el?el.dataset.club:null); saveGame(); render(); break;
    case 'offer-market': if(state.negotiation) sendOffer(state.negotiation.playerValue); saveGame(); render(); break;
    case 'offer-plus20': if(state.negotiation) sendOffer(Math.round(state.negotiation.playerValue*1.2)); saveGame(); render(); break;
    case 'offer-send': sendOffer(pendingOfferAmount); saveGame(); render(); break;
    case 'accept-counter': acceptCounter(); saveGame(); render(); break;
    case 'withdraw-negotiation': withdrawNegotiation(); saveGame(); render(); break;
    case 'close-negotiation': state.negotiation=null; saveGame(); render(); break;
    case 'accept-offer': takeJob(id); saveGame(); render(); break;
    case 'decline-offer': declineOffer(id); saveGame(); render(); break;
    case 'start-preseason': if(state.pendingWeek || !seasonFinished()) return; rolloverSeason(); currentView='inicio'; saveGame(); render(); break;
    case 'export-save': handleExport(); break;
    case 'save-now': saveNow(); break;
    case 'reset-open': confirmingReset = true; render(); break;
    case 'reset-cancel': confirmingReset = false; render(); break;
    case 'reset-confirm':
      stopLiveTicker();
      localStorage.removeItem(SAVE_KEY); cloudClear(); state=null; confirmingReset=false; currentView='inicio'; offBar();
      setupStep='league'; setupSelectedLeague=null; setupSelectedIdx=null; migrationDismissed=false; cachedMigration=undefined;
      render(); break;
  }
}
function handleChange(changeType, value, el){
  if(changeType==='formation'){
    var club = getMyClub();
    if(club){ club.formation = value; autoLineup(club); saveGame(); }
    selectedSlot = null;
    render();
  } else if(changeType==='live-formation'){
    var lmF = state.liveMatch;
    if(lmF && lmF.status==='paused'){
      liveAssignFormation(lmF, lmF.mySide, value);
      if(anim && anim.key===animMatchKey(lmF)){
        animReconcile(lmF, state.teams.find(function(t){return t.id===lmF.homeId;}), state.teams.find(function(t){return t.id===lmF.awayId;}));
        animRefreshPerf();
      }
      saveGame();
    }
    render();
  } else if(changeType==='view-cup'){
    viewingCupId = value; render();
  } else if(changeType==='view-league'){
    viewingLeagueId = value; render();
  } else if(changeType==='scout-club'){
    scoutClubFilter = value; render();
  } else if(changeType==='offer-amount'){
    pendingOfferAmount = Number(value)||0;
  } else if(changeType==='penalty-taker'){
    var club2 = getMyClub();
    if(club2){ club2.tactics.penaltyTaker = value||null; saveGame(); }
    render();
  } else if(changeType==='freekick-taker'){
    var club3 = getMyClub();
    if(club3){ club3.tactics.freeKickTaker = value||null; saveGame(); }
    render();
  } else if(changeType==='market-search-query'){
    marketSearchQuery = value; render();
  } else if(changeType==='market-search-pos'){
    marketSearchPos = value; render();
  } else if(changeType==='market-search-league'){
    marketSearchLeague = value; render();
  } else if(changeType==='market-search-maxage'){
    marketSearchMaxAge = value; render();
  } else if(changeType==='market-search-minage'){
    marketSearchMinAge = value; render();
  } else if(changeType==='market-search-minovr'){
    marketSearchMinOverall = value; render();
  } else if(changeType==='market-search-maxovr'){
    marketSearchMaxOverall = value; render();
  } else if(changeType==='market-search-minpot'){
    marketSearchMinPotential = value; render();
  } else if(changeType==='market-search-minwill'){
    marketSearchMinWillingness = value; render();
  } else if(changeType==='market-search-maxclause'){
    marketSearchMaxClause = value; render();
  } else if(changeType==='market-search-onlyclause'){
    marketSearchOnlyClause = !!(el && el.checked); render();
  } else if(changeType==='market-search-sort'){
    marketSearchSort = value; render();
  } else if(changeType==='player-role'){
    var pid = el?el.dataset.id:null;
    var clubR = getMyClub();
    if(clubR && pid){
      var pl = clubR.players.find(function(p){return p.id===pid;}) || (clubR.youthPlayers||[]).find(function(p){return p.id===pid;});
      if(pl && ROLE_WEIGHTS[pl.pos] && ROLE_WEIGHTS[pl.pos][value]){ pl.role = value; saveGame(); }
    }
    render();
  } else if(changeType==='global-search-query'){
    globalSearchQuery = value; render();
  } else if(changeType==='toggle-pin'){
    var pinId = el? el.dataset.id : null;
    if(pinId){
      if(!Array.isArray(state.pinnedViews)) state.pinnedViews = [];
      var pinIdx = state.pinnedViews.indexOf(pinId);
      var wantChecked = !!(el && el.checked);
      if(wantChecked && pinIdx===-1){
        if(state.pinnedViews.length>=6){ pinnedNotice = 'Ya tenés 6 accesos fijados. Sacá uno para agregar otro.'; }
        else { state.pinnedViews.push(pinId); pinnedNotice = null; saveGame(); }
      } else if(!wantChecked && pinIdx!==-1){
        state.pinnedViews.splice(pinIdx,1); pinnedNotice = null; saveGame();
      }
    }
    render();
  }
}
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if(el) handleAction(el.dataset.action, el.dataset.id, el);
  // el toque del usuario habilita el audio y el plan B de pantalla (solo con partido en pantalla)
  if(state && state.liveMatch && currentView==='partido'){
    sndUnlock();
    if(WL.want && WL.video && WL.video.paused) wlVideo(true);
  }
});
document.addEventListener('change', function(e){
  var el = e.target.closest('[data-change]');
  if(!el) return;
  if(el.dataset.change==='import-file'){ handleImportFile(el.files && el.files[0]); return; }
  handleChange(el.dataset.change, el.value, el);
});

/* ---------- init ---------- */
lastSaveOk = storageWorks();
state = loadGame();
LOCAL_TS0 = state? (state._ts||1) : 0;
normalizeTactics();
normalizeClubColors();
normalizeLiveMatch();
normalizePlayerHealth();
normalizeStaff();
normalizeRoles();
normalizeContracts();
normalizeManagerExtras();
normalizePinned();
normalizeNews();
normalizeCups();
render();
if(state && state.pendingSims && state.pendingSims.length) schedulePump();
else if(state && state.pendingWeek) finishPendingWeek();
if(window.claude && typeof window.claude.use === 'function'){
  window.claude.use('downloads').then(function(d){ downloadsApi = d; render(); }).catch(function(){ downloadsApi = null; });
}
offBar();
cloudInit();
</script>
